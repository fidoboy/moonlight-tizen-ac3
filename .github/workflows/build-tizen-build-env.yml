name: Build and publish Tizen build environment

on:
  push:
    branches:
      - 1.2.4-pre
    paths:
      - 'docker/tizen-build-env/**'
      - 'wmp/engine/build/fetch-tizen-sources.sh'
      - 'wmp/engine/build/build-static-crypto.sh'
      - '.github/workflows/build-tizen-build-env.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: tizen-build-env-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner's embedded DNS configuration is not being propagated
          # reliably to BuildKit. Use explicit public resolvers for RUN steps.
          buildkitd-config-inline: |
            [dns]
              nameservers = ["8.8.8.8", "1.1.1.1"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish shared Tizen build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/tizen-build-env/Dockerfile
          push: true
          # Keep build-time downloads on the runner network namespace as well.
          network: host
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:6.1-v5
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:sha-${{ github.sha }}
          cache-from: type=gha,scope=tizen-build-env
          cache-to: type=gha,mode=max,scope=tizen-build-env

      - name: Verify the complete shared build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          # La verificación funcional se ejecuta como RUN dentro de la propia
          # construcción. Aquí solo comprobamos que la etiqueta publicada existe,
          # sin descargar y extraer una imagen que llena el disco del runner.
          docker buildx imagetools inspect "$image"
