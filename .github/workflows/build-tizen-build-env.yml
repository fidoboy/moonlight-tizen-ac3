name: Build and publish Tizen build environment

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: tizen-build-env-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish shared Tizen build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/tizen-build-env/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:6.1-v4
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:sha-${{ github.sha }}
          cache-from: type=gha,scope=tizen-build-env
          cache-to: type=gha,mode=max,scope=tizen-build-env

      - name: Verify the complete shared build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v4"
          docker pull "$image"
          docker run --rm "$image" bash -lc '
            set -euo pipefail
            tz --version
            dotnet --list-sdks | grep -E "^8\\."
            test -d /usr/share/dotnet/packs/Samsung.Tizen.Ref/10.0.120
            test -x /home/tizen/tizen-studio/tools/ide/bin/tizen
            source /opt/emscripten-release-bundle/emsdk/emsdk_env.sh
            emcc --version
            cmake --version
            ninja --version
            rsvg-convert --version
            for tool in arm-linux-gnueabi-gcc arm-linux-gnueabi-ar arm-linux-gnueabi-ranlib arm-linux-gnueabi-objdump; do
              test -x "/opt/wmp-tizen-deps/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/$tool"
            done
            test -f /opt/wmp-tizen-deps/sysroot/usr/include/appcore-agent/service_app.h
            find /opt/wmp-tizen-deps/sysroot/usr/include -type f -name message_port.h -print -quit | grep -q .
            find /opt/wmp-tizen-deps/sysroot/usr/include -type f -name dlog.h -print -quit | grep -q .
            test -d /opt/wmp-backport-deps/openssl111
            test -d /opt/wmp-backport-deps/curl759
            bsdtar --version
            rpm2cpio --help >/dev/null
          '
