name: Build and publish Tizen build environment

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "docker/tizen-build-env/Dockerfile"
      - ".github/workflows/build-tizen-build-env.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: tizen-build-env-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish shared Tizen build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/tizen-build-env/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:6.1-v3
            ghcr.io/${{ github.repository_owner }}/moonlight-tizen-build-env:sha-${{ github.sha }}
          cache-from: type=gha,scope=tizen-build-env
          cache-to: type=gha,mode=max,scope=tizen-build-env

  verify-workload:
    needs: publish
    uses: ./.github/workflows/diagnose-tizen-dotnet-workload.yml
