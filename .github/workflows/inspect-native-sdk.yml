name: Inspect Tizen native SDK for WMP hybrid build

on:
  push:
    branches:
      - 1.2.0-pre-wpm_test
    paths:
      - '.github/workflows/inspect-native-sdk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout the WMP test branch only
        uses: actions/checkout@v5
        with:
          ref: 1.2.0-pre-wpm_test

      - name: Install Tizen Web CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8
          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"
          echo "$RUNNER_TEMP/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Install the native CLI and Tizen 6.0 ARM toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          "$pm" show-pkgs --tree | tee "$RUNNER_TEMP/tizen-packages.txt"
          required=(NativeCLI NativeToolchain-Gcc-9.2 MOBILE-6.0-NativeAppDevelopment-CLI)
          for package in "${required[@]}"; do
            if ! awk -v wanted="$package" '$2 == wanted {found=1} END {exit !found}' "$RUNNER_TEMP/tizen-packages.txt"; then
              echo "::error::Required SDK package is not advertised: $package"
              exit 1
            fi
          done
          "$pm" install --accept-license --no-java-check "$(IFS=,; echo "${required[*]}")"
          printf 'Installed native SDK packages: %s\n' "${required[*]}"

      - name: Report native templates, rootstraps and CLI commands
        shell: bash
        run: |
          set -euo pipefail
          tizen list native-project | tee "$RUNNER_TEMP/native-project-templates.txt"
          tizen list rootstrap | tee "$RUNNER_TEMP/native-rootstraps.txt"
          tizen manual build-app | tee "$RUNNER_TEMP/build-app-manual.txt"
          tizen manual build-native | tee "$RUNNER_TEMP/build-native-manual.txt"

      - name: Upload SDK discovery report
        uses: actions/upload-artifact@v6
        with:
          name: tizen-native-sdk-discovery
          path: |
            ${{ runner.temp }}/tizen-packages.txt
            ${{ runner.temp }}/native-project-templates.txt
            ${{ runner.temp }}/native-rootstraps.txt
            ${{ runner.temp }}/build-app-manual.txt
            ${{ runner.temp }}/build-native-manual.txt
          if-no-files-found: error
          retention-days: 3
