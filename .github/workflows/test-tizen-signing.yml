name: Test Tizen signing profile (CI)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizen-signing-profile-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-signing-profile:
    name: Create and validate Tizen signing profile
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Cache Tizen Studio SDK
        uses: actions/cache@v4
        with:
          path: \${{ runner.temp }}/tizen-studio
          key: tizen-studio-6.1-tizen-10.0-generic-native-\${{ runner.os }}-v1

      - name: Install Tizen Web and Native SDKs
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/tizen-studio"
          need_apt=false
          if ! command -v expect >/dev/null 2>&1 || ! command -v add-apt-repository >/dev/null 2>&1; then
            need_apt=true
          fi
          if [[ "$need_apt" == true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends expect software-properties-common
          fi
          if ! command -v python3.8 >/dev/null 2>&1 || ! ldconfig -p 2>/dev/null | grep -q 'libpython3[.]8[.]so'; then
            if ! grep -Rqs 'deadsnakes/ppa' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
              sudo add-apt-repository -y ppa:deadsnakes/ppa
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3.8 libpython3.8
          fi
          if [[ ! -x "$sdk/tools/ide/bin/tizen" ]]; then
            echo "Tizen Studio cache miss; installing SDK and required native components."
            installer="$RUNNER_TEMP/tizen-web-cli.bin"
            curl --fail --location --retry 3 --output "$installer" https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
            chmod +x "$installer"
            "$installer" --accept-license "$sdk"
            pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
            if [[ -z "$pm" ]]; then
              echo "::error::Tizen Package Manager CLI was not found after SDK installation." >&2
              exit 1
            fi
            required="NativeCLI,NativeToolchain-Gcc-9.2,NativeToolchain-Gcc-14.2,TIZEN-10.0-NativeAppDevelopment-CLI"
            "$pm" install --accept-license --no-java-check "$required"
          else
            echo "Tizen Studio SDK restored from cache; skipping SDK installation."
          fi
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"

      - name: Create and validate headless signing profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TIZEN_STUDIO_DATA_PATH"
          password="$(python3 - <<'PY'
          import secrets, string
          groups = (string.ascii_uppercase, string.ascii_lowercase, string.digits, "!@#$%^&*()-_=+")
          chars = [secrets.choice(group) for group in groups]
          alphabet = "".join(groups)
          chars.extend(secrets.choice(alphabet) for _ in range(16 - len(chars)))
          secrets.SystemRandom().shuffle(chars)
          print("".join(chars))
          PY
          )"
          if [[ \${#password} -lt 8 || \${#password} -gt 16 ]] ||
             ! [[ "$password" =~ [A-Z] ]] ||
             ! [[ "$password" =~ [a-z] ]] ||
             ! [[ "$password" =~ [0-9] ]] ||
             ! [[ "$password" =~ [^A-Za-z0-9] ]]; then
            echo "::error::Generated password does not satisfy Tizen's 8-16 character complexity policy." >&2
            exit 1
          fi
          echo "::add-mask::$password"
          echo "TIZEN_CERT_PASSWORD=$password" >> "$GITHUB_ENV"
          export TIZEN_CERT_PASSWORD="$password"

          echo "::group::1/7 Generate author certificate"
          if ! tizen certificate -a MoonlightHybrid -f MoonlightHybrid -p "$TIZEN_CERT_PASSWORD"; then
            echo "::error::Tizen failed to generate the author certificate." >&2
            exit 1
          fi
          author_keystore="$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.p12"
          if [[ ! -s "$author_keystore" ]]; then
            echo "::error::Author PKCS#12 file was not created or is empty." >&2
            exit 1
          fi
          echo "Author PKCS#12 created."
          echo "::endgroup::"

          echo "::group::2/7 Register signing profile"
          if ! tizen security-profiles add -n MoonlightHybrid -a "$author_keystore" -p "$TIZEN_CERT_PASSWORD"; then
            echo "::error::Tizen failed to register the MoonlightHybrid signing profile." >&2
            exit 1
          fi
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          if [[ ! -s "$profiles" ]]; then
            echo "::error::Tizen did not create a non-empty profiles.xml." >&2
            exit 1
          fi
          echo "Signing profile registered."
          echo "::endgroup::"

          echo "::group::3/7 Validate SDK distributor credentials"
          author_pwd="$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.pwd"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          distributor_keystore="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12"
          if [[ ! -s "$distributor_pwd" ]]; then
            echo "::error::SDK distributor password file is missing or empty." >&2
            exit 1
          fi
          if [[ ! -s "$distributor_keystore" ]]; then
            echo "::error::SDK distributor PKCS#12 file is missing or empty." >&2
            exit 1
          fi
          echo "SDK distributor credentials are present."
          echo "::endgroup::"

          echo "::group::4/7 Normalize and inspect profiles.xml"
          sed -i -e "s|$author_pwd||g" -e "s|$distributor_pwd|tizenpkcs12passfordsigner|g" "$profiles"
          if grep -Fq "$author_pwd" "$profiles"; then
            echo "::error::Author .pwd reference remains in profiles.xml." >&2
            exit 1
          fi
          if grep -Fq "$distributor_pwd" "$profiles"; then
            echo "::error::Distributor .pwd reference remains in profiles.xml." >&2
            exit 1
          fi
          if ! grep -Fq "$author_keystore" "$profiles"; then
            echo "::error::profiles.xml does not reference the generated author keystore." >&2
            exit 1
          fi
          if ! grep -Fq "tizen-distributor-signer.p12" "$profiles"; then
            echo "::error::profiles.xml does not reference the SDK distributor keystore." >&2
            exit 1
          fi
          python3 - "$profiles" <<'PY'
          import sys, xml.etree.ElementTree as ET
          try:
              ET.parse(sys.argv[1])
          except Exception as exc:
              raise SystemExit(f"profiles.xml is not well-formed XML: {exc}")
          PY
          echo "profiles.xml is valid and references both keystores."
          echo "::endgroup::"

          echo "::group::5/7 Validate author PKCS#12 password"
          if ! openssl pkcs12 -in "$author_keystore" -passin env:TIZEN_CERT_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::OpenSSL rejected the generated author PKCS#12 password." >&2
            exit 1
          fi
          echo "Author PKCS#12 password accepted."
          echo "::endgroup::"

          echo "::group::6/7 Configure Tizen CLI"
          if ! tizen cli-config "profiles.path=$profiles"; then
            echo "::error::Tizen CLI rejected profiles.path." >&2
            exit 1
          fi
          echo "Tizen CLI profile path configured."
          echo "::endgroup::"

          echo "::group::7/7 Confirm profile is selectable"
          if ! tizen security-profiles list | grep -Fq "MoonlightHybrid"; then
            echo "::error::MoonlightHybrid is not listed by Tizen CLI after configuration." >&2
            exit 1
          fi
          echo "Signing profile passed all checks."
          echo "::endgroup::"

      - name: Report safe diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "No Tizen CLI log files are uploaded because they may contain signing credentials."
          if [[ -d "$RUNNER_TEMP/tizen-studio-data/profile" ]]; then
            find "$RUNNER_TEMP/tizen-studio-data/profile" -maxdepth 1 -type f -printf 'Profile metadata present: %f (%s bytes)\\n' | sort
          fi
