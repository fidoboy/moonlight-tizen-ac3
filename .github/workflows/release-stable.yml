name: Generate stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version to publish; must match res/config.xml and must not already exist'
        required: true
        type: string

permissions:
  contents: write
  packages: read

# Serialize attempts for the same version without cancelling an active publication.
concurrency:
  group: stable-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build release WGT packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_updated: ${{ steps.release-tag.outputs.updated }}
    steps:
      - name: Validate workflow branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::This workflow can only be started manually using workflow_dispatch (received: $EVENT_NAME)." >&2
            exit 1
          fi
          if [[ "$REF" != "refs/heads/master" ]]; then
            echo "::error::Stable releases can only be produced from master. The workflow was started from '$REF'." >&2
            exit 1
          fi
          echo "Workflow dispatch confirmed on master."

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: master
          submodules: recursive

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$REQUESTED_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable semantic version such as 1.0.0, got: $VERSION." >&2
            exit 1
          fi
          if [[ ! -f "res/config.xml" ]]; then
            echo "::error::Required version file res/config.xml does not exist." >&2
            exit 1
          fi
          CONFIG_VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1 || true)"
          if [[ -z "$CONFIG_VERSION" ]]; then
            echo "::error::Could not read a valid version attribute from res/config.xml." >&2
            exit 1
          fi
          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "::error::Release version $VERSION does not match res/config.xml ($CONFIG_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject an already published release version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL")"
          if [[ "$status" == "200" ]]; then
            echo "::error::Release $RELEASE_TAG already exists. Delete the existing GitHub Release before publishing this version again, or increase the version in res/config.xml and the workflow input." >&2
            exit 1
          elif [[ "$status" != "404" ]]; then
            echo "::error::Could not verify whether release $RELEASE_TAG already exists (HTTP $status)." >&2
            cat "$RUNNER_TEMP/existing-release.json" >&2
            exit 1
          fi
          echo "No existing GitHub Release found for $RELEASE_TAG."

      - name: Validate release notes format
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "::error::Required release notes file $NOTES_FILE does not exist." >&2
            exit 1
          fi
          FIRST_LINE="$(head -n 1 "$NOTES_FILE" | tr -d '\r')"
          if [[ "$FIRST_LINE" != "## Highlights" ]]; then
            echo "::error::The first line of $NOTES_FILE must be exactly '## Highlights'." >&2
            exit 1
          fi

      - name: Validate matching changelog entry
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          CHANGELOG_FILE="CHANGELOG.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "::error::Required changelog file $CHANGELOG_FILE does not exist." >&2
            exit 1
          fi
          LATEST_CHANGELOG_VERSION="$(awk '/^## v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ { print $2; exit }' "$CHANGELOG_FILE")"
          if [[ -z "$LATEST_CHANGELOG_VERSION" ]]; then
            echo "::error::No versioned release entries were found in $CHANGELOG_FILE. Add a '## v$RELEASE_VERSION' entry before publishing." >&2
            exit 1
          fi
          if [[ "$LATEST_CHANGELOG_VERSION" != "v$RELEASE_VERSION" ]]; then
            echo "::error::The changelog entry for v$RELEASE_VERSION is not the latest entry. The latest version listed is $LATEST_CHANGELOG_VERSION. Move the v$RELEASE_VERSION section to the top of $CHANGELOG_FILE before publishing." >&2
            exit 1
          fi
          echo "The latest changelog entry is v$RELEASE_VERSION."

      - name: Prepare release notes with version changelog details
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          CHANGELOG_FILE="CHANGELOG.md"
          VERSIONED_ENTRY="$RUNNER_TEMP/version-changelog-entry.md"

          # Extract only the requested version section, stopping before the next version heading.
          awk -v target="v$RELEASE_VERSION" '
            $0 == "## " target || index($0, "## " target " ") == 1 { in_entry=1; next }
            in_entry && /^## v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ { exit }
            in_entry { print }
          ' "$CHANGELOG_FILE" > "$VERSIONED_ENTRY"

          if ! grep -q '[^[:space:]]' "$VERSIONED_ENTRY"; then
            echo "::error::The changelog entry for v$RELEASE_VERSION is empty. Add its details to $CHANGELOG_FILE before publishing." >&2
            exit 1
          fi

          {
            printf '## 🔥 Highlights\n\n'
            tail -n +2 .github/release-notes.md

            printf '\n\n---\n\n## Download the installer\n\n'
            printf 'These standalone executables install Moonlight Tizen on your Samsung TV. Each one includes everything you need, including the app packages, so there’s no need to install additional components or dependencies. Once the installation on the TV is complete, the installation wizard can be deleted and will leave no traces behind, except for the certificate itself, which is created for future installations. Download the version that matches the operating system and processor architecture of the computer you’ll be using:\n\n'
            printf '| Platform | Download |\n'
            printf '|---|---|\n'
            printf '| Windows (x64) | [MoonlightTizenInstaller.exe](https://github.com/%s/releases/download/%s/MoonlightTizenInstaller.exe) |\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '| Linux (x64) | [MoonlightTizenInstaller](https://github.com/%s/releases/download/%s/MoonlightTizenInstaller) |\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '| macOS (Intel) | [MoonlightTizenInstaller-osx-x64](https://github.com/%s/releases/download/%s/MoonlightTizenInstaller-osx-x64) |\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '| macOS (Apple Silicon) | [MoonlightTizenInstaller-osx-arm64](https://github.com/%s/releases/download/%s/MoonlightTizenInstaller-osx-arm64) |\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"

            printf '\n\n---\n\n<details>\n<summary>⚙️ Changelog details for v%s</summary>\n\n' "$RELEASE_VERSION"
            cat "$VERSIONED_ENTRY"
            printf '\n\n</details>\n'
          } > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Move release tag to the current source commit
        id: release-tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY"
          REF_URL="$API_ROOT/git/refs/tags/$RELEASE_TAG"
          status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$REF_URL" || true)"
          if [[ "$status" == "200" ]]; then
            status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
              --request PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg sha "$GITHUB_SHA" '{sha: $sha, force: true}')" \
              "$REF_URL")"
            expected_status="200"
          elif [[ "$status" == "404" ]]; then
            status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$GITHUB_SHA" '{ref: $ref, sha: $sha}')" \
              "$API_ROOT/git/refs")"
            expected_status="201"
          else
            echo "Failed to inspect release tag $RELEASE_TAG (HTTP $status)." >&2
            cat /tmp/tag-update.json >&2
            exit 1
          fi
          if [[ "$status" != "$expected_status" ]]; then
            echo "Failed to create or move release tag $RELEASE_TAG to $GITHUB_SHA (HTTP $status)." >&2
            cat /tmp/tag-update.json >&2
            exit 1
          fi
          echo "Created or moved $RELEASE_TAG to $GITHUB_SHA."
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Prepare persistent ccache directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore Moonlight Web compiler cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-
            moonlight-web-ccache-${{ runner.os }}-


      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull Tizen build image from GHCR
        shell: bash
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"

      - name: Build WMP engine and .NET ServiceApp inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e WMP_DEPS=/opt/wmp-tizen-deps \
            -e WMP_BACKPORT_DEPS=/opt/wmp-backport-deps \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            "$image" bash -lc '
              set -euo pipefail
              for tool in autoconf automake autoreconf libtoolize pkg-config; do command -v "$tool" >/dev/null; done
              test -x "$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              test -s /opt/wmp-backport-deps/arm-static/lib/libcrypto.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libssl.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libcurl.a
              echo "::group::WMP transport and native unit tests"
              node tests/wmp_transport_test.js
              cc -std=c99 -Wall -Wextra -Werror -pthread -Imoonlight-common-c/src -Iwmp/engine/mlclient -Iwmp/service/src -Iopus/include wmp/tests/wmp_audio_passthrough_test.c -o /runner-temp/wmp-audio-passthrough-test
              /runner-temp/wmp-audio-passthrough-test
              bash wmp/tests/wmp_esplus_abi_test.sh
              echo "::endgroup::"
              ARM_GCC="$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              ARM_GCC_DIR="$(dirname "$ARM_GCC")"
              for tool in g++ nm ranlib; do
                found="$(find "$WMP_DEPS/toolchain" -type f -name "arm-linux-gnueabi-$tool" -perm -u+x -print -quit)"
                test -n "$found"
                target="$ARM_GCC_DIR/arm-linux-gnueabi-$tool"
                if [[ ! -x "$target" ]]; then ln -sfn "$found" "$target"; fi
              done
              CCACHE_BIN=/runner-temp/wmp-ccache-bin
              mkdir -p "$CCACHE_BIN" "$CCACHE_DIR"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/arm-linux-gnueabi-gcc"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/gcc"
              export CCACHE_COMPILERCHECK=content
              export CCACHE_BASEDIR=/workspace
              export PATH="$CCACHE_BIN:$ARM_GCC_DIR:$PATH"
              ccache --version
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" OUT=/runner-temp/wmp-deps-build JOBS=2 bash wmp/engine/build/build-deps-lib.sh
              export FFMPEG_ARM_PREFIX=/runner-temp/ffmpeg-arm-install
              export FFMPEG_ARM_WORK_DIR=/runner-temp/ffmpeg-arm-build
              bash scripts/build-ffmpeg-arm.sh
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" FFMPEG_ARM_PREFIX="$FFMPEG_ARM_PREFIX" DEPSBUILD=/runner-temp/wmp-deps-build OUT=/runner-temp/wmp-engine-build BUILD_VARIANT=release WMP_MLT_TRACE=false bash wmp/engine/mlclient/build-engine-so.sh
              echo "::group::WMP ARM ccache statistics"
              ccache --show-stats
              echo "::endgroup::"
              test -s /runner-temp/wmp-engine-build/libmlengine.so
              readelf -h /runner-temp/wmp-engine-build/libmlengine.so | grep -F "Machine:" | grep -F "ARM"
              mkdir -p wmp/dotnet-host/lib
              cp /runner-temp/wmp-engine-build/libmlengine.so wmp/dotnet-host/lib/libmlengine.so
              echo "WMP native engine built. The managed host will be compiled and packaged by its Tizen Core dependency project."
            '
      - name: Restore compiler cache ownership after WMP build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore FFmpeg WebAssembly build cache
        id: restore-ffmpeg-cache
        uses: actions/cache/restore@v6
        with:
          path: ffmpeg-install
          key: ffmpeg-wasm-9.0.2-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg-build/**', '!ffmpeg-install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Build release Web payload once inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moonlight-home"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e HOME=/runner-temp/moonlight-home \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            -e EMSDK=/opt/emscripten-release-bundle/emsdk \
            -e BUILD_TYPE=release \
            -e DEBUG_MODE=false \
            -e FORCE_GAME_MODE=false \
            -e LOG_SHOW_PRIVATE_DATA=false \
            -e OFFICIAL_RELEASE=true \
            -e REPO_OWNER="$GITHUB_REPOSITORY_OWNER" \
            -e REPO_NAME="${GITHUB_REPOSITORY#*/}" \
            "$image" bash scripts/build-moonlight-web.sh "/runner-temp/moonlight-web"

      - name: Save FFmpeg WebAssembly build cache
        if: success() && steps.restore-ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ffmpeg-install
          key: ffmpeg-wasm-9.0.2-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg-build/**', '!ffmpeg-install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Prepare compiler cache ownership for saving
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/moonlight-home/.cache/ccache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"
          fi

      - name: Save Moonlight Web compiler cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare standard and ForceGM Web payloads from one build
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/moonlight-web/web"
          test -s "$source/config.xml"
          test -s "$source/index.html"
          test -s "$source/moonlight-wasm.js"
          test -s "$source/moonlight-wasm.wasm"
          test -s "$source/service/service.js"

          # Both WGTs use the exact same compiled Web files. Only the
          # Samsung Game Mode metadata differs between their config.xml files.
          cp -a "$source" "$RUNNER_TEMP/web-standard"
          cp -a "$source" "$RUNNER_TEMP/web-forcegm"

          standard_config="$RUNNER_TEMP/web-standard/config.xml"
          forcegm_config="$RUNNER_TEMP/web-forcegm/config.xml"
          if grep -Fq 'key="http://samsung.com/tv/metadata/use.game.mode"' "$standard_config"; then
            echo "::error::Standard release unexpectedly contains the ForceGM metadata."
            exit 1
          fi

          python3 - "$forcegm_config" <<'PY'
          import sys
          from pathlib import Path

          config = Path(sys.argv[1])
          content = config.read_text(encoding="utf-8")
          marker = '<tizen:metadata key="http://samsung.com/tv/metadata/use.voiceguide"'
          metadata = '<tizen:metadata key="http://samsung.com/tv/metadata/use.game.mode" value="true"/>\n    '
          if 'key="http://samsung.com/tv/metadata/use.game.mode"' in content:
              raise SystemExit("ForceGM metadata already exists in the source config.xml")
          if content.count(marker) != 1:
              raise SystemExit(f"Expected exactly one voiceguide metadata insertion point; found {content.count(marker)}")
          config.write_text(content.replace(marker, metadata + marker, 1), encoding="utf-8")
          PY

          grep -Fq 'key="http://samsung.com/tv/metadata/use.game.mode" value="true"' "$forcegm_config"
          if grep -Fq 'key="http://samsung.com/tv/metadata/use.game.mode"' "$standard_config"; then
            echo "::error::Standard release unexpectedly contains the ForceGM metadata."
            exit 1
          fi
          for project in "$RUNNER_TEMP/web-standard" "$RUNNER_TEMP/web-forcegm"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
          done

      - name: Package standard and ForceGM hybrid WGTs
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          for variant in standard forcegm; do
            temp_dir="$RUNNER_TEMP/release-$variant"
            mkdir -p "$temp_dir"
            cp -a "$RUNNER_TEMP/web-$variant" "$temp_dir/web"
            if [[ "$variant" == "standard" ]]; then
              output_name="Moonlight.wgt"
              base_wgt="MoonlightWeb-base.wgt"
            else
              output_name="Moonlight-ForceGM.wgt"
              base_wgt="Moonlight-ForceGM-base.wgt"
            fi
            docker run --rm -i --user root \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -v "$RUNNER_TEMP:/runner-temp" \
              -w /workspace \
              -e RUNNER_TEMP="/runner-temp/release-$variant" \
              -e GITHUB_SHA="$GITHUB_SHA" \
              -e BUILD_OUTPUT_NAME="$output_name" \
              -e BASE_WGT_NAME="$base_wgt" \
              -e DOTNET_BUILD_CONFIGURATION=Release \
              "$image" bash /workspace/scripts/package-hybrid-wgt.sh
          done

      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done

      - name: Collect standard and ForceGM release WGTs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$RUNNER_TEMP/release-standard/hybrid-output/Moonlight.wgt" dist/Moonlight.wgt
          cp "$RUNNER_TEMP/release-forcegm/hybrid-output/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight.wgt
          test -s dist/Moonlight-ForceGM.wgt
          sha256sum dist/Moonlight.wgt dist/Moonlight-ForceGM.wgt

      - name: Prepare WGT packages and release notes for installer builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs
          cp dist/Moonlight.wgt dist/Moonlight-ForceGM.wgt release-inputs/
          cp "$RUNNER_TEMP/release-notes.md" release-inputs/release-notes.md
          test -s release-inputs/Moonlight.wgt
          test -s release-inputs/Moonlight-ForceGM.wgt
          test -s release-inputs/release-notes.md

      - name: Upload WGT packages and release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-inputs
          path: release-inputs/*
          if-no-files-found: error
          retention-days: 1

      - name: Delete GitHub Release if the workflow fails
        if: ${{ always() && steps.release-tag.outputs.updated == 'true' && (failure() || cancelled()) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY"
          RELEASE_URL="$API_ROOT/releases/tags/$RELEASE_TAG"

          # Retry transient network errors, rate limits and GitHub 5xx responses.
          # GitHub may report primary/secondary rate limits as HTTP 403; do not
          # retry ordinary permission-related 403 responses.
          api_request() {
            local output="$1"
            shift
            local headers="${output}.headers"
            local status attempt retryable
            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --output "$output" --dump-header "$headers" --write-out '%{http_code}' "$@" || true)"
              retryable=false
              if [[ "$status" == "000" || "$status" == "429" || "$status" =~ ^5 ]]; then
                retryable=true
              elif [[ "$status" == "403" ]] && {
                grep -Eqi 'rate limit exceeded|secondary rate limit|abuse detection' "$output" 2>/dev/null ||
                grep -Eqi '^x-ratelimit-remaining:[[:space:]]*0' "$headers" 2>/dev/null
              }; then
                retryable=true
              fi
              if [[ "$retryable" == false ]]; then
                printf '%s' "$status"
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                echo "Transient GitHub API response HTTP $status; retrying ($attempt/5)..." >&2
                sleep "$((attempt * 2))"
              fi
            done
            printf '%s' "$status"
          }

          status="$(api_request "$RUNNER_TEMP/release-lookup.json" \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$RELEASE_URL")"

          if [[ "$status" == "404" ]]; then
            echo "No GitHub Release exists for $RELEASE_TAG; nothing to delete."
          elif [[ "$status" == "200" ]]; then
            release_id="$(jq -er '.id' "$RUNNER_TEMP/release-lookup.json")"
            status="$(api_request "$RUNNER_TEMP/release-delete.json" \
              --request DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API_ROOT/releases/$release_id")"
            if [[ "$status" != "204" && "$status" != "404" ]]; then
              echo "::error::Could not delete failed GitHub Release $RELEASE_TAG after retries (HTTP $status)." >&2
              cat "$RUNNER_TEMP/release-delete.json" >&2
              exit 1
            fi
            echo "Deleted failed GitHub Release $RELEASE_TAG."
          else
            echo "::error::Could not inspect GitHub Release $RELEASE_TAG after retries (HTTP $status)." >&2
            cat "$RUNNER_TEMP/release-lookup.json" >&2
            exit 1
          fi

      - name: Delete release tag if the workflow fails
        if: ${{ always() && steps.release-tag.outputs.updated == 'true' && (failure() || cancelled()) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          REF_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"

          # Retry transient network errors, rate limits and GitHub 5xx responses.
          # GitHub may report primary/secondary rate limits as HTTP 403; do not
          # retry ordinary permission-related 403 responses.
          api_request() {
            local output="$1"
            shift
            local headers="${output}.headers"
            local status attempt retryable
            for attempt in 1 2 3 4 5; do
              status="$(curl --silent --show-error --output "$output" --dump-header "$headers" --write-out '%{http_code}' "$@" || true)"
              retryable=false
              if [[ "$status" == "000" || "$status" == "429" || "$status" =~ ^5 ]]; then
                retryable=true
              elif [[ "$status" == "403" ]] && {
                grep -Eqi 'rate limit exceeded|secondary rate limit|abuse detection' "$output" 2>/dev/null ||
                grep -Eqi '^x-ratelimit-remaining:[[:space:]]*0' "$headers" 2>/dev/null
              }; then
                retryable=true
              fi
              if [[ "$retryable" == false ]]; then
                printf '%s' "$status"
                return 0
              fi
              if [[ "$attempt" -lt 5 ]]; then
                echo "Transient GitHub API response HTTP $status; retrying ($attempt/5)..." >&2
                sleep "$((attempt * 2))"
              fi
            done
            printf '%s' "$status"
          }

          status="$(api_request "$RUNNER_TEMP/tag-delete.json" \
            --request DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$REF_URL")"
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            echo "::error::Could not delete unpublished release tag $RELEASE_TAG after retries (HTTP $status)." >&2
            cat "$RUNNER_TEMP/tag-delete.json" >&2
            exit 1
          fi
          echo "Deleted unpublished release tag $RELEASE_TAG after workflow failure or cancellation."

  validate-installer:
    name: Validate installer translations
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Validate installer translations
        run: python3 scripts/check-installer-localization.py

  build-installers:
    name: Build installer (${{ matrix.rid }})
    needs:
      - publish
      - validate-installer
    runs-on: ${{ matrix.rid == 'win-x64' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - linux-x64
          - osx-x64
          - osx-arm64
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Download freshly built WGT packages
        uses: actions/download-artifact@v6
        with:
          name: release-inputs
          path: release-inputs

      - name: Validate and stage embedded WGT packages
        shell: bash
        run: |
          set -euo pipefail
          for package in Moonlight.wgt Moonlight-ForceGM.wgt; do
            test -s "release-inputs/$package"
            unzip -tq "release-inputs/$package"
            cp "release-inputs/$package" "Installer/src/MoonlightTizenInstaller/$package"
          done

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Installer/src/MoonlightTizenInstaller/MoonlightTizenInstaller.csproj --runtime ${{ matrix.rid }}

      - name: Publish self-contained single-file executable
        run: dotnet publish Installer/src/MoonlightTizenInstaller/MoonlightTizenInstaller.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/publish

      - name: Smoke-test Windows application startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/publish/MoonlightTizenInstaller.exe"
          $startupLog = Join-Path $env:TEMP "MoonlightTizenInstaller-startup-error.log"
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              if (Test-Path $startupLog) {
                Write-Host "Application startup exception:"
                Get-Content $startupLog
              }
              throw "MoonlightTizenInstaller.exe exited during the startup smoke test (exit code $($process.ExitCode))."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Prepare single-file distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dist
          executable="MoonlightTizenInstaller"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            executable="MoonlightTizenInstaller.exe"
          else
            chmod +x "artifacts/publish/$executable"
          fi
          test -s "artifacts/publish/$executable"
          cp "artifacts/publish/$executable" "artifacts/dist/$executable"
          test "$(find artifacts/dist -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload installer executable
        uses: actions/upload-artifact@v6
        with:
          name: MoonlightTizenInstaller-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish complete stable release
    needs:
      - publish
      - build-installers
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Download WGT packages and release notes
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: release-inputs
          path: release-inputs

      - name: Download Windows installer
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: MoonlightTizenInstaller-win-x64
          path: installer-win-x64

      - name: Download Linux installer
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: MoonlightTizenInstaller-linux-x64
          path: installer-linux-x64

      - name: Download macOS Intel installer
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: MoonlightTizenInstaller-osx-x64
          path: installer-osx-x64

      - name: Download macOS Apple Silicon installer
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: MoonlightTizenInstaller-osx-arm64
          path: installer-osx-arm64

      - name: Assemble all six release assets
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release-inputs/Moonlight.wgt dist/Moonlight.wgt
          cp release-inputs/Moonlight-ForceGM.wgt dist/Moonlight-ForceGM.wgt
          cp installer-win-x64/MoonlightTizenInstaller.exe dist/MoonlightTizenInstaller.exe
          cp installer-linux-x64/MoonlightTizenInstaller dist/MoonlightTizenInstaller
          cp installer-osx-x64/MoonlightTizenInstaller dist/MoonlightTizenInstaller-osx-x64
          cp installer-osx-arm64/MoonlightTizenInstaller dist/MoonlightTizenInstaller-osx-arm64
          cp release-inputs/release-notes.md "$RUNNER_TEMP/release-notes.md"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          test -s dist/Moonlight.wgt
          test -s dist/Moonlight-ForceGM.wgt
          sha256sum dist/*

      - name: Publish public GitHub Release
        if: needs.publish.result == 'success' && needs.build-installers.result == 'success'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.publish.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support v${{ needs.publish.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
            dist/MoonlightTizenInstaller.exe
            dist/MoonlightTizenInstaller
            dist/MoonlightTizenInstaller-osx-x64
            dist/MoonlightTizenInstaller-osx-arm64
          body_path: ${{ runner.temp }}/release-notes.md

      - name: Remove unpublished release and tag if installer build or publication fails
        if: ${{ always() && needs.publish.outputs.tag_updated == 'true' && (needs.publish.result != 'success' || needs.build-installers.result != 'success' || failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes
          fi
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" ":refs/tags/$RELEASE_TAG" || {
            echo "::error::Could not remove the unpublished tag $RELEASE_TAG."
            exit 1
          }
          echo "Removed the unpublished release and tag $RELEASE_TAG."
