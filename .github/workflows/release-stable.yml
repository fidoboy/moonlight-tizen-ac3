name: Generate stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version to publish; must match res/config.xml and must not already exist'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  packages: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    name: Build and publish release WGT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          UPDATE_RELEASE_NOTES: ${{ contains(github.event.head_commit.message, '[release-notes-fix]') }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.0.0, got: $VERSION" >&2
            exit 1
          fi
          CONFIG_VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Release version $VERSION does not match res/config.xml ($CONFIG_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$UPDATE_RELEASE_NOTES" == "true" ]]; then
            echo "mode=update-notes" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate matching changelog entry
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHANGELOG_FILE="CHANGELOG.md"
          if [[ ! -f "$CHANGELOG_FILE" ]]; then
            echo "::error::Required changelog file $CHANGELOG_FILE does not exist." >&2
            exit 1
          fi
          if ! awk -v version="v$RELEASE_VERSION" '$0 == "## " version || index($0, "## " version " ") == 1 { found=1 } END { exit !found }' "$CHANGELOG_FILE"; then
            echo "::error::No changelog entry found for v$RELEASE_VERSION in $CHANGELOG_FILE. Add a '## v$RELEASE_VERSION' section before publishing." >&2
            exit 1
          fi
          echo "Found changelog entry for v$RELEASE_VERSION."

      - name: Reject an already published release version
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/existing-release.json" --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL")"
          if [[ "$status" == "200" ]]; then
            echo "::error::Release $RELEASE_TAG already exists. Delete the existing GitHub Release before publishing this version again, or increase the version in res/config.xml and the workflow input." >&2
            exit 1
          elif [[ "$status" != "404" ]]; then
            echo "::error::Could not verify whether release $RELEASE_TAG already exists (HTTP $status)." >&2
            cat "$RUNNER_TEMP/existing-release.json" >&2
            exit 1
          fi
          echo "No existing GitHub Release found for $RELEASE_TAG."

      - name: Validate release notes format
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "::error::Required release notes file $NOTES_FILE does not exist." >&2
            exit 1
          fi
          FIRST_LINE="$(head -n 1 "$NOTES_FILE" | tr -d '\r')"
          if [[ "$FIRST_LINE" != "## Highlights" ]]; then
            echo "::error::The first line of $NOTES_FILE must be exactly '## Highlights'." >&2
            exit 1
          fi

      - name: Prepare release notes with changelog link
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          CHANGELOG_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CHANGELOG.md#v${RELEASE_VERSION//./}"
          {
            cat .github/release-notes.md
            printf '\n\n---\n\n**Changelog:** [View changes for v%s](%s)\n' "$RELEASE_VERSION" "$CHANGELOG_URL"
          } > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Ensure required versioned MP4 assets are available
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          ASSET_URL="https://raw.githubusercontent.com/fidoboy/moonlight-tizen-ac3/build-assets/$ASSET_FILE"
          ASSET_PATH="$RUNNER_TEMP/video-assets/$ASSET_FILE"
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"

          download_asset() {
            local status
            status="$(curl --silent --show-error --location --output "$ASSET_PATH" --write-out '%{http_code}' "$ASSET_URL")"
            printf '%s' "$status"
          }

          status="$(download_asset)"
          if [[ "$status" == "404" ]]; then
            echo "Video asset ZIP not found on build-assets; starting the asset-generation workflow."
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' \
              "$API_URL")"
            if [[ "$dispatch_status" != "204" ]]; then
              echo "::error::Could not start Generate video assets (HTTP $dispatch_status). The workflow token needs Actions write permission." >&2
              cat "$RUNNER_TEMP/video-assets/dispatch-response.json" >&2
              exit 1
            fi

            # Wait for the ZIP to be published. Do not regenerate if the ZIP already exists.
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(download_asset)"
              if [[ "$status" == "200" ]]; then
                break
              fi
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for the generated video asset ZIP." >&2
                exit 1
              fi
            done
            if [[ "$status" != "200" ]]; then
              echo "::error::The video asset ZIP was not published within 20 minutes. Check the Generate video assets workflow run." >&2
              exit 1
            fi
          elif [[ "$status" != "200" ]]; then
            echo "::error::Could not download the video asset ZIP (HTTP $status)." >&2
            exit 1
          fi

          # A present but invalid ZIP is an error; generation is only triggered when the ZIP is missing.
          if ! unzip -tq "$ASSET_PATH" >/dev/null; then
            echo "::error::The video asset ZIP exists but is invalid; refusing to regenerate it automatically." >&2
            exit 1
          fi
          unzip -oq "$ASSET_PATH" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty in the existing ZIP." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Update existing public release notes
        if: steps.version.outputs.mode == 'update-notes'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY"
          status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/releases/tags/$RELEASE_TAG")"
          if [[ "$status" != "200" ]]; then
            echo "Cannot update notes: release $RELEASE_TAG lookup returned HTTP $status." >&2
            cat /tmp/release.json >&2
            exit 1
          fi
          RELEASE_ID="$(jq -er '.id' /tmp/release.json)"
          jq -n --rawfile body "$RUNNER_TEMP/release-notes.md" '{body: $body}' > /tmp/release-patch.json
          status="$(curl --silent --show-error --output /tmp/release-updated.json --write-out '%{http_code}' \
            --request PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/release-patch.json \
            "$API_ROOT/releases/$RELEASE_ID")"
          if [[ "$status" != "200" ]]; then
            echo "Failed to update release $RELEASE_TAG (HTTP $status)." >&2
            cat /tmp/release-updated.json >&2
            exit 1
          fi
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and (.body | startswith("## Highlights"))' /tmp/release-updated.json >/dev/null
          echo "Updated release notes for $RELEASE_TAG without rebuilding or replacing the WGT assets."

      - name: Move release tag to the current source commit
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY"
          REF_URL="$API_ROOT/git/refs/tags/$RELEASE_TAG"
          status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$REF_URL" || true)"
          if [[ "$status" == "200" ]]; then
            status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
              --request PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg sha "$GITHUB_SHA" '{sha: $sha, force: true}')" \
              "$REF_URL")"
            expected_status="200"
          elif [[ "$status" == "404" ]]; then
            status="$(curl --silent --show-error --output /tmp/tag-update.json --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$GITHUB_SHA" '{ref: $ref, sha: $sha}')" \
              "$API_ROOT/git/refs")"
            expected_status="201"
          else
            echo "Failed to inspect release tag $RELEASE_TAG (HTTP $status)." >&2
            cat /tmp/tag-update.json >&2
            exit 1
          fi
          if [[ "$status" != "$expected_status" ]]; then
            echo "Failed to create or move release tag $RELEASE_TAG to $GITHUB_SHA (HTTP $status)." >&2
            cat /tmp/tag-update.json >&2
            exit 1
          fi
          echo "Created or moved $RELEASE_TAG to $GITHUB_SHA."

      - name: Prepare persistent ccache directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore Moonlight Web compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-
            moonlight-web-ccache-${{ runner.os }}-


      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull Tizen build image from GHCR
        shell: bash
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"

      - name: Build WMP engine and .NET ServiceApp inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e WMP_DEPS=/opt/wmp-tizen-deps \
            -e WMP_BACKPORT_DEPS=/opt/wmp-backport-deps \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            "$image" bash -lc '
              set -euo pipefail
              for tool in autoconf automake autoreconf libtoolize pkg-config; do command -v "$tool" >/dev/null; done
              test -x "$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              test -s /opt/wmp-backport-deps/arm-static/lib/libcrypto.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libssl.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libcurl.a
              echo "::group::WMP transport and native unit tests"
              node tests/wmp_transport_test.js
              cc -std=c99 -Wall -Wextra -Werror -pthread -Imoonlight-common-c/src -Iwmp/engine/mlclient -Iwmp/service/src -Iopus/include wmp/tests/wmp_audio_passthrough_test.c -o /runner-temp/wmp-audio-passthrough-test
              /runner-temp/wmp-audio-passthrough-test
              bash wmp/tests/wmp_esplus_abi_test.sh
              echo "::endgroup::"
              ARM_GCC="$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              ARM_GCC_DIR="$(dirname "$ARM_GCC")"
              for tool in g++ nm ranlib; do
                found="$(find "$WMP_DEPS/toolchain" -type f -name "arm-linux-gnueabi-$tool" -perm -u+x -print -quit)"
                test -n "$found"
                target="$ARM_GCC_DIR/arm-linux-gnueabi-$tool"
                if [[ ! -x "$target" ]]; then ln -sfn "$found" "$target"; fi
              done
              CCACHE_BIN=/runner-temp/wmp-ccache-bin
              mkdir -p "$CCACHE_BIN" "$CCACHE_DIR"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/arm-linux-gnueabi-gcc"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/gcc"
              export CCACHE_COMPILERCHECK=content
              export CCACHE_BASEDIR=/workspace
              export PATH="$CCACHE_BIN:$ARM_GCC_DIR:$PATH"
              ccache --version
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" OUT=/runner-temp/wmp-deps-build JOBS=2 bash wmp/engine/build/build-deps-lib.sh
              export FFMPEG_ARM_PREFIX=/runner-temp/ffmpeg-arm-install
              export FFMPEG_ARM_WORK_DIR=/runner-temp/ffmpeg-arm-build
              bash scripts/build-ffmpeg-arm.sh
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" FFMPEG_ARM_PREFIX="$FFMPEG_ARM_PREFIX" DEPSBUILD=/runner-temp/wmp-deps-build OUT=/runner-temp/wmp-engine-build BUILD_VARIANT=release WMP_MLT_TRACE=false bash wmp/engine/mlclient/build-engine-so.sh
              echo "::group::WMP ARM ccache statistics"
              ccache --show-stats
              echo "::endgroup::"
              test -s /runner-temp/wmp-engine-build/libmlengine.so
              readelf -h /runner-temp/wmp-engine-build/libmlengine.so | grep -F "Machine:" | grep -F "ARM"
              mkdir -p wmp/dotnet-host/lib
              cp /runner-temp/wmp-engine-build/libmlengine.so wmp/dotnet-host/lib/libmlengine.so
              echo "WMP native engine built. The managed host will be compiled and packaged by its Tizen Core dependency project."
            '
      - name: Restore compiler cache ownership after WMP build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore FFmpeg WebAssembly build cache
        id: restore-ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg-install
          key: ffmpeg-wasm-9.0.2-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg-build/**', '!ffmpeg-install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Build the release Moonlight Web payload inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moonlight-home"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e HOME=/runner-temp/moonlight-home \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            -e EMSDK=/opt/emscripten-release-bundle/emsdk \
            -e BUILD_TYPE=release \
            -e DEBUG_MODE=false \
            -e LOG_SHOW_PRIVATE_DATA=false \
            -e REPO_OWNER="$GITHUB_REPOSITORY_OWNER" \
            -e REPO_NAME="${GITHUB_REPOSITORY#*/}" \
            "$image" bash scripts/build-moonlight-web.sh /runner-temp/moonlight-web

      - name: Save FFmpeg WebAssembly build cache
        if: success() && steps.restore-ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-install
          key: ffmpeg-wasm-9.0.2-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg-build/**', '!ffmpeg-install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Prepare compiler cache ownership for saving
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/moonlight-home/.cache/ccache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"
          fi

      - name: Save Moonlight Web compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Extract unsigned Moonlight Web files
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/moonlight-web/web" "$RUNNER_TEMP/web"
          for project in "$RUNNER_TEMP/web"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
          done

      - name: Package the Tizen Core hybrid workspaces
        shell: bash
        env:
          BUILD_OUTPUT_NAME: Moonlight.wgt
          BASE_WGT_NAME: MoonlightWeb-base.wgt
          DOTNET_BUILD_CONFIGURATION: Release
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm -i --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e RUNNER_TEMP=/runner-temp \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e BUILD_OUTPUT_NAME="$BUILD_OUTPUT_NAME" \
            -e BASE_WGT_NAME="$BASE_WGT_NAME" \
            -e DOTNET_BUILD_CONFIGURATION="$DOTNET_BUILD_CONFIGURATION" \
            "$image" bash /workspace/scripts/package-hybrid-wgt.sh
      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done

      - name: Collect the single release WGT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$RUNNER_TEMP/hybrid-output/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt
          sha256sum dist/Moonlight.wgt

      - name: Publish public GitHub Release
        if: steps.version.outputs.mode == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support v${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
          body_path: ${{ runner.temp }}/release-notes.md
