name: Generate stable release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths:
      - 'res/config.xml'
      - '.github/workflows/release-stable.yml'
      - '.github/release-notes.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'New semantic version to publish; must match res/config.xml and must not already exist'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || (github.event_name == 'push' && github.ref == 'refs/heads/master' && (contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[release-notes-fix]')))
    name: Build and publish versioned WGTs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          UPDATE_RELEASE_NOTES: ${{ contains(github.event.head_commit.message, '[release-notes-fix]') }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semantic version such as 1.0.0, got: $VERSION" >&2
            exit 1
          fi
          CONFIG_VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          if [[ "$VERSION" != "$CONFIG_VERSION" ]]; then
            echo "Release version $VERSION does not match res/config.xml ($CONFIG_VERSION)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$UPDATE_RELEASE_NOTES" == "true" ]]; then
            echo "mode=update-notes" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure required versioned MP4 assets are available
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          ASSET_URL="https://raw.githubusercontent.com/fidoboy/moonlight-tizen-ac3/build-assets/$ASSET_FILE"
          ASSET_PATH="$RUNNER_TEMP/video-assets/$ASSET_FILE"
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"

          download_asset() {
            local status
            status="$(curl --silent --show-error --location --output "$ASSET_PATH" --write-out '%{http_code}' "$ASSET_URL")"
            printf '%s' "$status"
          }

          status="$(download_asset)"
          if [[ "$status" == "404" ]]; then
            echo "Video asset ZIP not found on build-assets; starting the asset-generation workflow."
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' \
              "$API_URL")"
            if [[ "$dispatch_status" != "204" ]]; then
              echo "::error::Could not start Generate video assets (HTTP $dispatch_status). The workflow token needs Actions write permission." >&2
              cat "$RUNNER_TEMP/video-assets/dispatch-response.json" >&2
              exit 1
            fi

            # Wait for the ZIP to be published. Do not regenerate if the ZIP already exists.
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(download_asset)"
              if [[ "$status" == "200" ]]; then
                break
              fi
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for the generated video asset ZIP." >&2
                exit 1
              fi
            done
            if [[ "$status" != "200" ]]; then
              echo "::error::The video asset ZIP was not published within 20 minutes. Check the Generate video assets workflow run." >&2
              exit 1
            fi
          elif [[ "$status" != "200" ]]; then
            echo "::error::Could not download the video asset ZIP (HTTP $status)." >&2
            exit 1
          fi

          # A present but invalid ZIP is an error; generation is only triggered when the ZIP is missing.
          if ! unzip -tq "$ASSET_PATH" >/dev/null; then
            echo "::error::The video asset ZIP exists but is invalid; refusing to regenerate it automatically." >&2
            exit 1
          fi
          unzip -oq "$ASSET_PATH" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty in the existing ZIP." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Validate release notes format
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes.md"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Release notes file $NOTES_FILE is missing or empty." >&2
            exit 1
          fi
          FIRST_LINE="$(head -n 1 "$NOTES_FILE" | tr -d '\r')"
          case "$FIRST_LINE" in
            "## Highlights"|"## What's Changed"|"## What's Changed:")
              ;;
            *)
              echo "Invalid release notes heading: '$FIRST_LINE'." >&2
              echo "The first line must be exactly '## Highlights' or '## What's Changed' (optionally followed by a colon), as required by the in-app update notes parser." >&2
              exit 1
              ;;
          esac

      - name: Update existing public release notes
        if: steps.version.outputs.mode == 'update-notes'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          API_ROOT="https://api.github.com/repos/$GITHUB_REPOSITORY"
          status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_ROOT/releases/tags/$RELEASE_TAG")"
          if [[ "$status" != "200" ]]; then
            echo "Cannot update notes: release $RELEASE_TAG lookup returned HTTP $status." >&2
            cat /tmp/release.json >&2
            exit 1
          fi
          RELEASE_ID="$(jq -er '.id' /tmp/release.json)"
          jq -n --rawfile body .github/release-notes.md '{body: $body}' > /tmp/release-patch.json
          status="$(curl --silent --show-error --output /tmp/release-updated.json --write-out '%{http_code}' \
            --request PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/release-patch.json \
            "$API_ROOT/releases/$RELEASE_ID")"
          if [[ "$status" != "200" ]]; then
            echo "Failed to update release $RELEASE_TAG (HTTP $status)." >&2
            cat /tmp/release-updated.json >&2
            exit 1
          fi
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and (.body | startswith("## Highlights"))' /tmp/release-updated.json >/dev/null
          echo "Updated release notes for $RELEASE_TAG without rebuilding or replacing the WGT assets."

      - name: Refuse to overwrite an existing public release
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          if [[ "$status" == "200" ]]; then
            echo "Release $RELEASE_TAG already exists. Refusing to overwrite a published version." >&2
            exit 1
          fi
          if [[ "$status" != "404" ]]; then
            echo "Unexpected GitHub API status $status while checking $RELEASE_TAG." >&2
            cat /tmp/release.json >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.version.outputs.mode == 'publish'
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT
        if: steps.version.outputs.mode == 'publish'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            OFFICIAL_RELEASE=true
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt
          sha256sum dist/Moonlight.wgt

      - name: Build ForceGM WGT
        if: steps.version.outputs.mode == 'publish'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-release:forcegm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            OFFICIAL_RELEASE=true
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract ForceGM WGT
        if: steps.version.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-release:forcegm)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight-ForceGM.wgt
          sha256sum dist/Moonlight-ForceGM.wgt

      - name: Publish public GitHub Release
        if: steps.version.outputs.mode == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support v${{ steps.version.outputs.version }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
          body_path: .github/release-notes.md
