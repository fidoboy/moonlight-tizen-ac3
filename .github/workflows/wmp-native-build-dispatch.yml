name: Dispatch WMP native ARM build

on:
  workflow_dispatch:
    inputs:
      tv_libs_archive_url:
        description: "HTTPS URL of a TAR archive containing the target TV's usr/lib/* libraries"
        required: true
        type: string
      tv_libs_archive_sha256:
        description: "Optional SHA-256 checksum of the archive"
        required: false
        type: string

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch build on wmp_mode
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch WMP build workflow on wmp_mode
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wmp-native-build.yml',
              ref: 'wmp_mode',
              inputs: {
                tv_libs_archive_url: ${{ toJSON(inputs.tv_libs_archive_url) }},
                tv_libs_archive_sha256: ${{ toJSON(inputs.tv_libs_archive_sha256) }}
              }
            });
            core.info('WMP native ARM build dispatched on wmp_mode.');
