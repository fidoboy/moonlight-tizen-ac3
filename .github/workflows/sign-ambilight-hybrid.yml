name: Sign Moonlight Ambilight hybrid package

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Build workflow run ID containing Moonlight-Ambilight-Build-Inputs
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: moonlight-ambilight-sign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sign:
    name: Sign previously built hybrid package inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Install signing prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 unzip zip
      - name: Install Tizen Core packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8
          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"
          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          "$pm" install --accept-license --no-java-check "NativeCLI,TIZEN-9.0-WebAppDevelopment-CLI"
          core_cli="$sdk/tools/tizen-core/tz"
          test -x "$core_cli"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$core_cli" >> "$GITHUB_ENV"
      - name: Download reusable build inputs
        uses: actions/download-artifact@v4
        with:
          name: Moonlight-Ambilight-Build-Inputs
          path: ${{ runner.temp }}/build-inputs
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify downloaded inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build-inputs"
          sha256sum --check SHA256SUMS
          unzip -tq Moonlight-Web-Base.wgt
          unzip -tq Moonlight-Ambilight-Service.tpk
          test -s ambilight.js
          test -s Program.cs
      - name: Verify Tizen Core pack support
        shell: bash
        run: |
          set -euo pipefail
          "$TIZEN_CORE_CLI" --version
          "$TIZEN_CORE_CLI" pack --help | tee "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--ref-pkgs' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--base-pkg' "$RUNNER_TEMP/tizen-core-pack-help.txt"
      - name: Create CI signing profile
        shell: bash
        env:
          CERT_PASSWORD: MoonlightHybrid2026
        run: |
          set -euo pipefail
          password_length="${#CERT_PASSWORD}"
          if (( password_length < 8 )) || [[ ! "$CERT_PASSWORD" =~ [A-Z] ]] || [[ ! "$CERT_PASSWORD" =~ [a-z] ]] || [[ ! "$CERT_PASSWORD" =~ [0-9] ]]; then
            echo "::error::The Tizen author-certificate password does not meet Tizen policy."
            exit 1
          fi
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile" "$TIZEN_STUDIO_DATA_PATH/keystore/author"
          author_cert="$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.p12"
          author_pwd="$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.pwd"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' '<profiles active="" version="3.1"></profiles>' > "$profiles"
          "$TIZEN_CORE_CLI" cert --name MoonlightHybrid --password "$CERT_PASSWORD" --cert-file "$author_cert"
          test -s "$author_cert"
          printf '%s' "$CERT_PASSWORD" > "$author_pwd"
          chmod 600 "$author_pwd"
          printf '%s' "$CERT_PASSWORD" | cmp -s - "$author_pwd"
          "$TIZEN_CORE_CLI" security-profiles add --name MoonlightHybrid --xml-path "$profiles" --author "$author_cert" --password "$CERT_PASSWORD"
          test -s "$profiles"
          "$TIZEN_CORE_CLI" set --profiles-path "$profiles"
          echo "TIZEN_PROFILES=$profiles" >> "$GITHUB_ENV"
      - name: Resolve package input paths
        shell: bash
        run: |
          cp "$RUNNER_TEMP/build-inputs/Moonlight-Web-Base.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          echo "AMBILIGHT_SERVICE_TPK=$RUNNER_TEMP/build-inputs/Moonlight-Ambilight-Service.tpk" >> "$GITHUB_ENV"

      - name: Package Web UI and .NET service as one hybrid WGT
        shell: bash
        run: |
          set -euo pipefail
          draft="$RUNNER_TEMP/Moonlight-Ambilight-Samsung-TV-Hybrid-Tizen65.wgt"
          patched="$RUNNER_TEMP/Moonlight-Ambilight-Samsung-TV-Hybrid-Tizen55.wgt"
          output="$RUNNER_TEMP/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt"

          "$TIZEN_CORE_CLI" pack \
            --type wgt \
            --sign-profile MoonlightHybrid \
            --profiles-path "$TIZEN_PROFILES" \
            --ref-pkgs "$AMBILIGHT_SERVICE_TPK" \
            --base-pkg "$RUNNER_TEMP/Moonlight-Web-Base.wgt" \
            --out-path "$draft"

          # Preserve the upstream .NET service TPK exactly as built (Tizen API 9,
          # package platform API 6.5). Only the outer hybrid package floor must stay
          # at Moonlight's Tizen 5.5 minimum. The service app retains api-version=9
          # and will not be launched by Moonlight on platforms below Tizen 6.5.
          python3 - "$draft" "$patched" <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          source_path, output_path = sys.argv[1:3]
          ET.register_namespace("", "http://tizen.org/ns/packages")

          with zipfile.ZipFile(source_path, "r") as source:
              names = source.namelist()
              if "tizen-manifest.xml" not in names:
                  raise SystemExit("Hybrid WGT has no root tizen-manifest.xml")
              manifest = ET.fromstring(source.read("tizen-manifest.xml"))
              if manifest.get("api-version") != "6.5":
                  raise SystemExit("Expected the original hybrid package API floor 6.5 before adjustment")
              service_app = next((node for node in manifest.iter()
                                  if node.tag.endswith("service-application")), None)
              if service_app is None or service_app.get("api-version") != "9":
                  raise SystemExit("The embedded .NET service must retain its original API 9 target")

              manifest.set("api-version", "5.5")
              patched_manifest = ET.tostring(manifest, encoding="UTF-8", xml_declaration=True)

              with zipfile.ZipFile(output_path, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  for entry in source.infolist():
                      data = patched_manifest if entry.filename == "tizen-manifest.xml" else source.read(entry.filename)
                      output.writestr(entry, data)

          with zipfile.ZipFile(output_path) as result:
              final_manifest = ET.fromstring(result.read("tizen-manifest.xml"))
              service_app = next((node for node in final_manifest.iter()
                                  if node.tag.endswith("service-application")), None)
              if final_manifest.get("api-version") != "5.5":
                  raise SystemExit("Hybrid container minimum must remain Tizen 5.5")
              if service_app is None or service_app.get("api-version") != "9":
                  raise SystemExit("Hybrid packaging changed the original service API 9 target")
          print("Hybrid container minimum set to Tizen 5.5; embedded .NET service remains API 9.")
          PY

          # Re-sign the modified outer WGT using the certificate paths and .pwd
          # credentials stored in the temporary Tizen security profile. The .NET
          # service TPK build itself remains unchanged.
          "$TIZEN_CORE_CLI" pack \
            --type wgt \
            --sign-profile MoonlightHybrid \
            --profiles-path "$TIZEN_PROFILES" \
            --base-pkg "$patched" \
            --out-path "$output"

          test -s "$output"
          echo "HYBRID_WGT=$output" >> "$GITHUB_ENV"

      - name: Validate the single hybrid WGT and AppControl contract
        shell: bash
        run: |
          set -euo pipefail
          package="$HYBRID_WGT"
          unzip -t "$package"

          python3 - "$package" $RUNNER_TEMP/build-inputs/ambilight.js $RUNNER_TEMP/build-inputs/Program.cs <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import PurePosixPath

          package_path, js_path, cs_path = sys.argv[1:]
          with zipfile.ZipFile(package_path) as package:
              names = set(package.namelist())
              required = {
                  "tizen-manifest.xml",
                  "res/wgt/config.xml",
                  "res/wgt/index.html",
                  "res/wgt/platform/ambilight.js",
                  "author-signature.xml",
                  "signature1.xml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Hybrid WGT is missing: " + ", ".join(missing))

              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in hybrid WGT: {name}")

              web = ET.fromstring(package.read("res/wgt/config.xml"))
              web_app = next((node for node in web.iter()
                              if node.tag.endswith("application")), None)
              service = ET.fromstring(package.read("tizen-manifest.xml"))
              service_app = next((node for node in service.iter()
                                  if node.tag.endswith("service-application")), None)
              if service.get("api-version") != "5.5":
                  raise SystemExit("Hybrid package installation minimum must remain Tizen 5.5")

              if web_app is None or web_app.get("id") != "MoonLightS.MoonlightWasm":
                  raise SystemExit("Packaged Moonlight Web application identity is invalid")
              if web_app.get("package") != "MoonLightS":
                  raise SystemExit("Packaged Web package ID is invalid")
              if web_app.get("required_version") != "5.5":
                  raise SystemExit("Moonlight's packaged minimum Tizen version must remain 5.5")
              if service.get("package") != "MoonLightS":
                  raise SystemExit("Packaged .NET service package ID differs from Web package")
              if service_app is None or service_app.get("appid") != "MoonLightS.MoonlightAmbilight":
                  raise SystemExit("Packaged Ambilight service application ID is invalid")
              if service_app.get("type") != "dotnet" or service_app.get("exec") != "MoonlightAmbilight.dll":
                  raise SystemExit("Packaged service is not the expected .NET Tizen application")
              if service_app.get("api-version") != "9":
                  raise SystemExit("Packaged optional service must preserve the original upstream API 9 target")

              assemblies = [name for name in names
                            if PurePosixPath(name).name == "MoonlightAmbilight.dll"]
              if not assemblies:
                  raise SystemExit("Packaged .NET service assembly is missing")

          with open(js_path, encoding="utf-8") as file:
              js = file.read()
          with open(cs_path, encoding="utf-8") as file:
              cs = file.read()

          contract = [
              "MoonLightS.MoonlightAmbilight",
              "new tizen.ApplicationControlData('command'",
              "new tizen.ApplicationControlData('wledIp'",
              "new tizen.ApplicationControlData('wledPort'",
              "new tizen.ApplicationControlData('ledCount'",
              "initialize",
              "shutdown",
              "MINIMUM_SERVICE_PLATFORM_VERSION",
              "http://tizen.org/feature/platform.version",
          ]
          for token in contract:
              if token not in js:
                  raise SystemExit("Web AppControl contract is missing: " + token)
          for token in ['"command"', '"wledIp"', '"wledPort"', '"ledCount"', '"initialize"', '"start"', '"stop"', '"shutdown"']:
              if token not in cs:
                  raise SystemExit("The .NET service does not handle AppControl field: " + token)

          print("Validated one signed hybrid WGT: Moonlight Web/WASM + .NET Tizen service.")
          print("Validated matching Web-to-.NET AppControl application ID and start/stop fields.")
          PY

          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$package" "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt"
          sha256sum "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt" \
            > "$RUNNER_TEMP/hybrid-output/SHA256SUMS"

      - name: Show signing diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \\
            \\( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \\) \\
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
      - name: Upload signed hybrid WGT
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Ambilight-Samsung-TV-Hybrid
          path: ${{ runner.temp }}/hybrid-output/
          if-no-files-found: error
          retention-days: 14
