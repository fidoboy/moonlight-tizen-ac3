name: Build hybrid WGC (CI)

on:
  workflow_dispatch:
    inputs:
      web_ref:
        description: "Moonlight web branch or tag to package"
        required: true
        default: master
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: wmp-hybrid-${{ inputs.web_ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Build WMP engine and native service
    uses: ./.github/workflows/wmp-native-build.yml

  package-hybrid:
    name: Assemble unsigned hybrid WGT
    needs: build-native
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight web application
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.web_ref }}
          submodules: recursive

      - name: Check out WMP service packaging metadata
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: wmp_mode
          path: wmp-source
          fetch-depth: 1

      - name: Download native WMP build outputs
        uses: actions/download-artifact@v6
        with:
          name: wmp-native-arm-${{ github.sha }}
          path: ${{ runner.temp }}/wmp-native

      - name: Validate native build outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/wmp-native/wmp/build/service/bin/wmp-service"
          test -s "$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so"
          file "$RUNNER_TEMP/wmp-native/wmp/build/service/bin/wmp-service"
          file "$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so"

      - name: Ensure required versioned MP4 assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the Moonlight web WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-wmp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract base web WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create "moonlight-wmp-web:$GITHUB_SHA")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          test -s "$RUNNER_TEMP/Moonlight-Web-Base.wgt"

      - name: Assemble unsigned hybrid WGT
        shell: bash
        run: |
          set -euo pipefail
          service_binary="$RUNNER_TEMP/wmp-native/wmp/build/service/bin/wmp-service"
          engine="$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so"
          manifest="wmp-source/wmp/service/tizen-manifest.xml"
          web_wgt="$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          output="$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt"

          # The native job already cross-compiles both ARM ELF files. This job
          # only assembles the Tizen hybrid package; Apps2Samsung signs it for
          # the selected TV immediately before installation.
          python3 - "$service_binary" "$manifest" "$web_wgt" "$engine" "$output" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          import xml.etree.ElementTree as ET

          binary, manifest, web_wgt, engine, output = map(Path, sys.argv[1:])
          for path in (binary, manifest, web_wgt, engine):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required hybrid input is missing or empty: {path}")

          root = ET.parse(manifest).getroot()
          if root.attrib.get("package") != "MoonLightS":
              raise SystemExit("Native manifest package ID must be MoonLightS")
          service = next((n for n in root.iter() if n.tag.endswith("service-application")), None)
          if service is None or service.attrib.get("appid") != "MoonLightS.WmpService":
              raise SystemExit("Native service application identity is invalid")
          if service.attrib.get("exec") != "wmp-service":
              raise SystemExit("Native service executable must be wmp-service")

          entries = {
              "bin/wmp-service": binary,
              "lib/libmlengine.so": engine,
              "info/manifest.xml": manifest,
          }
          with zipfile.ZipFile(web_wgt) as web:
              for member in web.infolist():
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in base web WGT: {member.filename}")
                  if not path.parts or member.is_dir():
                      continue
                  if path.name in {"author-signature.xml", "signature1.xml", "signature2.xml"}:
                      continue
                  name = (PurePosixPath("res/wgt") / path).as_posix()
                  if name in entries:
                      raise SystemExit(f"Duplicate hybrid package entry: {name}")
                  entries[name] = web.read(member)

          required = {
              "bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml",
              "res/wgt/config.xml", "res/wgt/index.html", "res/wgt/service/service.js",
              "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm"
          }
          missing = sorted(required - entries.keys())
          if missing:
              raise SystemExit("Hybrid package inputs are missing: " + ", ".join(missing))

          config = ET.fromstring(entries["res/wgt/config.xml"])
          web_app = next((n for n in config.iter() if n.tag.endswith("application")), None)
          if web_app is None or web_app.attrib.get("id") != "MoonLightS.MoonlightWasm" or web_app.attrib.get("package") != "MoonLightS":
              raise SystemExit("Web application identity does not match the native package")
          version = config.attrib.get("version")
          if not version:
              raise SystemExit("Web config.xml has no application version")
          root.set("version", version)
          entries["info/manifest.xml"] = ET.tostring(root, encoding="utf-8", xml_declaration=True)

          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name, source in sorted(entries.items()):
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  mode = 0o755 if name == "bin/wmp-service" else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  data = source if isinstance(source, bytes) else source.read_bytes()
                  archive.writestr(info, data)

          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              names = set(archive.namelist())
              signature_names = {"author-signature.xml", "signature1.xml", "signature2.xml"}
              if any(PurePosixPath(n).name in signature_names for n in names):
                  raise SystemExit("Unsigned CI artifact unexpectedly contains signature files")
          print(f"Created unsigned hybrid WGT: {output} ({len(entries)} files)")
          PY
          test -s "$output"
          sha256sum "$output" | tee "$RUNNER_TEMP/Moonlight-WMP-Hybrid.sha256"

      - name: Upload unsigned hybrid WGT candidate for inspection
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-WMP-Hybrid-unsigned-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/Moonlight-WMP-Hybrid.wgt
          if-no-files-found: error
          retention-days: 7

      - name: Inspect unsigned hybrid WGT and native linkage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file
          inspection="$RUNNER_TEMP/hybrid-inspection"
          mkdir -p "$inspection"
          python3 - "$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt" "$inspection" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          package, output = Path(sys.argv[1]), Path(sys.argv[2]).resolve()
          required = {
              "bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml",
              "res/wgt/config.xml", "res/wgt/service/service.js", "res/wgt/index.html",
              "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm",
              "res/wgt/static/css/style.css", "res/wgt/static/locales/en-US.json"
          }
          with zipfile.ZipFile(package) as archive:
              entries = archive.infolist()
              names = {entry.filename for entry in entries}
              print("WGT archive entries:")
              for entry in entries:
                  print(f"  {entry.filename} ({entry.file_size} bytes)")
              missing = sorted(required - names)
              if missing: raise SystemExit("Missing WGT entries: " + ", ".join(missing))

              # CI intentionally emits an unsigned package. Apps2Samsung signs
              # this WGT with the certificate belonging to the target TV.
              signature_names = {"author-signature.xml", "signature1.xml", "signature2.xml"}
              unexpected = sorted(n for n in names if Path(n).name in signature_names)
              if unexpected:
                  raise SystemExit("Unsigned WGT contains signature artefacts: " + ", ".join(unexpected))
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts: raise SystemExit(f"Unsafe WGT path: {name}")
              for name in ("bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml"):
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
              config = ET.fromstring(archive.read("res/wgt/config.xml"))
              web = next((n for n in config.iter() if n.tag.endswith("application")), None)
              if web is None or web.attrib.get("id") != "MoonLightS.MoonlightWasm" or web.attrib.get("package") != "MoonLightS":
                  raise SystemExit("Web application identity is incorrect")
              manifest = ET.fromstring(archive.read("info/manifest.xml"))
              native = next((n for n in manifest.iter() if n.tag.endswith("service-application")), None)
              if manifest.attrib.get("package") != "MoonLightS" or native is None:
                  raise SystemExit("Native manifest package or service application is missing")
              if native.attrib.get("appid") != "MoonLightS.WmpService" or native.attrib.get("exec") != "wmp-service":
                  raise SystemExit("Native service identity is incorrect")
              print(f"Unsigned hybrid WGT validated: {len(names)} entries; web app and native service are present.")
          PY
          file "$inspection/bin/wmp-service" "$inspection/lib/libmlengine.so"
          readelf -h "$inspection/bin/wmp-service" > "$inspection/wmp-service-elf-header.txt"
          readelf -d "$inspection/bin/wmp-service" > "$inspection/wmp-service-dynamic.txt"
          readelf -h "$inspection/lib/libmlengine.so" > "$inspection/libmlengine-elf-header.txt"
          readelf -d "$inspection/lib/libmlengine.so" > "$inspection/libmlengine-dynamic.txt"
          grep -q 'Machine:.*ARM' "$inspection/wmp-service-elf-header.txt"
          grep -q 'Machine:.*ARM' "$inspection/libmlengine-elf-header.txt"
          grep -q 'Shared library: \[libmlengine.so\]' "$inspection/wmp-service-dynamic.txt"
          grep -q 'Library runpath: \[\$ORIGIN/../lib\]' "$inspection/wmp-service-dynamic.txt"
          if grep -q 'NEEDED.*libesplusplayer' "$inspection/libmlengine-dynamic.txt"; then
            echo "::error::libmlengine.so must load ESPlus from TV firmware, not DT_NEEDED." >&2
            exit 1
          fi
          if grep -Eq 'NEEDED.*lib(ssl|crypto|curl)\.so' "$inspection/libmlengine-dynamic.txt"; then
            echo "::error::libmlengine.so must contain the private static OpenSSL/cURL stack." >&2
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt" | tee "$inspection/sha256.txt"
          cp "$inspection/sha256.txt" "$RUNNER_TEMP/Moonlight-WMP-Hybrid.sha256"
          cp "$inspection/wmp-service-dynamic.txt" "$RUNNER_TEMP/"
          cp "$inspection/libmlengine-dynamic.txt" "$RUNNER_TEMP/"

      - name: Upload unsigned hybrid WGT
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-WMP-Hybrid-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Moonlight-WMP-Hybrid.wgt
            ${{ runner.temp }}/Moonlight-WMP-Hybrid.sha256
            ${{ runner.temp }}/wmp-service-dynamic.txt
            ${{ runner.temp }}/libmlengine-dynamic.txt
          if-no-files-found: error
          retention-days: 14
