name: Build WMP hybrid WGT (CI)

on:
  push:
    branches:
      - master
    paths:
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'res/**'
      - 'h264bitstream/**'
      - 'libgamestream/**'
      - 'moonlight-common-c/**'
      - 'opus/**'
      - 'ports/**'
      - 'wasm/**'
      - 'wmp/**'
      - '.github/workflows/build-wmp-hybrid.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'res/**'
      - 'h264bitstream/**'
      - 'libgamestream/**'
      - 'moonlight-common-c/**'
      - 'opus/**'
      - 'ports/**'
      - 'wasm/**'
      - '.github/release-notes.md'
      - '.github/workflows/build-wmp-hybrid.yml'
      - '.github/workflows/release-stable.yml'
      - 'wmp/**'
      - '.github/workflows/build-wmp-hybrid.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    name: Validate code and resources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate JavaScript, locales and local documentation
        shell: bash
        run: |
          set -euo pipefail
          node --check wasm/platform/index.js
          node tests/gamepad_mask_test.js
          node --check wasm/platform/messages.js
          node --check wasm/static/js/i18n-sync.js
          node wasm/static/js/i18n-sync.js --check
          python3 - <<'PY'
          import json
          from pathlib import Path

          locale_dir = Path("wasm/static/locales")
          en = json.loads((locale_dir / "en-US.json").read_text(encoding="utf-8"))

          for locale_path in sorted(locale_dir.glob("*.json")):
              if locale_path.name == "en-US.json":
                  continue
              locale = json.loads(locale_path.read_text(encoding="utf-8"))
              missing = sorted(set(en) - set(locale))
              extra = sorted(set(locale) - set(en))
              if missing or extra:
                  raise SystemExit(
                      f"{locale_path.name} keys differ from en-US.json: "
                      f"Missing={missing!r}; extra={extra!r}"
                  )

          es = json.loads((locale_dir / "es-ES.json").read_text(encoding="utf-8"))
          pt = json.loads((locale_dir / "pt-BR.json").read_text(encoding="utf-8"))
          required = {
              "Audio stream:",
              "Dolby audio output",
              "Enable Dolby Digital",
              "Quit host app on disconnect",
              "Automatically quit the running app on the host",
          }
          for name, locale in (("en-US", en), ("es-ES", es), ("pt-BR", pt)):
              missing_required = sorted(required - set(locale))
              if missing_required:
                  raise SystemExit(f"{name} is missing required feature strings: {missing_required!r}")

          docs = [
              "docs/README.md",
              "docs/Features-Overview.md",
              "docs/Quick-Start-Guide.md",
              "docs/Installation-Guide.md",
              "docs/Updating-Guide.md",
              "docs/Frequently-Asked-Questions.md",
              "docs/Known-Issues-and-Limitations.md",
              "docs/Troubleshooting-Guide.md",
              "docs/Development-Guide.md",
          ]
          missing_docs = [name for name in docs if not Path(name).is_file()]
          if missing_docs:
              raise SystemExit(f"Missing documentation pages: {missing_docs!r}")
          locale_count = len(list(locale_dir.glob("*.json")))
          print(f"Locale checks passed for {locale_count} languages; {len(docs)} local documentation pages are present.")
          PY

      - name: Validate workflow structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-wmp-hybrid.yml").read_text(encoding="utf-8")
          build_start = workflow.find("\n  build:\n")
          if build_start < 0:
              raise SystemExit("The build job is missing.")

          build = workflow[build_start:]
          checkout_start = build.find("      - name: Checkout source")
          assets_start = build.find("      - name: Ensure required versioned MP4 assets are available")
          docker_start = build.find("      - name: Build Tizen widget")

          if checkout_start < 0 or assets_start < 0 or docker_start < 0:
              raise SystemExit("The build job must contain checkout, asset preparation and Docker build steps.")
          if not checkout_start < assets_start < docker_start:
              raise SystemExit("The build job checkout must precede asset preparation and Docker build.")

          checkout = build[checkout_start:assets_start]
          if "uses: actions/checkout@v5" not in checkout or "submodules: recursive" not in checkout:
              raise SystemExit("The build job must checkout source with recursive submodules.")

          if "    needs: validate" not in build:
              raise SystemExit("The build job must depend on the validate job.")
          if "    if: github.event_name != 'pull_request'" not in build:
              raise SystemExit("The build job must remain disabled for pull_request events.")

          if "Build WMP native ARM engine and ServiceApp" not in build:
              raise SystemExit("The WMP native engine and ServiceApp must be built in this workflow.")
          if "Assemble unsigned hybrid WGT" not in build:
              raise SystemExit("The unsigned WMP hybrid WGT assembly step is missing.")
          if "uses: ./.github/workflows/" in build:
              raise SystemExit("The WMP build must not call a separate reusable workflow.")
          print("AC-3 web build and WMP hybrid workflow structure checks passed.")
          PY

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.7
          files: .github/workflows/build-wmp-hybrid.yml
          shellcheck: false
          pyflakes: false


  build:
    if: github.event_name != 'pull_request'
    needs: validate
    name: Build unsigned WMP hybrid WGT
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Ensure required versioned MP4 assets are available")
          docker_start = build.find("      - name: Build Tizen widget")

          if checkout_start < 0 or assets_start < 0 or docker_start < 0:
              raise SystemExit("The build job must contain checkout, asset preparation and Docker build steps.")
          if not checkout_start < assets_start < docker_start:
              raise SystemExit("The build job checkout must precede asset preparation and Docker build.")

          checkout = build[checkout_start:assets_start]
          if "uses: actions/checkout@v5" not in checkout or "submodules: recursive" not in checkout:
              raise SystemExit("The build job must checkout source with recursive submodules.")

          if "    needs: validate" not in build:
              raise SystemExit("The build job must depend on the validate job.")
          if "    if: github.event_name != 'pull_request'" not in build:
              raise SystemExit("The build job must remain disabled for pull_request events.")

          print("Workflow structure checks passed.")
          PY

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.7
          files: .github/workflows/build-ac3-passthrough.yml
          shellcheck: false
          pyflakes: false


  build:
    if: github.event_name != 'pull_request'
    needs: validate
    name: Build ${{ matrix.variant }} WGT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            force_game_mode: 'false'
            artifact: Moonlight
          - variant: forcegm
            force_game_mode: 'true'
            artifact: Moonlight-ForceGM
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Ensure required versioned MP4 assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          ASSET_URL="https://raw.githubusercontent.com/fidoboy/moonlight-tizen-ac3/build-assets/$ASSET_FILE"
          ASSET_PATH="$RUNNER_TEMP/video-assets/$ASSET_FILE"
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"

          download_asset() {
            local status
            status="$(curl --silent --show-error --location --output "$ASSET_PATH" --write-out '%{http_code}' "$ASSET_URL")"
            printf '%s' "$status"
          }

          status="$(download_asset)"
          if [[ "$status" == "404" ]]; then
            echo "Video asset ZIP not found on build-assets; starting the asset-generation workflow."
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' \
              "$API_URL")"
            if [[ "$dispatch_status" != "204" ]]; then
              echo "::error::Could not start Generate video assets (HTTP $dispatch_status). The workflow token needs Actions write permission." >&2
              cat "$RUNNER_TEMP/video-assets/dispatch-response.json" >&2
              exit 1
            fi

            # Wait for the ZIP to be published. Do not regenerate if the ZIP already exists.
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(download_asset)"
              if [[ "$status" == "200" ]]; then
                break
              fi
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for the generated video asset ZIP." >&2
                exit 1
              fi
            done
            if [[ "$status" != "200" ]]; then
              echo "::error::The video asset ZIP was not published within 20 minutes. Check the Generate video assets workflow run." >&2
              exit 1
            fi
          elif [[ "$status" != "200" ]]; then
            echo "::error::Could not download the video asset ZIP (HTTP $status)." >&2
            exit 1
          fi

          # A present but invalid ZIP is an error; generation is only triggered when the ZIP is missing.
          if ! unzip -tq "$ASSET_PATH" >/dev/null; then
            echo "::error::The video asset ZIP exists but is invalid; refusing to regenerate it automatically." >&2
            exit 1
          fi
          unzip -oq "$ASSET_PATH" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty in the existing ZIP." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Check out WMP native service sources
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: wmp_mode
          path: wmp-source
          fetch-depth: 1
          submodules: recursive

      - name: Cache Tizen 5.5 ARM sysroot and toolchain
        uses: actions/cache@v4
        with:
          path: wmp-source/tizen-deps
          key: ${{ runner.os }}-tizen55-sysroot-${{ hashFiles('wmp-source/wmp/upstream/build/fetch-tizen-sources.sh') }}-v1

      - name: Cache OpenSSL and cURL source trees
        uses: actions/cache@v4
        with:
          path: |
            wmp-source/backport-deps/openssl111
            wmp-source/backport-deps/curl759
          key: ${{ runner.os }}-wmp-backport-sources-${{ hashFiles('wmp-source/wmp/upstream/build/fetch-backport-deps.sh') }}-v1

      - name: Build WMP native ARM engine and ServiceApp
        working-directory: wmp-source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git unzip libarchive-tools file binutils \
            autoconf automake libtool ca-certificates python3
          export MLT="$GITHUB_WORKSPACE/wmp-source"
          export DEPS="$MLT/tizen-deps"
          export BPD="$MLT/backport-deps"
          export DEPSBUILD="$MLT/deps-build"
          export ENGINE_OUT="$MLT/engine-build"
          bash wmp/upstream/build/fetch-tizen-sources.sh "$DEPS"
          tool_root="$DEPS/toolchain"
          gcc="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-gcc' -perm -u+x -print -quit)"
          objdump="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-objdump' -perm -u+x -print -quit)"
          ar="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-ar' -perm -u+x -print -quit)"
          ranlib="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-ranlib' -perm -u+x -print -quit)"
          if [[ -z "$gcc" || -z "$objdump" || -z "$ar" || -z "$ranlib" ]]; then
            echo "::error::Tizen ARM toolchain executables are missing." >&2
            find "$tool_root" -maxdepth 7 -type f | head -200
            exit 1
          fi
          expected="$tool_root/data/tools/arm-linux-gnueabi-gcc-6.2/bin"
          mkdir -p "$expected"
          for tool in gcc objdump ar ranlib; do
            case "$tool" in
              gcc) source="$gcc"; name=arm-linux-gnueabi-gcc ;;
              objdump) source="$objdump"; name=arm-linux-gnueabi-objdump ;;
              ar) source="$ar"; name=arm-linux-gnueabi-ar ;;
              ranlib) source="$ranlib"; name=arm-linux-gnueabi-ranlib ;;
            esac
            target="$expected/$name"
            if [[ "$(realpath "$source")" != "$(realpath -m "$target")" ]]; then ln -sfn "$source" "$target"; fi
          done
          "$expected/arm-linux-gnueabi-gcc" --version
          "$expected/arm-linux-gnueabi-objdump" --version | head -1
          bash wmp/upstream/build/fetch-backport-deps.sh
          bash wmp/upstream/build/build-deps-lib.sh
          BUILD_VARIANT=release bash wmp/upstream/mlclient/build-engine-so.sh
          bash wmp/service/build-wmp-service.sh
          mkdir -p build-report
          readelf -h "$ENGINE_OUT/libmlengine.so" > build-report/libmlengine-elf-header.txt
          readelf -d "$ENGINE_OUT/libmlengine.so" > build-report/libmlengine-dynamic.txt
          readelf -h wmp/build/service/bin/wmp-service > build-report/wmp-service-elf-header.txt
          readelf -d wmp/build/service/bin/wmp-service > build-report/wmp-service-dynamic.txt
          file "$ENGINE_OUT/libmlengine.so" wmp/build/service/bin/wmp-service | tee build-report/file.txt
          grep -q 'Machine:.*ARM' build-report/libmlengine-elf-header.txt
          grep -q 'Machine:.*ARM' build-report/wmp-service-elf-header.txt
          grep -q 'Shared library: \[libmlengine.so\]' build-report/wmp-service-dynamic.txt
          grep -Eq 'Library (runpath|rpath): \[\$ORIGIN/../lib\]' build-report/wmp-service-dynamic.txt
          if grep -q 'NEEDED.*libesplusplayer' build-report/libmlengine-dynamic.txt; then echo "::error::ESPlus must be runtime-loaded, not DT_NEEDED." >&2; exit 1; fi
          if grep -Eq 'NEEDED.*lib(ssl|crypto|curl)\.so' build-report/libmlengine-dynamic.txt; then echo "::error::Private static OpenSSL/cURL stack is missing." >&2; exit 1; fi
          python3 wmp/upstream/build/audit-elf-dependencies.py \
            --readelf readelf --output build-report/elf-dependencies.txt \
            --root "$ENGINE_OUT/libmlengine.so" --root wmp/build/service/bin/wmp-service \
            --search-dir "$DEPS/sysroot/lib" --search-dir "$DEPS/sysroot/usr/lib" \
            --search-dir "$DEPS/sysroot/usr/lib64" --search-dir "$DEPS/tv-libs/lib" \
            --search-dir "$DEPS/tv-libs/usr/lib" --search-dir wmp/build/service/lib \
            --system-soname libblkid.so.1 --system-soname libbuxton2.so.1 \
            --system-soname libcrypto.so.1.1 --system-soname libecore.so.1 \
            --system-soname liblzma.so.5 --system-soname libsmack.so.1 --system-soname libuuid.so.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Tizen widget
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-wmp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract base Moonlight web WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create "moonlight-wmp-web:$GITHUB_SHA")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          test -s "$RUNNER_TEMP/Moonlight-Web-Base.wgt"

      - name: Assemble unsigned hybrid WGT
        shell: bash
        run: |
          set -euo pipefail
          service_binary="wmp-source/wmp/build/service/bin/wmp-service"
          engine="wmp-source/wmp/build/service/lib/libmlengine.so"
          manifest="wmp-source/wmp/service/tizen-manifest.xml"
          web_wgt="$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          output="$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt"

          # The native build above has cross-compiled both ARM ELF files.
          # This step assembles the hybrid package without signing; Apps2Samsung signs it for
          # the selected TV immediately before installation.
          python3 - "$service_binary" "$manifest" "$web_wgt" "$engine" "$output" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          import xml.etree.ElementTree as ET

          binary, manifest, web_wgt, engine, output = map(Path, sys.argv[1:])
          for path in (binary, manifest, web_wgt, engine):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Required hybrid input is missing or empty: {path}")

          root = ET.parse(manifest).getroot()
          if root.attrib.get("package") != "MoonLightS":
              raise SystemExit("Native manifest package ID must be MoonLightS")
          service = next((n for n in root.iter() if n.tag.endswith("service-application")), None)
          if service is None or service.attrib.get("appid") != "MoonLightS.WmpService":
              raise SystemExit("Native service application identity is invalid")
          if service.attrib.get("exec") != "wmp-service":
              raise SystemExit("Native service executable must be wmp-service")

          entries = {
              "bin/wmp-service": binary,
              "lib/libmlengine.so": engine,
              "info/manifest.xml": manifest,
          }
          with zipfile.ZipFile(web_wgt) as web:
              for member in web.infolist():
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in base web WGT: {member.filename}")
                  if not path.parts or member.is_dir():
                      continue
                  if path.name in {"author-signature.xml", "signature1.xml", "signature2.xml"}:
                      continue
                  name = (PurePosixPath("res/wgt") / path).as_posix()
                  if name in entries:
                      raise SystemExit(f"Duplicate hybrid package entry: {name}")
                  entries[name] = web.read(member)

          required = {
              "bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml",
              "res/wgt/config.xml", "res/wgt/index.html", "res/wgt/service/service.js",
              "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm"
          }
          missing = sorted(required - entries.keys())
          if missing:
              raise SystemExit("Hybrid package inputs are missing: " + ", ".join(missing))

          config = ET.fromstring(entries["res/wgt/config.xml"])
          web_app = next((n for n in config.iter() if n.tag.endswith("application")), None)
          if web_app is None or web_app.attrib.get("id") != "MoonLightS.MoonlightWasm" or web_app.attrib.get("package") != "MoonLightS":
              raise SystemExit("Web application identity does not match the native package")
          version = config.attrib.get("version")
          if not version:
              raise SystemExit("Web config.xml has no application version")
          root.set("version", version)
          entries["info/manifest.xml"] = ET.tostring(root, encoding="utf-8", xml_declaration=True)

          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name, source in sorted(entries.items()):
                  info = zipfile.ZipInfo(name)
                  info.create_system = 3
                  info.compress_type = zipfile.ZIP_DEFLATED
                  mode = 0o755 if name == "bin/wmp-service" else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  data = source if isinstance(source, bytes) else source.read_bytes()
                  archive.writestr(info, data)

          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")
              names = set(archive.namelist())
              signature_names = {"author-signature.xml", "signature1.xml", "signature2.xml"}
              if any(PurePosixPath(n).name in signature_names for n in names):
                  raise SystemExit("Unsigned CI artifact unexpectedly contains signature files")
          print(f"Created unsigned hybrid WGT: {output} ({len(entries)} files)")
          PY
          test -s "$output"
          sha256sum "$output" | tee "$RUNNER_TEMP/Moonlight-WMP-Hybrid.sha256"

      - name: Upload unsigned hybrid WGT candidate for inspection
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-WMP-Hybrid-unsigned-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/Moonlight-WMP-Hybrid.wgt
          if-no-files-found: error
          retention-days: 7

      - name: Inspect unsigned hybrid WGT and native linkage
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file
          inspection="$RUNNER_TEMP/hybrid-inspection"
          mkdir -p "$inspection"
          python3 - "$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt" "$inspection" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          package, output = Path(sys.argv[1]), Path(sys.argv[2]).resolve()
          required = {
              "bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml",
              "res/wgt/config.xml", "res/wgt/service/service.js", "res/wgt/index.html",
              "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm",
              "res/wgt/static/css/style.css", "res/wgt/static/locales/en-US.json"
          }
          with zipfile.ZipFile(package) as archive:
              entries = archive.infolist()
              names = {entry.filename for entry in entries}
              print("WGT archive entries:")
              for entry in entries:
                  print(f"  {entry.filename} ({entry.file_size} bytes)")
              missing = sorted(required - names)
              if missing: raise SystemExit("Missing WGT entries: " + ", ".join(missing))

              # CI intentionally emits an unsigned package. Apps2Samsung signs
              # this WGT with the certificate belonging to the target TV.
              signature_names = {"author-signature.xml", "signature1.xml", "signature2.xml"}
              unexpected = sorted(n for n in names if Path(n).name in signature_names)
              if unexpected:
                  raise SystemExit("Unsigned WGT contains signature artefacts: " + ", ".join(unexpected))
              for name in names:
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts: raise SystemExit(f"Unsafe WGT path: {name}")
              for name in ("bin/wmp-service", "lib/libmlengine.so", "info/manifest.xml"):
                  target = output / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(name))
              config = ET.fromstring(archive.read("res/wgt/config.xml"))
              web = next((n for n in config.iter() if n.tag.endswith("application")), None)
              if web is None or web.attrib.get("id") != "MoonLightS.MoonlightWasm" or web.attrib.get("package") != "MoonLightS":
                  raise SystemExit("Web application identity is incorrect")
              manifest = ET.fromstring(archive.read("info/manifest.xml"))
              native = next((n for n in manifest.iter() if n.tag.endswith("service-application")), None)
              if manifest.attrib.get("package") != "MoonLightS" or native is None:
                  raise SystemExit("Native manifest package or service application is missing")
              if native.attrib.get("appid") != "MoonLightS.WmpService" or native.attrib.get("exec") != "wmp-service":
                  raise SystemExit("Native service identity is incorrect")
              print(f"Unsigned hybrid WGT validated: {len(names)} entries; web app and native service are present.")
          PY
          file "$inspection/bin/wmp-service" "$inspection/lib/libmlengine.so"
          readelf -h "$inspection/bin/wmp-service" > "$inspection/wmp-service-elf-header.txt"
          readelf -d "$inspection/bin/wmp-service" > "$inspection/wmp-service-dynamic.txt"
          readelf -h "$inspection/lib/libmlengine.so" > "$inspection/libmlengine-elf-header.txt"
          readelf -d "$inspection/lib/libmlengine.so" > "$inspection/libmlengine-dynamic.txt"
          grep -q 'Machine:.*ARM' "$inspection/wmp-service-elf-header.txt"
          grep -q 'Machine:.*ARM' "$inspection/libmlengine-elf-header.txt"
          grep -q 'Shared library: \[libmlengine.so\]' "$inspection/wmp-service-dynamic.txt"
          grep -q 'Library runpath: \[\$ORIGIN/../lib\]' "$inspection/wmp-service-dynamic.txt"
          if grep -q 'NEEDED.*libesplusplayer' "$inspection/libmlengine-dynamic.txt"; then
            echo "::error::libmlengine.so must load ESPlus from TV firmware, not DT_NEEDED." >&2
            exit 1
          fi
          if grep -Eq 'NEEDED.*lib(ssl|crypto|curl)\.so' "$inspection/libmlengine-dynamic.txt"; then
            echo "::error::libmlengine.so must contain the private static OpenSSL/cURL stack." >&2
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/Moonlight-WMP-Hybrid.wgt" | tee "$inspection/sha256.txt"
          cp "$inspection/sha256.txt" "$RUNNER_TEMP/Moonlight-WMP-Hybrid.sha256"
          cp "$inspection/wmp-service-dynamic.txt" "$RUNNER_TEMP/"
          cp "$inspection/libmlengine-dynamic.txt" "$RUNNER_TEMP/"

      - name: Upload unsigned hybrid WGT
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-WMP-Hybrid-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Moonlight-WMP-Hybrid.wgt
            ${{ runner.temp }}/Moonlight-WMP-Hybrid.sha256
            ${{ runner.temp }}/wmp-service-dynamic.txt
            ${{ runner.temp }}/libmlengine-dynamic.txt
          if-no-files-found: error
          retention-days: 14
