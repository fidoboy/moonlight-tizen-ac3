name: Build WGT (CI)

on:
  push:
    branches:
      - master
    paths:
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'res/**'
      - 'h264bitstream/**'
      - 'libgamestream/**'
      - 'moonlight-common-c/**'
      - 'opus/**'
      - 'ports/**'
      - 'wasm/**'
      - '.github/release-notes.md'
      - '.github/workflows/build-ac3-passthrough.yml'
      - '.github/workflows/release-stable.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'CMakeLists.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'res/**'
      - 'h264bitstream/**'
      - 'libgamestream/**'
      - 'moonlight-common-c/**'
      - 'opus/**'
      - 'ports/**'
      - 'wasm/**'
      - '.github/release-notes.md'
      - '.github/workflows/build-ac3-passthrough.yml'
      - '.github/workflows/release-stable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Build ${{ matrix.variant }} WGT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            force_game_mode: 'false'
            artifact: Moonlight
          - variant: forcegm
            force_game_mode: 'true'
            artifact: Moonlight-ForceGM
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download required versioned MP4 assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_TAG="build-videos-v1"
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          if ! gh release view "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Required video assets are unavailable (release $ASSET_TAG was not found). Run the 'Generate Versioned Video Assets' workflow first." >&2
            exit 1
          fi
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"
          if ! gh release download "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_FILE" --dir "$RUNNER_TEMP/video-assets"; then
            echo "::error::Required video asset $ASSET_FILE could not be downloaded from release $ASSET_TAG. Rebuild the assets by running the 'Generate Versioned Video Assets' workflow." >&2
            exit 1
          fi
          if ! unzip -tq "$RUNNER_TEMP/video-assets/$ASSET_FILE" >/dev/null; then
            echo "::error::The versioned video asset archive is invalid. Rebuild it with the 'Generate Versioned Video Assets' workflow." >&2
            exit 1
          fi
          unzip -oq "$RUNNER_TEMP/video-assets/$ASSET_FILE" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4 stream-transition-background.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty. Rebuild the versioned assets using the 'Generate Versioned Video Assets' workflow." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate JavaScript, locales and local documentation
        shell: bash
        run: |
          set -euo pipefail
          node --check wasm/platform/index.js
          node tests/gamepad_mask_test.js
          node --check wasm/platform/messages.js
          node --check wasm/static/js/i18n-sync.js
          python3 - <<'PY'
          import json
          from pathlib import Path

          en = json.loads(Path("wasm/static/locales/en-US.json").read_text(encoding="utf-8"))
          es = json.loads(Path("wasm/static/locales/es-ES.json").read_text(encoding="utf-8"))
          missing = sorted(set(en) - set(es))
          extra = sorted(set(es) - set(en))
          if missing or extra:
              raise SystemExit(f"Spanish locale keys differ: Missing={missing!r}; extra={extra!r}")

          pt = json.loads(Path("wasm/static/locales/pt-BR.json").read_text(encoding="utf-8"))
          required = {
              "Audio stream:",
              "Dolby audio output",
              "Enable Dolby Digital",
              "Quit host app on disconnect",
              "Automatically quit the running app on the host",
          }
          for name, locale in (("en-US", en), ("es-ES", es), ("pt-BR", pt)):
              missing_required = sorted(required - set(locale))
              if missing_required:
                  raise SystemExit(f"{name} is missing required feature strings: {missing_required!r}")

          docs = [
              "docs/README.md",
              "docs/Features-Overview.md",
              "docs/Quick-Start-Guide.md",
              "docs/Installation-Guide.md",
              "docs/Updating-Guide.md",
              "docs/Frequently-Asked-Questions.md",
              "docs/Known-Issues-and-Limitations.md",
              "docs/Troubleshooting-Guide.md",
              "docs/Development-Guide.md",
          ]
          missing_docs = [name for name in docs if not Path(name).is_file()]
          if missing_docs:
              raise SystemExit(f"Missing documentation pages: {missing_docs!r}")
          print(f"Locale checks passed; {len(docs)} local documentation pages are present.")
          PY

      - name: Build Tizen widget
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-ci:${{ matrix.variant }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=${{ matrix.force_game_mode }}

      - name: Extract WGT package
        env:
          FORCE_GAME_MODE: ${{ matrix.force_game_mode }}
          VARIANT: ${{ matrix.variant }}
          PACKAGE_NAME: ${{ matrix.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create "moonlight-tizen-ci:$VARIANT")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          if [[ "$FORCE_GAME_MODE" == "true" ]]; then
            source_path="/home/moonlight/Moonlight-ForceGM.wgt"
            target_path="$RUNNER_TEMP/Moonlight-ForceGM.wgt"
          else
            source_path="/home/moonlight/Moonlight.wgt"
            target_path="$RUNNER_TEMP/Moonlight.wgt"
          fi
          docker cp "$container_id:$source_path" "$target_path"
          test -s "$target_path"
          sha256sum "$target_path"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.wgt
          if-no-files-found: error
          retention-days: 14
