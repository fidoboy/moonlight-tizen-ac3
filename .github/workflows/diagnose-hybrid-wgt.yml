name: Diagnose Hybrid WGT Project Creation

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - ".github/workflows/diagnose-hybrid-wgt.yml"
      - ".github/workflows/build-hybrid-wgt.yml"

permissions:
  contents: read

concurrency:
  group: hybrid-wgt-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/1.2.4-pre'
    name: Diagnose Tizen project creation without rebuilding Moonlight
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Tizen SDK packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common expect unzip
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,TIZEN-9.0-WebAppDevelopment-CLI"

          core_cli="$sdk/tools/tizen-core/tz"
          test -x "$core_cli"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$core_cli" >> "$GITHUB_ENV"

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create the temporary Tizen signing profile
        shell: bash
        run: |
          set -euo pipefail
          export TIZEN_STUDIO_DATA_PATH="$RUNNER_TEMP/tizen-studio-data"
          rm -rf "$TIZEN_STUDIO_DATA_PATH"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile"

          tizen certificate -a Moonlight -f Moonlight -p 123456
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
          # Confirm that the original certificate generated by Tizen is readable.
          # Keep it unchanged: Tizen rejects the re-exported PKCS#12 variant.
          openssl pkcs12 -legacy -in "$author_key" -passin pass:123456 -info -noout
          chmod 600 "$author_key"

          tizen security-profiles add \
            -n Moonlight \
            -a "$author_key" \
            -p 123456 \
            -- "$TIZEN_STUDIO_DATA_PATH/profile"

          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          test -s "$profiles"

          # Match the headless signing-profile workaround used by the working AC3 Dockerfile.
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.pwd||" "$profiles"
          distributor_pwd="$TIZEN_STUDIO_DATA_PATH/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd|tizenpkcs12passfordsigner|" "$profiles"

          echo "=== Perfil registrado ==="
          tizen security-profiles list

          echo "=== Perfil XML con valores secretos ocultos ==="
          python3 - "$profiles" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          for elem in root.iter():
              for key in list(elem.attrib):
                  if any(word in key.lower() for word in ("password", "passwd", "secret")):
                      elem.set(key, "[REDACTED]")
              if elem.text and any(word in elem.tag.lower() for word in ("password", "passwd", "secret")):
                  elem.text = "[REDACTED]"

          ET.indent(root)
          print(ET.tostring(root, encoding="unicode"))
          PY

          echo "=== Formato PKCS#12 del certificado ==="
          openssl pkcs12 -legacy -in "$author_key" -passin pass:123456 -info -noout

          echo "TIZEN_PROFILES_PATH=$profiles" >> "$GITHUB_ENV"

      - name: Reproduce the hybrid packaging and signing sequence
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/hybrid-reproduction"
          web_project="$workspace/MoonlightWeb"
          base_wgt="$RUNNER_TEMP/MoonlightWeb-base.wgt"
          draft_wgt="$RUNNER_TEMP/MoonlightWeb-hybrid-unsigned.wgt"
          final_project="$RUNNER_TEMP/MoonlightWeb-hybrid-project"
          final_wgt="$RUNNER_TEMP/MoonlightWeb.wgt"

          mkdir -p "$workspace"

          echo "=== Tizen Core CLI pack options (verify signing controls) ==="
          "$TIZEN_CORE_CLI" pack --help 2>&1 | tee "$RUNNER_TEMP/tz-pack-help.txt" || true

          echo "=== 1. Generate and sign the base Web WGT with the AC3 tizen package + expect method ==="
          "$TIZEN_CORE_CLI" new -t Basic -n MoonlightWeb -T web -p tizen-9.0 -w "$workspace"
          test -d "$web_project"
          cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
          chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
          expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$web_project"
          test -s "$web_project/MoonlightWeb.wgt"
          cp "$web_project/MoonlightWeb.wgt" "$base_wgt"
          test -s "$base_wgt"
          unzip -tq "$base_wgt"

          echo "=== 2. Compile the service directly with dotnet msbuild ==="
          find ambilight-service -type f -name '*.tpk' -delete
          dotnet msbuild ambilight-service/TizenAmbilight.csproj \
            -restore -t:Rebuild -p:Configuration=Release -v:m

          mapfile -t service_pkgs < <(find ambilight-service -type f -name '*.tpk' -not -path '*/obj/*' | sort)
          if (( ${#service_pkgs[@]} != 1 )); then
            echo "::error::Expected exactly one service TPK; found ${#service_pkgs[@]}."
            printf '%s\n' "${service_pkgs[@]}"
            exit 1
          fi
          service_tpk="${service_pkgs[0]}"
          test -s "$service_tpk"
          echo "Service TPK: $service_tpk"

          echo "=== 3. Verify the embedded service manifest ==="
          python3 - ambilight-service/tizen-manifest.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          ns = "{http://tizen.org/ns/packages}"
          service = root.find(f"{ns}service-application")
          expected = {
              "package": "MoonLightS",
              "appid": "MoonLightS.MoonlightAmbilight",
              "exec": "MoonlightAmbilight.dll",
              "api-version": "9",
          }
          actual = {
              "package": root.get("package"),
              "appid": service.get("appid") if service is not None else None,
              "exec": service.get("exec") if service is not None else None,
              "api-version": service.get("api-version") if service is not None else None,
          }
          for key, value in expected.items():
              if actual[key] != value:
                  raise SystemExit(f"Invalid service manifest {key}: expected {value!r}, got {actual[key]!r}")
          print("Service manifest verified:", actual)
          PY

          echo "=== 4. Assemble the hybrid WGT without signing ==="
          "$TIZEN_CORE_CLI" pack --type wgt --ref-pkgs "$service_tpk" \
            --base-pkg "$base_wgt" --out-path "$draft_wgt"
          test -s "$draft_wgt"
          unzip -tq "$draft_wgt"

          echo "=== 5. Prepare the hybrid project for standard Tizen signing ==="
          rm -rf "$final_project"
          mkdir -p "$final_project"
          unzip -q "$draft_wgt" -d "$final_project"
          python3 - "$final_project/tizen-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          ET.register_namespace("", "http://tizen.org/ns/packages")
          tree = ET.parse(path)
          root = tree.getroot()
          service_app = next((node for node in root.iter()
                              if node.tag.endswith("service-application")), None)
          if service_app is None:
              raise SystemExit("Hybrid manifest has no embedded service application")
          if service_app.get("api-version") != "9":
              raise SystemExit("Embedded service API 9 requirement changed unexpectedly")
          root.set("api-version", "5.5")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          print("Hybrid manifest floor set to Tizen 5.5; service remains API 9.")
          PY

          echo "=== 6. Sign the complete hybrid WGT with tizen package + expect ==="
          cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
          chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
          expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$final_project"

          test -s "$final_project/MoonlightWeb.wgt"
          cp "$final_project/MoonlightWeb.wgt" "$final_wgt"
          unzip -tq "$final_wgt"

          echo "=== 7. Verify final signed hybrid package and embedded TPK ==="
          python3 - "$final_wgt" "$service_tpk" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          package_path, service_path = sys.argv[1:]
          with zipfile.ZipFile(package_path) as package:
              names = package.namelist()
              tpks = [name for name in names if name.lower().endswith(".tpk")]
              if len(tpks) != 1:
                  raise SystemExit(f"Expected exactly one embedded service TPK, found {len(tpks)}: {tpks}")
              if package.read(tpks[0]) != open(service_path, "rb").read():
                  raise SystemExit("Signing changed or replaced the embedded service TPK")
              for signature in ("author-signature.xml", "signature1.xml"):
                  if signature not in names:
                      raise SystemExit(f"Final signed hybrid WGT is missing {signature}")
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in final WGT: {name}")
              print("Final signed hybrid WGT verified.")
              print("Embedded service TPK:", tpks[0])
              print("Signature entries:", "author-signature.xml, signature1.xml")
          PY

          echo "Final hybrid WGT: $final_wgt"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tizen-project-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/tizen-project-diagnostics/
          if-no-files-found: warn
          retention-days: 7

