name: Diagnose Hybrid WGT Project Creation

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - ".github/workflows/diagnose-hybrid-wgt.yml"
      - ".github/workflows/build-hybrid-wgt.yml"

permissions:
  contents: read

concurrency:
  group: hybrid-wgt-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/1.2.4-pre'
    name: Diagnose Tizen project creation without rebuilding Moonlight
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Tizen SDK packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,TIZEN-9.0-WebAppDevelopment-CLI"

          core_cli="$sdk/tools/tizen-core/tz"
          test -x "$core_cli"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$core_cli" >> "$GITHUB_ENV"

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create the temporary Tizen signing profile
        shell: bash
        run: |
          set -euo pipefail
          export TIZEN_STUDIO_DATA_PATH="$RUNNER_TEMP/tizen-studio-data"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile"
          tizen certificate -a Moonlight -f Moonlight -p 123456
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
          author_pwd="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.pwd"
          printf '%s' '123456' > "$author_pwd"
          chmod 600 "$author_pwd"
          test -s "$author_key"
          openssl pkcs12 -legacy -in "$author_key" -passin "file:$author_pwd" -noout
          echo "Author PKCS12/password-file verification: OK"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          "$TIZEN_CORE_CLI" security-profiles add \
            -n Moonlight \
            -x "$profiles" \
            -a "$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12" \
            -p 123456
          test -s "$profiles"
          "$TIZEN_CORE_CLI" security-profiles list -x "$profiles"
          echo "TIZEN_PROFILES_PATH=$profiles" >> "$GITHUB_ENV"

      - name: Reproduce the exact project-creation sequence
        shell: bash
        run: |
          set -uo pipefail
          log_dir="$RUNNER_TEMP/tizen-project-diagnostics"
          mkdir -p "$log_dir"

          echo "=== Tizen Core version ==="
          "$TIZEN_CORE_CLI" --version 2>&1 | tee "$log_dir/tizen-version.log"
          echo "=== Registered .NET templates ==="
          "$TIZEN_CORE_CLI" list templates -t dotnet 2>&1 | tee "$log_dir/dotnet-templates.log"
          echo "=== Installed .NET SDK ==="
          dotnet --info 2>&1 | tee "$log_dir/dotnet-info.log"

          run_logged() {
            local label="$1"
            shift
            echo "::group::$label"
            "$@" 2>&1 | tee "$log_dir/$label.log"
            local statuses=("${PIPESTATUS[@]}")
            local command_status="${statuses[0]}"
            echo "EXIT_CODE_$label=$command_status"
            echo "::endgroup::"
            return "$command_status"
          }

          workspace="$RUNNER_TEMP/hybrid-reproduction"
          mkdir -p "$workspace"

          echo "=== Test 1: create Web project, exactly as the packaging job does ==="
          if run_logged create-web-project \
            "$TIZEN_CORE_CLI" new -t Basic -n MoonlightWeb -T web -p tizen-9.0 -w "$workspace"; then
            web_status=0
          else
            web_status=$?
          fi

          echo "=== Test 2: create .NET service in that SAME workspace ==="
          if (( web_status == 0 )); then
            if run_logged create-dotnet-service-after-web \
              "$TIZEN_CORE_CLI" new -t TizenServiceApp -n AmbilightService -T dotnet -p tizen-9.0 -w "$workspace"; then
              sequential_status=0
            else
              sequential_status=$?
            fi
          else
            sequential_status=125
            echo "Skipped: Web project creation failed."
          fi

          echo "=== Test 3: create .NET service alone in a fresh workspace ==="
          isolated_workspace="$RUNNER_TEMP/service-only"
          mkdir -p "$isolated_workspace"
          if run_logged create-dotnet-service-alone \
            "$TIZEN_CORE_CLI" new -t TizenServiceApp -n AmbilightService -T dotnet -p tizen-9.0 -w "$isolated_workspace"; then
            isolated_status=0
          else
            isolated_status=$?
          fi

          build_status=125
          if (( web_status == 0 && sequential_status == 0 )); then
            service_project="$workspace/AmbilightService/AmbilightService"
            test -s "$service_project/tizen_dotnet_project.yaml"
            cp ambilight-service/TizenAmbilight.csproj "$service_project/TizenAmbilight.csproj"
            cp ambilight-service/tizen-manifest.xml "$service_project/tizen-manifest.xml"
            cp ambilight-service/Program.cs ambilight-service/VideoPlaneCapture.cs ambilight-service/WledOutput.cs "$service_project/"
            rm -f "$service_project/AmbilightService.csproj" "$service_project/AmbilightService_App.cs"

            python3 - "$service_project/tizen_dotnet_project.yaml" <<'PY'
          import sys
          from pathlib import Path
          project_path = Path(sys.argv[1])
          project = project_path.read_text(encoding="utf-8")
          project = project.replace("csproj_file: AmbilightService.csproj", "csproj_file: TizenAmbilight.csproj")
          start = project.find("files:")
          if start < 0:
              raise SystemExit("Tizen Core .NET project metadata has no files list")
          end = project.find("\ndeps:", start)
          if end < 0:
              raise SystemExit("Tizen Core .NET project metadata has no deps section")
          project = project[:start] + "files:\n  - TizenAmbilight.csproj\n  - Program.cs\n  - VideoPlaneCapture.cs\n  - WledOutput.cs\n  - tizen-manifest.xml" + project[end:]
          project_path.write_text(project, encoding="utf-8")
          PY

            if run_logged add-hybrid-dependency "$TIZEN_CORE_CLI" add-deps "$workspace/MoonlightWeb" --deps "../AmbilightService"; then
              echo "=== Test 4: build the service directly with documented Tizen.NET signing properties ==="
              author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
              dist_key="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12"
              if run_logged direct-dotnet-service-build dotnet build "$service_project/TizenAmbilight.csproj" --configuration Debug "-p:AuthorPath=$author_key" "-p:AuthorPass=123456" "-p:DistributorPath=$dist_key" "-p:DistributorPass=tizenpkcs12passfordsigner"; then
                direct_build_status=0
              else
                direct_build_status=$?
              fi
              echo "Direct Tizen.NET build with explicit AuthorPass: $direct_build_status"

              echo "=== Test 5: compile service without automatic TPK creation ==="
              if run_logged dotnet-build-without-tpk dotnet build "$service_project/TizenAmbilight.csproj" --configuration Debug "-p:TizenCreateTpkOnBuild=false"; then
                unsigned_build_status=0
              else
                unsigned_build_status=$?
              fi
              echo "Build without automatic TPK creation: $unsigned_build_status"

              echo "=== Test 6: invoke TizenPackage explicitly with signing properties ==="
              if (( unsigned_build_status == 0 )); then
                if run_logged explicit-tpk-sign dotnet msbuild "$service_project/TizenAmbilight.csproj" -target:TizenPackage "-p:AuthorPath=$author_key" "-p:AuthorPass=123456" "-p:DistributorPath=$dist_key" "-p:DistributorPass=tizenpkcs12passfordsigner"; then
                  explicit_sign_status=0
                else
                  explicit_sign_status=$?
                fi
              else
                explicit_sign_status=125
              fi
              echo "Explicit TizenPackage signing: $explicit_sign_status"

              echo "=== Test 7: inspect the installed MSBuild executable ==="
              msbuild_path="$(command -v msbuild || true)"
              echo "PATH_MSBUILD=${msbuild_path:-not-found}"
              find "$TIZEN_STUDIO" /usr/share/dotnet -type f -name msbuild -o -name MSBuild.dll 2>/dev/null | head -n 30 | tee "$log_dir/msbuild-candidates.txt"

              echo "=== Test 8: switch Tizen Core to its documented MSBuild backend ==="
              if run_logged select-msbuild-backend "$TIZEN_CORE_CLI" set -D msbuild; then
                msbuild_select_status=0
              else
                msbuild_select_status=$?
              fi
              echo "MSBuild backend selection: $msbuild_select_status"

              if (( msbuild_select_status == 0 )); then
                run_logged inspect-msbuild-config "$TIZEN_CORE_CLI" get -D -m || true
                echo "=== Test 9: build the complete hybrid workspace through Tizen Core/MSBuild ==="
                if run_logged build-hybrid-workspace-msbuild "$TIZEN_CORE_CLI" build --proj-dir "$workspace/MoonlightWeb"; then
                  build_status=0
                else
                  build_status=$?
                fi
              else
                build_status=$msbuild_select_status
                echo "Skipped hybrid build because Tizen Core rejected the MSBuild backend selection."
              fi
            else
              build_status=$?
              direct_build_status=125
            fi
          fi

          echo "=== Generated files in the sequential workspace ==="
          find "$workspace" -maxdepth 4 -type f -printf '%P\n' | sort | tee "$log_dir/sequential-files.txt"
          echo "=== Generated files in the isolated workspace ==="
          find "$isolated_workspace" -maxdepth 4 -type f -printf '%P\n' | sort | tee "$log_dir/isolated-files.txt"

          echo "=== Recent Tizen SDK logs ==="
          for root in "$RUNNER_TEMP/tizen-studio" "$HOME/.tizen" "$HOME/.config"; do
            if [[ -d "$root" ]]; then
              find "$root" -type f -iname '*.log' -mmin -30 -print 2>/dev/null
            fi
          done | while IFS= read -r log; do
            echo "--- $log ---"
            tail -n 300 "$log"
          done

          echo "=== RESULT ==="
          echo "Web project creation: $web_status"
          echo "Service after Web project in same workspace: $sequential_status"
          echo "Service alone in fresh workspace: $isolated_status"
          echo "Tizen Core hybrid build: $build_status"

          if (( web_status != 0 || sequential_status != 0 || build_status != 0 )); then
            echo "::error::Tizen Core project creation or hybrid build failed. See the command output and logs above."
            exit 1
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tizen-project-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/tizen-project-diagnostics/
          if-no-files-found: warn
          retention-days: 7
