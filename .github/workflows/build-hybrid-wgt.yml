name: Build Hybrid WGT (CI)

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: "Generate Moonlight.wgt (Release)"
        required: false
        type: boolean
        default: true
      build_debug:
        description: "Generate Moonlight-Debug.wgt (Debug)"
        required: false
        type: boolean
        default: false
      show_private_data:
        description: "Include private data in application debug logs (Debug only)"
        required: false
        type: boolean
        default: false
      enable_native_traces:
        description: "Enable verbose ESPlusPlayer/WMP native traces (Debug only)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  actions: write

concurrency:
  group: hybrid-wgt-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  configure:
    name: Configure requested WGT variants
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build the requested variant matrix
        id: set-matrix
        shell: bash
        env:
          BUILD_RELEASE: ${{ inputs.build_release }}
          BUILD_DEBUG: ${{ inputs.build_debug }}
          SHOW_PRIVATE_DATA: ${{ inputs.show_private_data }}
          ENABLE_NATIVE_TRACES: ${{ inputs.enable_native_traces }}
        run: |
          set -euo pipefail
          : "${BUILD_RELEASE:=true}"
          : "${BUILD_DEBUG:=false}"
          : "${SHOW_PRIVATE_DATA:=false}"
          : "${ENABLE_NATIVE_TRACES:=false}"
          matrix='{"include":[]}'
          if [[ "$BUILD_RELEASE" == "true" ]]; then
            matrix="$(jq -c '.include += [{"variant":"release","build_variant":"release","debug_mode":"false","show_private_data":"false","enable_native_traces":"false","base_wgt":"MoonlightWeb-base.wgt","output_name":"Moonlight.wgt","artifact_name":"Moonlight"}]' <<< "$matrix")"
          fi
          if [[ "$BUILD_DEBUG" == "true" ]]; then
            matrix="$(jq -c '.include += [{"variant":"debug","build_variant":"debug","debug_mode":"true","show_private_data":env.SHOW_PRIVATE_DATA,"enable_native_traces":env.ENABLE_NATIVE_TRACES,"base_wgt":"Moonlight-Debug-base.wgt","output_name":"Moonlight-Debug.wgt","artifact_name":"Moonlight-Debug"}]' <<< "$matrix")"
          fi
          if [[ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]]; then
            echo "::error::No build variant is enabled. Select Release and/or Debug."
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-hybrid:
    needs: configure
    name: Build ${{ matrix.variant }} hybrid WGT
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Prepare persistent ccache directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore Moonlight Web compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.variant }}-${{ github.sha }}
            moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-
            moonlight-web-ccache-${{ runner.os }}-


      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull Tizen build image from GHCR
        shell: bash
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"

      - name: Build WMP engine and .NET ServiceApp inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e WMP_DEPS=/opt/wmp-tizen-deps \
            -e WMP_BACKPORT_DEPS=/opt/wmp-backport-deps \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            "$image" bash -lc '
              set -euo pipefail
              for tool in autoconf automake autoreconf libtoolize pkg-config; do command -v "$tool" >/dev/null; done
              test -x "$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              test -s /opt/wmp-backport-deps/arm-static/lib/libcrypto.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libssl.a
              test -s /opt/wmp-backport-deps/arm-static/lib/libcurl.a
              echo "::group::WMP transport and native unit tests"
              node tests/wmp_transport_test.js
              cc -std=c99 -Wall -Wextra -Werror -pthread -Imoonlight-common-c/src -Iwmp/engine/mlclient -Iwmp/service/src wmp/tests/wmp_audio_passthrough_test.c -o /runner-temp/wmp-audio-passthrough-test
              /runner-temp/wmp-audio-passthrough-test
              bash wmp/tests/wmp_esplus_abi_test.sh
              echo "::endgroup::"
              ARM_GCC="$WMP_DEPS/toolchain/data/tools/arm-linux-gnueabi-gcc-6.2/bin/arm-linux-gnueabi-gcc"
              ARM_GCC_DIR="$(dirname "$ARM_GCC")"
              CCACHE_BIN=/runner-temp/wmp-ccache-bin
              mkdir -p "$CCACHE_BIN" "$CCACHE_DIR"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/arm-linux-gnueabi-gcc"
              ln -sf "$(command -v ccache)" "$CCACHE_BIN/gcc"
              export CCACHE_COMPILERCHECK=content
              export CCACHE_BASEDIR=/workspace
              export PATH="$CCACHE_BIN:$ARM_GCC_DIR:$PATH"
              ccache --version
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" OUT=/runner-temp/wmp-deps-build JOBS=2 bash wmp/engine/build/build-deps-lib.sh
              WMP_ARM_CC="$CCACHE_BIN/arm-linux-gnueabi-gcc" MLT=/workspace DEPS="$WMP_DEPS" BPD="$WMP_BACKPORT_DEPS" DEPSBUILD=/runner-temp/wmp-deps-build OUT=/runner-temp/wmp-engine-build BUILD_VARIANT=${{ matrix.build_variant }} WMP_MLT_TRACE=${{ matrix.enable_native_traces }} bash wmp/engine/mlclient/build-engine-so.sh
              echo "::group::WMP ARM ccache statistics"
              ccache --show-stats
              echo "::endgroup::"
              test -s /runner-temp/wmp-engine-build/libmlengine.so
              readelf -h /runner-temp/wmp-engine-build/libmlengine.so | grep -F "Machine:" | grep -F "ARM"
              mkdir -p wmp/dotnet-host/lib
              cp /runner-temp/wmp-engine-build/libmlengine.so wmp/dotnet-host/lib/libmlengine.so
              echo "WMP native engine built. The managed host will be compiled and packaged by its Tizen Core dependency project."
            '
      - name: Restore compiler cache ownership after WMP build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"

      - name: Restore FFmpeg WebAssembly build cache
        uses: actions/cache/restore@v4
        with:
          path: ffmpeg/install
          key: ffmpeg-wasm-4.4.8-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg/build/**', '!ffmpeg/install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Build the ${{ matrix.variant }} Moonlight Web payload inside optimized v5 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/moonlight-home"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e HOME=/runner-temp/moonlight-home \
            -e CCACHE_DIR=/runner-temp/moonlight-home/.cache/ccache \
            -e EMSDK=/opt/emscripten-release-bundle/emsdk \
            -e BUILD_TYPE=release \
            -e DEBUG_MODE=${{ matrix.debug_mode }} \
            -e LOG_SHOW_PRIVATE_DATA=${{ matrix.show_private_data }} \
            -e REPO_OWNER="$GITHUB_REPOSITORY_OWNER" \
            -e REPO_NAME="${GITHUB_REPOSITORY#*/}" \
            "$image" bash scripts/build-moonlight-web.sh /runner-temp/moonlight-web

      - name: Save FFmpeg WebAssembly build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ffmpeg/install
          key: ffmpeg-wasm-4.4.8-${{ runner.os }}-emsdk-6.1-v5-${{ hashFiles('ffmpeg/**', '!ffmpeg/build/**', '!ffmpeg/install/**', 'scripts/build-ffmpeg.sh', 'scripts/build-moonlight-web.sh') }}
      - name: Prepare compiler cache ownership for saving
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/moonlight-home/.cache/ccache" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/moonlight-home/.cache/ccache"
          fi

      - name: Save Moonlight Web compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/moonlight-home/.cache/ccache
          key: moonlight-web-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Extract unsigned Moonlight Web files
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/moonlight-web/web" "$RUNNER_TEMP/web"
          for project in "$RUNNER_TEMP/web"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
          done

      - name: Package the Tizen Core hybrid workspaces
        shell: bash
        env:
          BUILD_OUTPUT_NAME: ${{ matrix.output_name }}
          BASE_WGT_NAME: ${{ matrix.base_wgt }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"
          docker run --rm -i --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e RUNNER_TEMP=/runner-temp \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e BUILD_OUTPUT_NAME="$BUILD_OUTPUT_NAME" \
            -e BASE_WGT_NAME="$BASE_WGT_NAME" \
            "$image" bash /workspace/scripts/package-hybrid-wgt.sh
      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
      - name: Upload ${{ matrix.variant }} hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/hybrid-output/${{ matrix.output_name }}
          if-no-files-found: error
          retention-days: 14
