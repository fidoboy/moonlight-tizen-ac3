name: Build Hybrid WGT (CI)

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "res/**"
      - "h264bitstream/**"
      - "libgamestream/**"
      - "moonlight-common-c/**"
      - "opus/**"
      - "ports/**"
      - "wasm/**"
      - "ambilight-service/**"
      - "scripts/validate-hybrid-wgt.py"
      - ".github/workflows/build-hybrid-wgt.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: hybrid-wgt-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hybrid:
    if: github.ref == 'refs/heads/1.2.4-pre'
    name: Build and package standard and ForceGM hybrid WGTs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip

      - name: Install Tizen SDK packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"

          # Install the Tizen CLI components used by the SDK packaging environment.
          # The final hybrid package is assembled by Tizen Core CLI (tz).
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,TIZEN-9.0-WebAppDevelopment-CLI"

          core_cli="$sdk/tools/tizen-core/tz"
          test -x "$core_cli"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$core_cli" >> "$GITHUB_ENV"

      - name: Create the Moonlight signing profile
        shell: bash
        run: |
          set -euo pipefail
          export TIZEN_STUDIO_DATA_PATH="$RUNNER_TEMP/tizen-studio-data"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH"
          tizen certificate -a Moonlight -f Moonlight -p 123456
          tizen security-profiles add \
            -n Moonlight \
            -a "$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12" \
            -p 123456 \
            -- "$TIZEN_STUDIO_DATA_PATH/profile"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          test -s "$profiles"
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.pwd||" "$profiles"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd|tizenpkcs12passfordsigner|" "$profiles"
          echo "TIZEN_PROFILES_PATH=$profiles" >> "$GITHUB_ENV"

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify Tizen Core and .NET build tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$TIZEN_CORE_CLI"
          "$TIZEN_CORE_CLI" --version
          "$TIZEN_CORE_CLI" pack --help | tee "$RUNNER_TEMP/tizen-core-pack-help.txt"
          "$TIZEN_CORE_CLI" add-deps --help | tee "$RUNNER_TEMP/tizen-core-add-deps-help.txt"
          grep -Fq -- '--deps' "$RUNNER_TEMP/tizen-core-add-deps-help.txt"
          grep -Fq -- '--proj-dir' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--sign-profile' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--profiles-path' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--base-pkg' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--out-path' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          dotnet --info
          dotnet --list-sdks | grep -E '^8\.'

      - name: Diagnose Tizen Core .NET project creation
        shell: bash
        run: |
          set -uo pipefail
          echo "=== Tizen Core version ==="
          "$TIZEN_CORE_CLI" --version
          echo "=== tz new help ==="
          "$TIZEN_CORE_CLI" new --help 2>&1 || true
          echo "=== Installed .NET SDKs ==="
          dotnet --info
          echo "=== Registered .NET templates ==="
          "$TIZEN_CORE_CLI" list templates -t dotnet

          probe() {
            local label="$1" template="$2" profile="$3"
            local dir="$RUNNER_TEMP/tz-probe-$label"
            mkdir -p "$dir"
            echo "::group::Probe $label: template=$template profile=$profile"
            if "$TIZEN_CORE_CLI" new -t "$template" -n ProbeProject -T dotnet -p "$profile" -w "$dir" 2>&1; then
              local status=0
            else
              local status=$?
            fi
            echo "PROBE_STATUS_$label=$status"
            echo "Generated files:"
            find "$dir" -maxdepth 3 -type f -printf '%P\n' | sort || true
            echo "::endgroup::"
            return "$status"
          }

          set +e
          probe service-tizen-9 TizenServiceApp tizen-9.0
          service_tizen_status=$?
          probe service-tv-samsung-9 TizenServiceApp tv-samsung-9.0
          service_tv_status=$?
          probe nui-tizen-9 TizenNUIApp tizen-9.0
          nui_status=$?
          set -e

          echo "=== Probe summary ==="
          echo "TizenServiceApp / tizen-9.0: $service_tizen_status"
          echo "TizenServiceApp / tv-samsung-9.0: $service_tv_status"
          echo "TizenNUIApp / tizen-9.0: $nui_status"

          echo "=== Recent SDK / Tizen logs ==="
          for root in "$RUNNER_TEMP/tizen-studio" "$RUNNER_TEMP/tizen-studio-data" "$HOME/.tizen" "$HOME/.config"; do
            if [[ -d "$root" ]]; then
              find "$root" -type f \( -iname '*.log' -o -iname '*tizen*core*' \) -mmin -10 -print 2>/dev/null
            fi
          done | while IFS= read -r log; do
            echo "--- $log ---"
            tail -n 200 "$log"
          done

          if (( service_tizen_status != 0 )); then
            echo "::error::The exact TizenServiceApp/tizen-9.0 scaffold command fails in an isolated workspace."
            exit 1
          fi

      - name: Ensure versioned MP4 splash assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Moonlight Web files (standard)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-standard:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-standard
          cache-to: type=gha,mode=max,scope=moonlight-web-standard
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Build Moonlight Web files (ForceGM)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-forcegm:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-forcegm
          cache-to: type=gha,mode=max,scope=moonlight-web-forcegm
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract unsigned Moonlight Web files
        shell: bash
        run: |
          set -euo pipefail
          standard_container="$(docker create "moonlight-hybrid-web-standard:$GITHUB_SHA")"
          forcegm_container="$(docker create "moonlight-hybrid-web-forcegm:$GITHUB_SHA")"
          trap 'docker rm -f "$standard_container" "$forcegm_container" >/dev/null 2>&1 || true' EXIT

          docker cp "$standard_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-standard"
          docker cp "$forcegm_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-forcegm"
          for project in "$RUNNER_TEMP/web-standard" "$RUNNER_TEMP/web-forcegm"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
            test -s "$project/static/res/launch-screen.mp4"
            test -s "$project/static/res/launch-screen-portrait.mp4"
          done

      - name: Package and sign the Tizen Core hybrid workspaces
        shell: bash
        run: |
          set -euo pipefail
          run_tz() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/tz-${label//[^A-Za-z0-9_-]/_}.log"
            echo "::group::Tizen Core: $label"
            set +e
            "$@" 2>&1 | tee "$log"
            local statuses=("${PIPESTATUS[@]}")
            local command_status="${statuses[0]}"
            set -e
            echo "::endgroup::"
            if (( command_status != 0 )); then
              echo "::error::Tizen Core command failed with exit code $command_status: $*"
              return "$command_status"
            fi
          }

          package_one() {
            local source="$1" name="$2" output="$3"
            local workspace="$RUNNER_TEMP/hybrid-$name"
            local web="$workspace/$name"
            local service="$workspace/AmbilightService"
            local service_project="$service/AmbilightService"
            mkdir -p "$workspace"

            # Record the templates actually registered in this CI SDK before
            # asking Tizen Core to instantiate either project.
            run_tz "list-web-templates-$name" "$TIZEN_CORE_CLI" list templates -t web
            run_tz "list-dotnet-templates-$name" "$TIZEN_CORE_CLI" list templates -t dotnet

            # Scaffold both projects from their native Tizen Core templates.
            # Moonlight replaces only the Web payload; the generated Web project
            # metadata remains intact.
            run_tz "create-web-project-$name" "$TIZEN_CORE_CLI" new -t Basic -n "$name" -T web -p tizen-9.0 -w "$workspace"
            run_tz "create-dotnet-service-project-$name" "$TIZEN_CORE_CLI" new -t TizenServiceApp -n AmbilightService -T dotnet -p tizen-9.0 -w "$workspace"
            test -d "$web"
            test -s "$service_project/tizen_dotnet_project.yaml"
            cp -a "$source/." "$web/"

            # Populate the SDK-scaffolded .NET service project with our sources.
            # Keep its Tizen Core project metadata, use the repository's real
            # project settings and service manifest, and remove the template entry point.
            cp ambilight-service/TizenAmbilight.csproj "$service_project/TizenAmbilight.csproj"
            cp ambilight-service/tizen-manifest.xml "$service_project/tizen-manifest.xml"
            cp ambilight-service/Program.cs ambilight-service/VideoPlaneCapture.cs ambilight-service/WledOutput.cs "$service_project/"
            rm -f "$service_project/AmbilightService.csproj" "$service_project/AmbilightService_App.cs"
            python3 - "$web/config.xml" "$service_project/tizen-manifest.xml" "$service_project/tizen_dotnet_project.yaml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          web = ET.parse(sys.argv[1]).getroot()
          ET.register_namespace("", "http://tizen.org/ns/packages")
          manifest_path = Path(sys.argv[2])
          tree = ET.parse(manifest_path)
          manifest = tree.getroot()
          app = next((n for n in web.iter() if n.tag.endswith("application")), None)
          if app is None or app.get("id") != "MoonLightS.MoonlightWasm" or app.get("package") != "MoonLightS":
              raise SystemExit("Unexpected Moonlight Web identity")
          service = next((n for n in manifest.iter() if n.tag.endswith("service-application")), None)
          if manifest.get("package") != "MoonLightS" or manifest.get("api-version") != "6.5" or service is None:
              raise SystemExit("Unexpected Ambilight service package")
          if service.get("appid") != "MoonLightS.MoonlightAmbilight" or service.get("type") != "dotnet" or service.get("exec") != "MoonlightAmbilight.dll" or service.get("api-version") != "9":
              raise SystemExit("Ambilight must remain the original Tizen .NET ServiceApplication")
          manifest.set("version", web.get("version", "1.2.4"))
          tree.write(manifest_path, encoding="UTF-8", xml_declaration=True)

          project_path = Path(sys.argv[3])
          project = project_path.read_text(encoding="utf-8")
          project = project.replace("csproj_file: AmbilightService.csproj", "csproj_file: TizenAmbilight.csproj")
          start = project.find("files:")
          if start < 0:
              raise SystemExit("Tizen Core .NET project metadata has no files list")
          end = project.find("\ndeps:", start)
          if end < 0:
              raise SystemExit("Tizen Core .NET project metadata has no deps section")
          project = project[:start] + "files:\n  - TizenAmbilight.csproj\n  - Program.cs\n  - VideoPlaneCapture.cs\n  - WledOutput.cs\n  - tizen-manifest.xml" + project[end:]
          project_path.write_text(project, encoding="utf-8")
          if "csproj_file: TizenAmbilight.csproj" not in project:
              raise SystemExit("Tizen Core project metadata does not reference TizenAmbilight.csproj")
          PY

            run_tz "add-hybrid-dependency-$name" "$TIZEN_CORE_CLI" add-deps "$web" --deps "../AmbilightService"
            run_tz "build-hybrid-workspace-$name" "$TIZEN_CORE_CLI" build --proj-dir "$web"
            run_tz "pack-hybrid-workspace-$name" "$TIZEN_CORE_CLI" pack --proj-dir "$web" --type wgt --sign-profile Moonlight --profiles-path "$TIZEN_PROFILES_PATH" --out-path "$output"
            test -s "$output"
            unzip -tq "$output"
            python3 - "$source" "$output" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          source, output = Path(sys.argv[1]), Path(sys.argv[2])
          with zipfile.ZipFile(output) as z:
              names = set(z.namelist())
              required = {"config.xml", "tizen-manifest.xml", "res/wgt/config.xml", "res/wgt/index.html", "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm", "res/wgt/service/service.js", "author-signature.xml", "signature1.xml"}
              missing = sorted(required - names)
              if missing: raise SystemExit("Hybrid WGT missing: " + ", ".join(missing))
              for f in source.rglob("*"):
                  if f.is_file():
                      p = "res/wgt/" + f.relative_to(source).as_posix()
                      if p not in names or z.read(p) != f.read_bytes():
                          raise SystemExit("Moonlight Web payload changed or missing: " + p)
              config = ET.fromstring(z.read("res/wgt/config.xml"))
              splash = next((n for n in config.iter() if n.tag.endswith("video_splash_screen")), None)
              if splash is None or splash.get("ready_when") != "custom":
                  raise SystemExit("Moonlight video splash declaration was not preserved")
              print("Single-pass hybrid WGT, signatures, Moonlight payload and video splash verified.")
          PY
          }

          package_one "$RUNNER_TEMP/web-standard" MoonlightWeb "$RUNNER_TEMP/Moonlight.wgt"
          package_one "$RUNNER_TEMP/web-forcegm" MoonlightForceGM "$RUNNER_TEMP/Moonlight-ForceGM.wgt"
          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$RUNNER_TEMP/Moonlight.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight.wgt"
          cp "$RUNNER_TEMP/Moonlight-ForceGM.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight-ForceGM.wgt"
          (cd "$RUNNER_TEMP/hybrid-output" && sha256sum Moonlight.wgt Moonlight-ForceGM.wgt > SHA256SUMS)

      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
      - name: Upload standard hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight.wgt
          if-no-files-found: error
          retention-days: 14

      - name: Upload ForceGM hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-ForceGM-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight-ForceGM.wgt
          if-no-files-found: error
          retention-days: 14
