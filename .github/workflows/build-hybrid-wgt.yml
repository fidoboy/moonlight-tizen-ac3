name: Build Hybrid WGT (CI)

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "res/**"
      - "h264bitstream/**"
      - "libgamestream/**"
      - "moonlight-common-c/**"
      - "opus/**"
      - "ports/**"
      - "wasm/**"
      - "ambilight-service/**"
      - "wmp/**"
      - "tests/wmp_transport_test.js"
      - ".github/workflows/build-hybrid-wgt.yml"
      - "scripts/validate-hybrid-wgt.py"
      - "scripts/verify-tizen-xmlsig.py"
      - "scripts/xml-c14n.c"

permissions:
  contents: read
  actions: write

concurrency:
  group: hybrid-wgt-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wmp-native:
    name: Build WMP native ARM engine and service
    uses: ./.github/workflows/wmp-native-build.yml
    with:
      source_ref: ${{ github.ref_name }}

  build-hybrid:
    needs: build-wmp-native
    if: github.ref == 'refs/heads/1.2.4-pre'
    name: Build and package standard and ForceGM hybrid WGTs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip build-essential libxml2-dev

      - name: Verify the pinned Tizen build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v3"
          docker pull "$image"
          docker run --rm "$image" tz --version
          docker run --rm "$image" dotnet --list-sdks | grep -E '^8\.'
          docker run --rm "$image" test -d /usr/share/dotnet/packs/Samsung.Tizen.Ref/10.0.120
          docker run --rm "$image" test -x /home/tizen/tizen-studio/tools/ide/bin/tizen

      - name: Ensure versioned MP4 splash assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Moonlight Web files (standard)
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-standard:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-standard
          cache-to: type=gha,mode=max,scope=moonlight-web-standard
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Build Moonlight Web files (ForceGM)
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-forcegm:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-forcegm
          cache-to: type=gha,mode=max,scope=moonlight-web-forcegm
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract unsigned Moonlight Web files
        shell: bash
        run: |
          set -euo pipefail
          standard_container="$(docker create "moonlight-hybrid-web-standard:$GITHUB_SHA")"
          forcegm_container="$(docker create "moonlight-hybrid-web-forcegm:$GITHUB_SHA")"
          trap 'docker rm -f "$standard_container" "$forcegm_container" >/dev/null 2>&1 || true' EXIT

          docker cp "$standard_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-standard"
          docker cp "$forcegm_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-forcegm"
          for project in "$RUNNER_TEMP/web-standard" "$RUNNER_TEMP/web-forcegm"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
            test -s "$project/static/res/launch-screen.mp4"
            test -s "$project/static/res/launch-screen-portrait.mp4"
          done

      - name: Download WMP native build artifacts
        uses: actions/download-artifact@v6
        with:
          name: wmp-native-arm
          path: ${{ runner.temp }}/wmp-native

      - name: Validate WMP native build artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/wmp-native/wmp/build/service/bin/wmp-service"
          test -s "$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so"
          test -s "$RUNNER_TEMP/wmp-native/wmp-tv-libs/usr/lib/libecore_wl2.so.1"
          test -s "$RUNNER_TEMP/wmp-native/wmp-tv-libs/usr/lib/libecore.so.1"
          file "$RUNNER_TEMP/wmp-native/wmp/build/service/bin/wmp-service"
          file "$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so"

      - name: Package the Tizen Core hybrid workspaces
        run: |
          set -euo pipefail
          cc -O2 -Wall -Wextra -I/usr/include/libxml2 scripts/xml-c14n.c -o "$RUNNER_TEMP/xml-c14n" -lxml2
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v3"
          docker run --rm -i --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e RUNNER_TEMP=/runner-temp \
            -e GITHUB_SHA="$GITHUB_SHA" \
            "$image" bash -s <<'PACKAGE'
          
          set -euo pipefail
          run_tz() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/tz-${label//[^A-Za-z0-9_-]/_}.log"
            echo "::group::Tizen Core: $label"
            set +e
            "$@" 2>&1 | tee "$log"
            local statuses=("${PIPESTATUS[@]}")
            local command_status="${statuses[0]}"
            set -e
            echo "::endgroup::"
            if (( command_status != 0 )); then
              echo "::error::Tizen Core command failed with exit code $command_status: $*"
              return "$command_status"
            fi
          }
          
          TIZEN_CORE_CLI="/home/tizen/tizen-studio/tools/tizen-core/tz"
          export TIZEN_STUDIO_DATA_PATH="/home/tizen/tizen-studio-data"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH"
        
          cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
          chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
        
          run_tz "create-signing-certificate" tizen certificate -a Moonlight -f Moonlight -p 123456
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
          openssl pkcs12 -legacy -in "$author_key" -passin pass:123456 -noout
          run_tz "register-signing-profile" tizen security-profiles add -n Moonlight -a "$author_key" -p 123456 -- "$TIZEN_STUDIO_DATA_PATH/profile"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          test -s "$profiles"
          author_encrypted='HeifNwdU+kk='
          distributor_encrypted='Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k='
          sed -i -E '/distributor="0"/ s|password="[^"]*"|password="'$author_encrypted'"|' "$profiles"
          sed -i -E '/distributor="1"/ s|password="[^"]*"|password="'$distributor_encrypted'"|' "$profiles"
          grep -Fq 'name="Moonlight"' "$profiles"
          grep -Fq "$author_key" "$profiles"
          awk -v expected="$author_encrypted" '/distributor="0"/ && index($0, "password=\"" expected "\"") { found=1 } END { exit !found }' "$profiles"
          awk -v expected="$distributor_encrypted" '/distributor="1"/ && index($0, "password=\"" expected "\"") { found=1 } END { exit !found }' "$profiles"
          ! grep -Fq '.pwd' "$profiles"
          run_tz "select-signing-profile" tizen cli-config "profiles.path=$profiles"
          run_tz "list-signing-profile" tizen security-profiles list -n Moonlight
        
          workspace="$RUNNER_TEMP/tz-production-workspace"
          web_standard="$workspace/MoonlightWeb"
          web_forcegm="$workspace/MoonlightForceGM"
          service_project="$workspace/AmbilightService/AmbilightService"
          mkdir -p "$workspace"
        
          package_base_web() {
            local source="$1" name="$2" base_wgt="$3"
            local web="$workspace/$name"
            local base_project="$RUNNER_TEMP/$name-base-project"
            run_tz "create-web-project-$name" "$TIZEN_CORE_CLI" new -t Basic_Empty -n "$name" -T web -p tv-samsung-10.0 -w "$workspace"
            test -d "$web"
            cp -a "$source/." "$web/"
            # Keep the Tizen Core project metadata in the workspace because
            # later tz build commands still need it. Package a clean copy as
            # the base WGT, without the unused Basic_Empty template files.
            run_tz "set-web-build-type-$name" "$TIZEN_CORE_CLI" set -b Release -w "$web"
            grep -Fqx "build_type: Release" "$web/tizen_web_project.yaml"
            rm -rf "$base_project"
            mkdir -p "$base_project"
            cp -a "$web/." "$base_project/"
            rm -f "$base_project/tizen_web_project.yaml" "$base_project/css/style.css" "$base_project/main.js"
            rmdir "$base_project/css" 2>/dev/null || true
            run_tz "sign-base-web-wgt-$name" expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$base_project"
            mapfile -t generated_wgts < <(find "$base_project" -maxdepth 1 -type f -name '*.wgt' -print | sort)
            if (( ${#generated_wgts[@]} != 1 )); then
              echo "::error::Expected exactly one base Web WGT in $base_project; found ${#generated_wgts[@]}."
              printf '%s\\n' "${generated_wgts[@]}"
              exit 1
            fi
            test -s "${generated_wgts[0]}"
            cp "${generated_wgts[0]}" "$base_wgt"
            unzip -tq "$base_wgt"
            if unzip -Z1 "$base_wgt" | grep -Fxq 'tizen_web_project.yaml' ||
               unzip -Z1 "$base_wgt" | grep -Fxq 'css/style.css' ||
               unzip -Z1 "$base_wgt" | grep -Fxq 'main.js'; then
              echo "::error::Unused Basic_Empty template files remain in base WGT $name."
              exit 1
            fi
          }
        
          package_base_web "$RUNNER_TEMP/web-standard" MoonlightWeb "$RUNNER_TEMP/MoonlightWeb-base.wgt"
          package_base_web "$RUNNER_TEMP/web-forcegm" MoonlightForceGM "$RUNNER_TEMP/MoonlightForceGM-base.wgt"
        
          run_tz "create-dotnet-service" "$TIZEN_CORE_CLI" new -t TizenServiceApp -n AmbilightService -T dotnet -p tv-samsung-10.0 -w "$workspace"
          test -d "$service_project"
          rm -f "$service_project/AmbilightService_App.cs"
          cp ambilight-service/Program.cs ambilight-service/VideoPlaneCapture.cs ambilight-service/WledOutput.cs "$service_project/"
          cp ambilight-service/tizen-manifest.xml "$service_project/tizen-manifest.xml"
          cp ambilight-service/TizenAmbilight.csproj "$service_project/AmbilightService.csproj"
          cat > "$service_project/tizen_dotnet_project.yaml" <<'YAML'
          csproj_file: AmbilightService.csproj
          profile: tv-samsung
          api_version: "10.0"
          build_type: Release
          signing_profile: Moonlight
          files:
            - AmbilightService.csproj
            - Program.cs
            - VideoPlaneCapture.cs
            - WledOutput.cs
            - tizen-manifest.xml
            - shared/res/AmbilightService.png
          deps: []
          YAML
        
          run_tz "build-web-standard-standalone" "$TIZEN_CORE_CLI" build -w "$web_standard" -s Moonlight -b Release
          run_tz "build-web-forcegm-standalone" "$TIZEN_CORE_CLI" build -w "$web_forcegm" -s Moonlight -b Release
          run_tz "add-service-dependency-standard" "$TIZEN_CORE_CLI" add-deps "$web_standard" -d ../AmbilightService/AmbilightService
          run_tz "add-service-dependency-forcegm" "$TIZEN_CORE_CLI" add-deps "$web_forcegm" -d ../AmbilightService/AmbilightService
          run_tz "build-hybrid-standard" "$TIZEN_CORE_CLI" build -w "$web_standard" -s Moonlight -b Release
          run_tz "build-hybrid-forcegm" "$TIZEN_CORE_CLI" build -w "$web_forcegm" -s Moonlight -b Release
        
          mapfile -t service_pkgs < <(find "$service_project/bin/Release/net8.0-tizen10.0" -type f -name '*.tpk' -not -path '*/obj/*' | sort)
          if (( ${#service_pkgs[@]} != 1 )); then
            echo "::error::Expected exactly one Tizen 10 service TPK; found ${#service_pkgs[@]}."
            printf '%s\\n' "${service_pkgs[@]}"
            exit 1
          fi
          service_tpk="${service_pkgs[0]}"
          test -s "$service_tpk"
          echo "Ambilight service TPK: $service_tpk"
          unzip -tq "$service_tpk"

          # Build the independent WMP ServiceApp TPK. Its engine library is
          # supplied by the reusable native ARM build job above.
          wmp_project="$workspace/WmpService"
          run_tz "create-wmp-native-project" tizen create native-project -p tizen-10.0 -t ServiceApp -n WmpService -- "$workspace"
          test -d "$wmp_project"
          mkdir -p "$wmp_project/src" "$wmp_project/lib"
          cp wmp/service/src/main.c wmp/service/src/wmp_esplus_abi.h wmp/upstream/mlclient/mlengine.h "$wmp_project/src/"
          cp "$RUNNER_TEMP/wmp-native/wmp/build/service/lib/libmlengine.so" "$wmp_project/lib/libmlengine.so"
          cp wmp/service/tizen-manifest.xml "$wmp_project/tizen-manifest.xml"

          python3 - "$web_standard/config.xml" "$wmp_project/tizen-manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          web = ET.parse(sys.argv[1]).getroot()
          tree = ET.parse(sys.argv[2]); native = tree.getroot()
          version = web.attrib.get("version")
          if not version: raise SystemExit("Web config.xml has no version")
          if native.attrib.get("package") != "MoonLightS":
              raise SystemExit("WMP manifest package ID must be MoonLightS")
          app = next((n for n in native.iter() if n.tag.endswith("service-application")), None)
          if app is None or app.attrib.get("appid") != "MoonLightS.WmpService" or app.attrib.get("exec") != "wmp-service":
              raise SystemExit("Unexpected WMP native service identity")
          if app.attrib.get("on-boot") != "false" or app.attrib.get("auto-restart") != "false":
              raise SystemExit("WMP service must remain opt-in")
          native.set("version", version)
          tree.write(sys.argv[2], encoding="UTF-8", xml_declaration=True)
          PY

          cat > "$wmp_project/project_def.prop" <<PROP
          APPNAME = wmp-service

          type = app
          profile = iot-headed-6.0

          USER_SRCS = src/main.c
          USER_DEFS =
          USER_INC_DIRS = src
          USER_OBJS =
          USER_LIBS = appcore-agent dlog message-port bundle dl pthread mlengine
          USER_LFLAGS = -Wl,--no-undefined -Wl,-rpath-link,$RUNNER_TEMP/wmp-native/wmp-tv-libs/usr/lib -L$RUNNER_TEMP/wmp-native/wmp-tv-libs/usr/lib
          USER_EDCS =
          PROP

          if [[ -f "$wmp_project/.tproject" ]]; then
            sed -i 's/tizen-10.0/iot-headed-6.0/g' "$wmp_project/.tproject"
          fi

          python3 - "$wmp_project/.cproject" <<'PY'
          import re, sys
          from pathlib import Path
          path = Path(sys.argv[1]); content = path.read_text(encoding="utf-8")
          options = re.compile(
              r'(<option[^>]*superClass="sbi[.]gnu[.]cpp[.]linker[.]option[.]frameworks_lflags[.]core"[^>]*>).*?(</option>)',
              re.DOTALL)
          sysroot = "$" + "{SBI_SYSROOT}"
          flags = "\n".join([
              '                                    <listOptionValue builtIn="false" value="-Wl,-z,relro,--as-needed"/>',
              '                                    <listOptionValue builtIn="false" value="--sysroot=&quot;' + sysroot + '&quot;"/>'])
          content, n = options.subn(lambda m: m.group(1) + "\n" + flags + "\n                                " + m.group(2), content)
          if n != 2: raise SystemExit(f"Expected 2 linker configurations, found {n}")
          selectors = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option"[^>]*>.*?</option>',
              re.DOTALL)
          content, n = selectors.subn("", content)
          if n != 4: raise SystemExit(f"Expected 4 Tizen 10 SBI selectors, found {n}")
          catalogues = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option[.]frameworks[.]core"[^>]*>.*?</option>',
              re.DOTALL)
          content, n = catalogues.subn("", content)
          if n != 4: raise SystemExit(f"Expected 4 Tizen 10 Native_API catalogues, found {n}")
          if "tizen-10.0-emulator64.core_gcc92.x86.64" in content or re.search(r'value="Native_API"', content):
              raise SystemExit("Tizen 10 platform selectors remain")
          path.write_text(content, encoding="utf-8")
          PY

          wmp_expect="$RUNNER_TEMP/wmp-build-expect.exp"
          cat > "$wmp_expect" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            -re {Distributor1 password:} { send -- "tizenpkcs12passfordsigner\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
          chmod 600 "$wmp_expect"
          run_tz "build-wmp-service-tpk" expect "$wmp_expect" tizen build-app \
            -m 'name:m1,compiler:gcc,rootstraps:[{"name":"iot-headed-6.0-device.core","platform":"iot-headed-6.0","arch":"arm"}],configs:[Release]' \
            -b 'name:b1,targets:[WmpService],methods:[m1]' \
            -p 'name:p1,targets:[b1]' \
            -s Moonlight \
            -- "$workspace"

          mapfile -t wmp_pkgs < <(find "$wmp_project" -type f -name '*.tpk' -not -path '*/obj/*' | sort)
          if (( ${#wmp_pkgs[@]} != 1 )); then
            echo "::error::Expected exactly one WMP service TPK; found ${#wmp_pkgs[@]}."
            printf '%s\n' "${wmp_pkgs[@]}"
            exit 1
          fi
          wmp_tpk="${wmp_pkgs[0]}"
          test -s "$wmp_tpk"
          echo "WMP service TPK: $wmp_tpk"
          unzip -tq "$wmp_tpk"
          unzip -Z1 "$wmp_tpk" | grep -Fxq 'bin/wmp-service'
          unzip -Z1 "$wmp_tpk" | grep -Fxq 'lib/libmlengine.so'
        
          package_hybrid() {
            local source="$1" name="$2" base_wgt="$3" output="$4"
            local draft="$RUNNER_TEMP/$name-unsigned.wgt"
            local project="$RUNNER_TEMP/$name-final-project"
          
            # 1. Assemble the hybrid WGT without asking Tizen Core to sign it.
            run_tz "pack-hybrid-wgt-$name" "$TIZEN_CORE_CLI" pack --type wgt --ref-pkgs "$service_tpk;$wmp_tpk" --base-pkg "$base_wgt" --out-path "$draft"
            test -s "$draft"
            unzip -tq "$draft"
          
            # 2. Expand the assembled package so the standard Tizen CLI can sign
            #    the complete hybrid payload, including the embedded service TPK.
            rm -rf "$project"
            mkdir -p "$project"
            unzip -q "$draft" -d "$project"

            # Keep splash assets only in Moonlight's original Web location.
            # Point the outer hybrid manifest at the embedded Web resources.
            python3 - "$project/config.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          tree = ET.parse(path)
          root = tree.getroot()
          changed = 0
          for node in root.iter():
              for attribute in ("video", "background_image", "image"):
                  value = node.get(attribute)
                  if value and value.startswith("static/res/"):
                      node.set(attribute, "res/wgt/" + value)
                      changed += 1
          if not changed:
              raise SystemExit("Outer config.xml contains no package-root splash resource paths to relocate")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          print(f"Redirected {changed} outer splash resource reference(s) to res/wgt/static/res/.")
          PY

            # The outer manifest points at the original Web assets; remove
            # any package-root duplicates produced by the initial hybrid pack.
            rm -f "$project"/static/res/launch-screen.mp4 \\
                  "$project"/static/res/launch-screen-portrait.mp4 \\
                  "$project"/static/res/launch-screen.png \\
                  "$project"/static/res/launch-screen-portrait.png
          
            # 3. Keep the Web installation floor at Tizen 5.5 while preserving
            #    the embedded .NET service's original Tizen 10 API 13 requirement.
            python3 - "$project/tizen-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          
          path = sys.argv[1]
          ET.register_namespace("", "http://tizen.org/ns/packages")
          tree = ET.parse(path)
          root = tree.getroot()
          service_apps = {
              node.get("appid"): node for node in root.iter()
              if node.tag.endswith("service-application")
          }
          ambilight = service_apps.get("MoonLightS.MoonlightAmbilight")
          wmp = service_apps.get("MoonLightS.WmpService")
          if ambilight is None or wmp is None:
              raise SystemExit("Hybrid manifest must contain both Ambilight and WMP services")
          if ambilight.get("api-version") != "13":
              raise SystemExit("Embedded Ambilight service API 13 requirement changed unexpectedly")
          for app in (ambilight, wmp):
              if app.get("on-boot") != "false" or app.get("auto-restart") != "false":
                  raise SystemExit("Auxiliary services must remain opt-in and must not auto-start")
          root.set("api-version", "5.5")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          print("Hybrid manifest floor set to Tizen 5.5; embedded service remains Tizen 10 API 13.")
          PY
          
            # 4. Sign the already assembled hybrid project with the standard
            #    Tizen package command. Prompts match the AC3 Dockerfile.
            cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
            chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
            expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$project"
          
            test -s "$project/Moonlight.wgt"
            cp "$project/Moonlight.wgt" "$output"
            unzip -tq "$output"
          
            # Verify the XML signatures cryptographically using the certificates
            # embedded in each signature, including all referenced package digests.
            local signature_check="$RUNNER_TEMP/$name-signature-check"
            rm -rf "$signature_check"
            mkdir -p "$signature_check"
            unzip -q "$output" -d "$signature_check"

            author_certificate="$RUNNER_TEMP/author-signing-certificate.pem"
            distributor_certificate="$RUNNER_TEMP/distributor-signing-certificate.pem"
            openssl pkcs12 -legacy -in "/home/tizen/tizen-studio-data/keystore/author/Moonlight.p12" \
              -clcerts -nokeys -passin pass:123456 -out "$author_certificate"
            distributor_password="$(printf '%s' 'dGl6ZW5wa2NzMTJwYXNzZm9yZHNpZ25lcg==' | base64 -d)"
            openssl pkcs12 -legacy -in "/home/tizen/tizen-studio/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12" \
              -clcerts -nokeys -passin "pass:$distributor_password" -out "$distributor_certificate"
            python3 scripts/verify-tizen-xmlsig.py "$signature_check" \
              "$author_certificate" "$distributor_certificate" /runner-temp/xml-c14n
          
            # 5. Validate the final signed WGT, not the unsigned tz pack output.
            python3 - "$output" "$service_tpk" "$wmp_tpk" "$source" <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          
          package_path, ambilight_tpk_path, wmp_tpk_path, source_path = map(Path, sys.argv[1:])
          with zipfile.ZipFile(package_path) as package, zipfile.ZipFile(ambilight_tpk_path) as ambilight, zipfile.ZipFile(wmp_tpk_path) as wmp:
              names = set(package.namelist())
              # Tizen Core expands referenced service TPKs into the outer WGT.
              # Their manifest/signature metadata is represented by the combined
              # outer manifest/signatures; all executable payloads stay byte-identical.
              service_metadata = {
                  "tizen-manifest.xml", "author-signature.xml",
                  "signature1.xml", "signature2.xml",
              }
              total_service_payload = 0
              for service_name, service in (("Ambilight", ambilight), ("WMP", wmp)):
                  service_names = set(service.namelist())
                  service_payload = {
                      name for name in service_names
                      if not name.endswith("/") and name not in service_metadata
                  }
                  missing_service = sorted(service_payload - names)
                  if missing_service:
                      raise SystemExit(
                          f"Final hybrid WGT is missing expanded {service_name} TPK files: "
                          + ", ".join(missing_service)
                      )
                  changed_service = [
                      name for name in sorted(service_payload)
                      if package.read(name) != service.read(name)
                  ]
                  if changed_service:
                      raise SystemExit(
                          f"Expanded {service_name} TPK payload changed during hybrid signing: "
                          + ", ".join(changed_service)
                      )
                  total_service_payload += len(service_payload)
          
              required = {
                  "config.xml", "tizen-manifest.xml", "author-signature.xml",
                  "signature1.xml", "res/wgt/config.xml", "res/wgt/index.html",
                  "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm",
                  "res/wgt/service/service.js",
                  "res/wgt/static/res/launch-screen.mp4",
                  "res/wgt/static/res/launch-screen-portrait.mp4",
                  "res/wgt/static/res/launch-screen.png",
                  "res/wgt/static/res/launch-screen-portrait.png",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Final signed hybrid WGT missing: " + ", ".join(missing))
          
              ds = "{http://www.w3.org/2000/09/xmldsig#}"
              for signature_name in ("author-signature.xml", "signature1.xml"):
                  try:
                      signature_root = ET.fromstring(package.read(signature_name))
                  except ET.ParseError as exc:
                      raise SystemExit(f"Invalid {signature_name}: {exc}")
                  signatures = list(signature_root.iter(ds + "Signature"))
                  if not signatures:
                      raise SystemExit(f"{signature_name} contains no XML Digital Signature")
                  for signature in signatures:
                      value = signature.find(".//" + ds + "SignatureValue")
                      refs = signature.findall(".//" + ds + "Reference")
                      if value is None or not (value.text or "").strip():
                          raise SystemExit(f"{signature_name} has an empty SignatureValue")
                      if not refs or any(
                          ref.find(ds + "DigestValue") is None or
                          not (ref.find(ds + "DigestValue").text or "").strip()
                          for ref in refs
                      ):
                          raise SystemExit(f"{signature_name} has missing reference digests")
          
              manifest = ET.fromstring(package.read("tizen-manifest.xml"))
              service_app = next((node for node in manifest.iter()
                                  if node.tag.endswith("service-application")), None)
              if manifest.get("api-version") != "5.5":
                  raise SystemExit("Final hybrid package minimum must remain Tizen 5.5")
              if service_app is None or service_app.get("api-version") != "13":
                  raise SystemExit("Final hybrid package changed the embedded service API 13 target")
          
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in final hybrid WGT: {name}")
          
              for item in source_path.rglob("*"):
                  if item.is_file():
                      member = "res/wgt/" + item.relative_to(source_path).as_posix()
                      if member not in names or package.read(member) != item.read_bytes():
                          raise SystemExit("Moonlight Web payload changed or missing after signing: " + member)
          
              config = ET.fromstring(package.read("res/wgt/config.xml"))
              splash = next((node for node in config.iter()
                             if node.tag.endswith("video_splash_screen")), None)
              if splash is None or splash.get("ready_when") != "video-finished":
                  raise SystemExit("Moonlight video splash declaration was not preserved")

              for asset in (
                  "launch-screen.mp4",
                  "launch-screen-portrait.mp4",
                  "launch-screen.png",
                  "launch-screen-portrait.png",
              ):
                  outer = "static/res/" + asset
                  inner = "res/wgt/static/res/" + asset
                  if outer in names:
                      raise SystemExit("Duplicate package-root splash asset remains: " + outer)
                  if inner not in names or not package.read(inner):
                      raise SystemExit("Missing embedded Moonlight splash asset: " + inner)
          
              print("Final signed hybrid WGT verified:")
              print(f"  Both service TPK payloads byte-for-byte preserved: {total_service_payload} files.")
              print("  Author and distributor XML signatures are present and structurally valid.")
              print("  Moonlight Web payload, manifest and video splash are preserved.")
          PY
          }
          
          package_hybrid "$RUNNER_TEMP/web-standard" MoonlightWeb "$RUNNER_TEMP/MoonlightWeb-base.wgt" "$RUNNER_TEMP/Moonlight.wgt"
          package_hybrid "$RUNNER_TEMP/web-forcegm" MoonlightForceGM "$RUNNER_TEMP/MoonlightForceGM-base.wgt" "$RUNNER_TEMP/Moonlight-ForceGM.wgt"
          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$RUNNER_TEMP/Moonlight.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight.wgt"
          cp "$RUNNER_TEMP/Moonlight-ForceGM.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight-ForceGM.wgt"
          (cd "$RUNNER_TEMP/hybrid-output" && sha256sum Moonlight.wgt Moonlight-ForceGM.wgt > SHA256SUMS)
          
          
          PACKAGE

      - name: Audit standard and ForceGM hybrid WGT contents
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-hybrid-wgt.py --base-wgt "$RUNNER_TEMP/MoonlightWeb-base.wgt" --hybrid-wgt "$RUNNER_TEMP/hybrid-output/Moonlight.wgt" --variant standard
          python3 scripts/validate-hybrid-wgt.py --base-wgt "$RUNNER_TEMP/MoonlightForceGM-base.wgt" --hybrid-wgt "$RUNNER_TEMP/hybrid-output/Moonlight-ForceGM.wgt" --variant ForceGM

      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
      - name: Upload standard hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight.wgt
          if-no-files-found: error
          retention-days: 14

      - name: Upload ForceGM hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-ForceGM-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight-ForceGM.wgt
          if-no-files-found: error
          retention-days: 14
