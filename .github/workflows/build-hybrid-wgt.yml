name: Build Hybrid WGT (CI)

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "CMakeLists.txt"
      - "Dockerfile"
      - ".dockerignore"
      - "res/**"
      - "h264bitstream/**"
      - "libgamestream/**"
      - "moonlight-common-c/**"
      - "opus/**"
      - "ports/**"
      - "wasm/**"
      - "ambilight-service/**"
      - ".github/workflows/build-hybrid-wgt.yml"
      - "scripts/validate-hybrid-wgt.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: hybrid-wgt-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hybrid:
    if: github.ref == 'refs/heads/1.2.4-pre'
    name: Build and package standard and ForceGM hybrid WGTs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip build-essential libxml2-dev pkg-config

      - name: Verify the pinned Tizen build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v2"
          docker pull "$image"
          docker run --rm "$image" tz --version
          docker run --rm "$image" dotnet --list-sdks | grep -E '^8\.'
          docker run --rm "$image" test -d /usr/share/dotnet/packs/Samsung.Tizen.Ref/10.0.120
          docker run --rm "$image" test -x /home/tizen/tizen-studio/tools/ide/bin/tizen

      - name: Ensure versioned MP4 splash assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Moonlight Web files (standard)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-standard:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-standard
          cache-to: type=gha,mode=max,scope=moonlight-web-standard
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Build Moonlight Web files (ForceGM)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-hybrid-web-forcegm:${{ github.sha }}
          cache-from: type=gha,scope=moonlight-web-forcegm
          cache-to: type=gha,mode=max,scope=moonlight-web-forcegm
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract unsigned Moonlight Web files
        shell: bash
        run: |
          set -euo pipefail
          standard_container="$(docker create "moonlight-hybrid-web-standard:$GITHUB_SHA")"
          forcegm_container="$(docker create "moonlight-hybrid-web-forcegm:$GITHUB_SHA")"
          trap 'docker rm -f "$standard_container" "$forcegm_container" >/dev/null 2>&1 || true' EXIT

          docker cp "$standard_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-standard"
          docker cp "$forcegm_container:/home/moonlight/build/widget" "$RUNNER_TEMP/web-forcegm"
          for project in "$RUNNER_TEMP/web-standard" "$RUNNER_TEMP/web-forcegm"; do
            test -s "$project/config.xml"
            test -s "$project/index.html"
            test -s "$project/moonlight-wasm.js"
            test -s "$project/moonlight-wasm.wasm"
            test -s "$project/service/service.js"
            test -s "$project/static/res/launch-screen.mp4"
            test -s "$project/static/res/launch-screen-portrait.mp4"
          done

      - name: Package the Tizen Core hybrid workspaces
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v2"
          docker run --rm -i --user root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /workspace \
            -e RUNNER_TEMP=/runner-temp \
            -e GITHUB_SHA="$GITHUB_SHA" \
            "$image" bash -s <<'PACKAGE'
          
          set -euo pipefail
          run_tz() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/tz-${label//[^A-Za-z0-9_-]/_}.log"
            echo "::group::Tizen Core: $label"
            set +e
            "$@" 2>&1 | tee "$log"
            local statuses=("${PIPESTATUS[@]}")
            local command_status="${statuses[0]}"
            set -e
            echo "::endgroup::"
            if (( command_status != 0 )); then
              echo "::error::Tizen Core command failed with exit code $command_status: $*"
              return "$command_status"
            fi
          }
          
          TIZEN_CORE_CLI="/home/tizen/tizen-studio/tools/tizen-core/tz"
          export TIZEN_STUDIO_DATA_PATH="/home/tizen/tizen-studio-data"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH"
        
          cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
          chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
        
          run_tz "create-signing-certificate" tizen certificate -a Moonlight -f Moonlight -p 123456
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
          openssl pkcs12 -legacy -in "$author_key" -passin pass:123456 -noout
          run_tz "register-signing-profile" tizen security-profiles add -n Moonlight -a "$author_key" -p 123456 -- "$TIZEN_STUDIO_DATA_PATH/profile"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          test -s "$profiles"
          author_encrypted='HeifNwdU+kk='
          distributor_encrypted='Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k='
          sed -i -E '/distributor="0"/ s|password="[^"]*"|password="'$author_encrypted'"|' "$profiles"
          sed -i -E '/distributor="1"/ s|password="[^"]*"|password="'$distributor_encrypted'"|' "$profiles"
          grep -Fq 'name="Moonlight"' "$profiles"
          grep -Fq "$author_key" "$profiles"
          awk -v expected="$author_encrypted" '/distributor="0"/ && index($0, "password=\"" expected "\"") { found=1 } END { exit !found }' "$profiles"
          awk -v expected="$distributor_encrypted" '/distributor="1"/ && index($0, "password=\"" expected "\"") { found=1 } END { exit !found }' "$profiles"
          ! grep -Fq '.pwd' "$profiles"
          run_tz "select-signing-profile" tizen cli-config "profiles.path=$profiles"
          run_tz "list-signing-profile" tizen security-profiles list -n Moonlight
        
          workspace="$RUNNER_TEMP/tz-production-workspace"
          web_standard="$workspace/MoonlightWeb"
          web_forcegm="$workspace/MoonlightForceGM"
          service_project="$workspace/AmbilightService/AmbilightService"
          mkdir -p "$workspace"
        
          package_base_web() {
            local source="$1" name="$2" base_wgt="$3"
            local web="$workspace/$name"
            run_tz "create-web-project-$name" "$TIZEN_CORE_CLI" new -t Basic_Empty -n "$name" -T web -p tv-samsung-10.0 -w "$workspace"
            test -d "$web"
            cp -a "$source/." "$web/"
            run_tz "sign-base-web-wgt-$name" expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$web"
            mapfile -t generated_wgts < <(find "$web" -maxdepth 1 -type f -name '*.wgt' -print | sort)
            if (( ${#generated_wgts[@]} != 1 )); then
              echo "::error::Expected exactly one base Web WGT in $web; found ${#generated_wgts[@]}."
              printf '%s\\n' "${generated_wgts[@]}"
              exit 1
            fi
            test -s "${generated_wgts[0]}"
            cp "${generated_wgts[0]}" "$base_wgt"
            unzip -tq "$base_wgt"
          }
        
          package_base_web "$RUNNER_TEMP/web-standard" MoonlightWeb "$RUNNER_TEMP/MoonlightWeb-base.wgt"
          package_base_web "$RUNNER_TEMP/web-forcegm" MoonlightForceGM "$RUNNER_TEMP/MoonlightForceGM-base.wgt"
        
          run_tz "create-dotnet-service" "$TIZEN_CORE_CLI" new -t TizenServiceApp -n AmbilightService -T dotnet -p tv-samsung-10.0 -w "$workspace"
          test -d "$service_project"
          rm -f "$service_project/AmbilightService_App.cs"
          cp ambilight-service/Program.cs ambilight-service/VideoPlaneCapture.cs ambilight-service/WledOutput.cs "$service_project/"
          cp ambilight-service/tizen-manifest.xml "$service_project/tizen-manifest.xml"
          cp ambilight-service/TizenAmbilight.csproj "$service_project/AmbilightService.csproj"
          cat > "$service_project/tizen_dotnet_project.yaml" <<'YAML'
          csproj_file: AmbilightService.csproj
          profile: tv-samsung
          api_version: "10.0"
          build_type: Release
          signing_profile: Moonlight
          files:
            - AmbilightService.csproj
            - Program.cs
            - VideoPlaneCapture.cs
            - WledOutput.cs
            - tizen-manifest.xml
            - shared/res/AmbilightService.png
          deps: []
          YAML
        
          run_tz "build-web-standard-standalone" "$TIZEN_CORE_CLI" build -w "$web_standard" -s Moonlight -b Release
          run_tz "build-web-forcegm-standalone" "$TIZEN_CORE_CLI" build -w "$web_forcegm" -s Moonlight -b Release
          run_tz "add-service-dependency-standard" "$TIZEN_CORE_CLI" add-deps "$web_standard" -d ../AmbilightService/AmbilightService
          run_tz "add-service-dependency-forcegm" "$TIZEN_CORE_CLI" add-deps "$web_forcegm" -d ../AmbilightService/AmbilightService
          run_tz "build-hybrid-standard" "$TIZEN_CORE_CLI" build -w "$web_standard" -s Moonlight -b Release
          run_tz "build-hybrid-forcegm" "$TIZEN_CORE_CLI" build -w "$web_forcegm" -s Moonlight -b Release
        
          mapfile -t service_pkgs < <(find "$service_project/bin/Release/net8.0-tizen10.0" -type f -name '*.tpk' -not -path '*/obj/*' | sort)
          if (( ${#service_pkgs[@]} != 1 )); then
            echo "::error::Expected exactly one Tizen 10 service TPK; found ${#service_pkgs[@]}."
            printf '%s\\n' "${service_pkgs[@]}"
            exit 1
          fi
          service_tpk="${service_pkgs[0]}"
          test -s "$service_tpk"
          echo "Service TPK: $service_tpk"
          unzip -tq "$service_tpk"
        
          package_hybrid() {
            local source="$1" name="$2" base_wgt="$3" output="$4"
            local draft="$RUNNER_TEMP/$name-unsigned.wgt"
            local project="$RUNNER_TEMP/$name-final-project"
          
            # 1. Assemble the hybrid WGT without asking Tizen Core to sign it.
            run_tz "pack-hybrid-wgt-$name" "$TIZEN_CORE_CLI" pack --type wgt --ref-pkgs "$service_tpk" --base-pkg "$base_wgt" --out-path "$draft"
            test -s "$draft"
            unzip -tq "$draft"
          
            # 2. Expand the assembled package so the standard Tizen CLI can sign
            #    the complete hybrid payload, including the embedded service TPK.
            rm -rf "$project"
            mkdir -p "$project"
            unzip -q "$draft" -d "$project"
          
            # 3. Keep the Web installation floor at Tizen 5.5 while preserving
            #    the embedded .NET service's original Tizen 10 API 13 requirement.
            python3 - "$project/tizen-manifest.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          
          path = sys.argv[1]
          ET.register_namespace("", "http://tizen.org/ns/packages")
          tree = ET.parse(path)
          root = tree.getroot()
          service_app = next((node for node in root.iter()
                              if node.tag.endswith("service-application")), None)
          if service_app is None:
              raise SystemExit("Hybrid manifest has no embedded service application")
          if service_app.get("api-version") != "13":
              raise SystemExit("Embedded service API 13 requirement changed unexpectedly")
          root.set("api-version", "5.5")
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          print("Hybrid manifest floor set to Tizen 5.5; embedded service remains Tizen 10 API 13.")
          PY
          
            # 4. Sign the already assembled hybrid project with the standard
            #    Tizen package command. Prompts match the AC3 Dockerfile.
            cat > "$RUNNER_TEMP/tizen-package-expect.exp" <<'EXPECT'
          set timeout -1
          log_user 1
          spawn {*}$argv
          expect {
            -re {Author password:} { send -- "123456\r"; exp_continue }
            "Yes: (Y), No: (N) ?" { send -- "N\r"; exp_continue }
            eof
          }
          set status [wait]
          exit [lindex $status 3]
          EXPECT
            chmod 600 "$RUNNER_TEMP/tizen-package-expect.exp"
            expect "$RUNNER_TEMP/tizen-package-expect.exp" tizen package -t wgt -- "$project"
          
            test -s "$project/Moonlight.wgt"
            cp "$project/Moonlight.wgt" "$output"
            unzip -tq "$output"
          
            # Verify the XML signatures cryptographically using the certificates
            # embedded in each signature, including all referenced package digests.
            local signature_check="$RUNNER_TEMP/$name-signature-check"
            rm -rf "$signature_check"
            mkdir -p "$signature_check"
            unzip -q "$output" -d "$signature_check"

            # Preserve the exact Tizen-generated XMLDSig documents and signed
            # package for diagnosis, even when the cryptographic verifier fails.
            local signature_diagnostics="$RUNNER_TEMP/hybrid-signature-diagnostics/$name"
            mkdir -p "$signature_diagnostics"
            cp "$signature_check/author-signature.xml" "$signature_diagnostics/"
            cp "$signature_check/signature1.xml" "$signature_diagnostics/"
            cp "$output" "$signature_diagnostics/signed-hybrid.wgt"

            python3 - "$signature_check" \
              "/home/tizen/tizen-studio-data/keystore/author/Moonlight.p12" \
              "/home/tizen/tizen-studio/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12" <<'PY'
          import base64
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote
          
          root = Path(sys.argv[1])
          expected_pkcs12 = {
              "author-signature.xml": (Path(sys.argv[2]), "123456"),
              "signature1.xml": (
                  Path(sys.argv[3]),
                  "tizenpkcs12passfordsigner",
              ),
          }
          ns = "{http://www.w3.org/2000/09/xmldsig#}"
          
          def extract_signing_certificate(p12, password, output):
              subprocess.run(
                  [
                      "openssl", "pkcs12", "-legacy", "-in", str(p12), "-clcerts",
                      "-nokeys", "-passin", "pass:" + password,
                      "-out", str(output),
                  ],
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              result = subprocess.run(
                  ["openssl", "x509", "-in", str(output), "-outform", "DER"],
                  check=True,
                  stdout=subprocess.PIPE,
              )
              return result.stdout
          
          for filename, (p12, password) in expected_pkcs12.items():
              signature = root / filename
              tree = ET.parse(signature)
              cert = tree.find(".//" + ns + "X509Certificate")
              if cert is None or not (cert.text or "").strip():
                  raise SystemExit(f"{filename} has no embedded signing certificate")
          
              embedded_der = base64.b64decode("".join(cert.text.split()), validate=True)
              expected_pem = root / (filename + ".expected.pem")
              expected_der = extract_signing_certificate(p12, password, expected_pem)
              if embedded_der != expected_der:
                  raise SystemExit(
                      f"{filename} certificate does not match the configured signing certificate"
                  )
          
              pem = root / (filename + ".pem")
              pem.write_text(
                  "-----BEGIN CERTIFICATE-----\n" +
                  "\n".join(
                      base64.b64encode(embedded_der).decode("ascii")[i:i + 64]
                      for i in range(0, len(base64.b64encode(embedded_der)), 64)
                  ) +
                  "\n-----END CERTIFICATE-----\n",
                  encoding="ascii",
              )
          
              argv = [
                  "xmlsec1", "--verify", "--insecure",
                  "--pubkey-cert-pem", str(pem),
                  "--enabled-reference-uris", "empty,same-doc,local",
              ]
              for reference in tree.findall(".//" + ns + "Reference"):
                  uri = reference.get("URI", "")
                  if not uri or uri.startswith("#"):
                      continue
                  decoded_uri = unquote(uri, errors="strict")
                  relative = PurePosixPath(decoded_uri)
                  if (
                      relative.is_absolute()
                      or "\\" in decoded_uri
                      or "\x00" in decoded_uri
                      or ".." in relative.parts
                      or not relative.parts
                  ):
                      raise SystemExit(f"{filename} contains an unsafe external reference: {uri}")
                  target = (root / Path(*relative.parts)).resolve()
                  try:
                      target.relative_to(root.resolve())
                  except ValueError:
                      raise SystemExit(f"{filename} contains an external reference outside the package: {uri}")
                  if not target.is_file():
                      raise SystemExit(
                          f"{filename} references missing package file: {uri} (decoded as {decoded_uri})"
                      )
                  argv.extend([f"--url-map:{uri}", str(target)])
          
              argv.append(str(signature))
              subprocess.run(argv, cwd=root, check=True)
              print(
                  f"Cryptographically verified {filename}; "
                  "embedded certificate matches configured signer."
              )
          PY
          
            # 5. Validate the final signed WGT, not the unsigned tz pack output.
            python3 - "$output" "$service_tpk" "$source" <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path, PurePosixPath
          
          package_path, service_tpk_path, source_path = map(Path, sys.argv[1:])
          with zipfile.ZipFile(package_path) as package:
              names = set(package.namelist())
              tpks = [name for name in names if name.lower().endswith(".tpk")]
              if not tpks:
                  raise SystemExit("Final signed hybrid WGT does not contain the embedded service TPK")
              if len(tpks) != 1:
                  raise SystemExit(f"Expected one embedded service TPK, found {len(tpks)}")
              if package.read(tpks[0]) != service_tpk_path.read_bytes():
                  raise SystemExit("Signing changed or replaced the embedded service TPK")
          
              required = {
                  "config.xml", "tizen-manifest.xml", "author-signature.xml",
                  "signature1.xml", "res/wgt/config.xml", "res/wgt/index.html",
                  "res/wgt/moonlight-wasm.js", "res/wgt/moonlight-wasm.wasm",
                  "res/wgt/service/service.js",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Final signed hybrid WGT missing: " + ", ".join(missing))
          
              ds = "{http://www.w3.org/2000/09/xmldsig#}"
              for signature_name in ("author-signature.xml", "signature1.xml"):
                  try:
                      signature_root = ET.fromstring(package.read(signature_name))
                  except ET.ParseError as exc:
                      raise SystemExit(f"Invalid {signature_name}: {exc}")
                  signatures = list(signature_root.iter(ds + "Signature"))
                  if not signatures:
                      raise SystemExit(f"{signature_name} contains no XML Digital Signature")
                  for signature in signatures:
                      value = signature.find(".//" + ds + "SignatureValue")
                      refs = signature.findall(".//" + ds + "Reference")
                      if value is None or not (value.text or "").strip():
                          raise SystemExit(f"{signature_name} has an empty SignatureValue")
                      if not refs or any(
                          ref.find(ds + "DigestValue") is None or
                          not (ref.find(ds + "DigestValue").text or "").strip()
                          for ref in refs
                      ):
                          raise SystemExit(f"{signature_name} has missing reference digests")
          
              manifest = ET.fromstring(package.read("tizen-manifest.xml"))
              service_app = next((node for node in manifest.iter()
                                  if node.tag.endswith("service-application")), None)
              if manifest.get("api-version") != "5.5":
                  raise SystemExit("Final hybrid package minimum must remain Tizen 5.5")
              if service_app is None or service_app.get("api-version") != "13":
                  raise SystemExit("Final hybrid package changed the embedded service API 13 target")
          
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in final hybrid WGT: {name}")
          
              for item in source_path.rglob("*"):
                  if item.is_file():
                      member = "res/wgt/" + item.relative_to(source_path).as_posix()
                      if member not in names or package.read(member) != item.read_bytes():
                          raise SystemExit("Moonlight Web payload changed or missing after signing: " + member)
          
              config = ET.fromstring(package.read("res/wgt/config.xml"))
              splash = next((node for node in config.iter()
                             if node.tag.endswith("video_splash_screen")), None)
              if splash is None or splash.get("ready_when") != "custom":
                  raise SystemExit("Moonlight video splash declaration was not preserved")
          
              print("Final signed hybrid WGT verified:")
              print("  Embedded service TPK:", tpks)
              print("  Author and distributor XML signatures are present and structurally valid.")
              print("  Moonlight Web payload, manifest and video splash are preserved.")
          PY
          }
          
          package_hybrid "$RUNNER_TEMP/web-standard" MoonlightWeb "$RUNNER_TEMP/MoonlightWeb-base.wgt" "$RUNNER_TEMP/Moonlight.wgt"
          package_hybrid "$RUNNER_TEMP/web-forcegm" MoonlightForceGM "$RUNNER_TEMP/MoonlightForceGM-base.wgt" "$RUNNER_TEMP/Moonlight-ForceGM.wgt"
          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$RUNNER_TEMP/Moonlight.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight.wgt"
          cp "$RUNNER_TEMP/Moonlight-ForceGM.wgt" "$RUNNER_TEMP/hybrid-output/Moonlight-ForceGM.wgt"
          (cd "$RUNNER_TEMP/hybrid-output" && sha256sum Moonlight.wgt Moonlight-ForceGM.wgt > SHA256SUMS)
          
          
          PACKAGE

      - name: Show packaging diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
      - name: Upload Tizen XMLDSig diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Hybrid-XMLDSig-Diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-signature-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload standard hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight.wgt
          if-no-files-found: error
          retention-days: 14

      - name: Upload ForceGM hybrid WGT for Apps2Samsung
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-ForceGM-${{ github.sha }}
          path: ${{ runner.temp }}/hybrid-output/Moonlight-ForceGM.wgt
          if-no-files-found: error
          retention-days: 14
