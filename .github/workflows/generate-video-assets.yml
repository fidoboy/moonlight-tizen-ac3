name: Generate video assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate splash MP4 assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install video-generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg librsvg2-bin fonts-dejavu-core python3

      - name: Generate and validate videos
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-build-videos.sh generated-videos
          mkdir -p dist
          (
            cd generated-videos
            zip -9 "$GITHUB_WORKSPACE/dist/moonlight-generated-videos-v1.zip" \
              launch-screen.mp4 \
              launch-screen-portrait.mp4
          )
          unzip -l dist/moonlight-generated-videos-v1.zip

      - name: Publish ZIP to the build-assets branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: build-assets
          folder: dist
          clean: true
          single-commit: true
