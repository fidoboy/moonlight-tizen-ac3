name: Release (Development Pre-release)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.ref != 'refs/heads/master'
    name: Build and publish a development pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Ensure required versioned MP4 assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          ASSET_URL="https://raw.githubusercontent.com/fidoboy/moonlight-tizen-ac3/build-assets/$ASSET_FILE"
          ASSET_PATH="$RUNNER_TEMP/video-assets/$ASSET_FILE"
          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"

          download_asset() {
            local status
            status="$(curl --silent --show-error --location --output "$ASSET_PATH" --write-out '%{http_code}' "$ASSET_URL")"
            printf '%s' "$status"
          }

          status="$(download_asset)"
          if [[ "$status" == "404" ]]; then
            echo "Video asset ZIP not found on build-assets; starting the asset-generation workflow."
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets/dispatch-response.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' \
              "$API_URL")"
            if [[ "$dispatch_status" != "204" ]]; then
              echo "::error::Could not start Generate video assets (HTTP $dispatch_status). The workflow token needs Actions write permission." >&2
              cat "$RUNNER_TEMP/video-assets/dispatch-response.json" >&2
              exit 1
            fi

            # Wait for the ZIP to be published. Do not regenerate if the ZIP already exists.
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(download_asset)"
              if [[ "$status" == "200" ]]; then
                break
              fi
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for the generated video asset ZIP." >&2
                exit 1
              fi
            done
            if [[ "$status" != "200" ]]; then
              echo "::error::The video asset ZIP was not published within 20 minutes. Check the Generate video assets workflow run." >&2
              exit 1
            fi
          elif [[ "$status" != "200" ]]; then
            echo "::error::Could not download the video asset ZIP (HTTP $status)." >&2
            exit 1
          fi

          # A present but invalid ZIP is an error; generation is only triggered when the ZIP is missing.
          if ! unzip -tq "$ASSET_PATH" >/dev/null; then
            echo "::error::The video asset ZIP exists but is invalid; refusing to regenerate it automatically." >&2
            exit 1
          fi
          unzip -oq "$ASSET_PATH" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty in the existing ZIP." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Generate development version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          TIMESTAMP="$(date -u +'%Y%m%d%H%M')"
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="v${VERSION}-dev.${TIMESTAMP}.${BRANCH_SAFE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-dev:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-dev:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt

      - name: Build ForceGM WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-dev:forcegm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract ForceGM WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-dev:forcegm)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight-ForceGM.wgt

      - name: Publish public GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support ${{ steps.version.outputs.tag }}
          prerelease: true
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
          body: |
            Development pre-release from branch ${{ github.ref_name }} at commit ${{ github.sha }}.

            This package is intended for testing, not as a stable release. It uses the project's independent version series and a prerelease tag based on the current base version.

            Dolby optical audio requires the compatible [fidoboy/Sunshine ac3-audio branch](https://github.com/fidoboy/Sunshine/tree/ac3-audio). OPUS-only hosts remain supported.

            See the [local Features Overview](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Features-Overview.md) and [Troubleshooting Guide](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Troubleshooting-Guide.md).
