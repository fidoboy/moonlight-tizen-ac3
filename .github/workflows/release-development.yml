name: Release (Development Pre-release)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref != 'refs/heads/master'
    name: Build and publish a development pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download required versioned MP4 assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ASSET_TAG="build-videos-v1"
          ASSET_FILE="moonlight-generated-videos-v1.zip"
          if ! gh release view "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Required video assets are unavailable (release $ASSET_TAG was not found). Run the 'Generate Versioned Video Assets' workflow first." >&2
            exit 1
          fi
          mkdir -p generated-videos "$RUNNER_TEMP/video-assets"
          if ! gh release download "$ASSET_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_FILE" --dir "$RUNNER_TEMP/video-assets"; then
            echo "::error::Required video asset $ASSET_FILE could not be downloaded from release $ASSET_TAG. Rebuild the assets by running the 'Generate Versioned Video Assets' workflow." >&2
            exit 1
          fi
          if ! unzip -tq "$RUNNER_TEMP/video-assets/$ASSET_FILE" >/dev/null; then
            echo "::error::The versioned video asset archive is invalid. Rebuild it with the 'Generate Versioned Video Assets' workflow." >&2
            exit 1
          fi
          unzip -oq "$RUNNER_TEMP/video-assets/$ASSET_FILE" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4 stream-transition-background.mp4; do
            if [[ ! -s "generated-videos/$video" ]]; then
              echo "::error::Required video generated-videos/$video is missing or empty. Rebuild the versioned assets using the 'Generate Versioned Video Assets' workflow." >&2
              exit 1
            fi
          done
          echo "Installed all versioned MP4 assets into generated-videos/."

      - name: Generate development version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          TIMESTAMP="$(date -u +'%Y%m%d%H%M')"
          BRANCH_SAFE="${GITHUB_REF_NAME//\//-}"
          TAG="v${VERSION}-dev.${TIMESTAMP}.${BRANCH_SAFE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-dev:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-dev:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt

      - name: Build ForceGM WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-dev:forcegm
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=development
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=true

      - name: Extract ForceGM WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-dev:forcegm)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight-ForceGM.wgt" dist/Moonlight-ForceGM.wgt
          test -s dist/Moonlight-ForceGM.wgt

      - name: Publish public GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moonlight Tizen with AC-3 support ${{ steps.version.outputs.tag }}
          prerelease: true
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/Moonlight.wgt
            dist/Moonlight-ForceGM.wgt
          body: |
            Development pre-release from branch ${{ github.ref_name }} at commit ${{ github.sha }}.

            This package is intended for testing, not as a stable release. It uses the project's independent version series and a prerelease tag based on the current base version.

            Dolby optical audio requires the compatible [fidoboy/Sunshine ac3-audio branch](https://github.com/fidoboy/Sunshine/tree/ac3-audio). OPUS-only hosts remain supported.

            See the [local Features Overview](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Features-Overview.md) and [Troubleshooting Guide](https://github.com/fidoboy/moonlight-tizen-ac3/blob/master/docs/Troubleshooting-Guide.md).
