name: Check upstream dependencies

on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check vendored dependency sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare upstream references
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const manifest = JSON.parse(
              fs.readFileSync('.github/dependency-baselines.json', 'utf8')
            );
            const updates = [];

            for (const dep of manifest.dependencies) {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: dep.owner,
                repo: dep.repo,
                branch: dep.branch
              });
              const latestSha = branch.commit.sha;

              if (latestSha === dep.baseline_sha) {
                continue;
              }

              const compareUrl =
                `https://github.com/${dep.owner}/${dep.repo}/compare/${dep.baseline_sha}...${latestSha}`;

              let aheadBy = null;
              let comparisonStatus = 'comparison unavailable';
              try {
                const { data: comparison } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner: dep.owner,
                    repo: dep.repo,
                    basehead: `${dep.baseline_sha}...${latestSha}`
                  });
                aheadBy = comparison.ahead_by;
                comparisonStatus = comparison.status;

                if (comparison.status === 'identical') {
                  continue;
                }
              } catch (error) {
                core.warning(
                  `Could not compare ${dep.owner}/${dep.repo}: ${error.message}`
                );
              }

              updates.push({
                dep,
                latestSha,
                latestMessage: branch.commit.commit.message.split('\n')[0],
                latestDate: branch.commit.commit.committer.date,
                compareUrl,
                aheadBy,
                comparisonStatus
              });
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream dependency updates available';
            const marker = '<!-- upstream-dependency-check -->';

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const issue = openIssues.find(
              item => !item.pull_request &&
                item.title === title &&
                (item.body || '').includes(marker)
            );

            if (updates.length === 0) {
              core.info('No upstream commits newer than the recorded dependency baselines.');
              if (issue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                  body: `${marker}\nAll monitored upstream references match the recorded baselines. No pending upstream changes were detected by this run.`
                });
                core.info(`Closed resolved dependency alert #${issue.number}.`);
              }
              return;
            }

            const lines = updates.map(({ dep, latestSha, latestMessage, latestDate, compareUrl, aheadBy, comparisonStatus }) => {
              const count = Number.isInteger(aheadBy) ? String(aheadBy) : 'could not determine';
              return [
                `### ${dep.name}`,
                `- Upstream: [${dep.owner}/${dep.repo}](https://github.com/${dep.owner}/${dep.repo}) (${dep.branch})`,
                `- Recorded reference: \`${dep.baseline_sha}\` (${dep.baseline_label})`,
                `- Current upstream HEAD: [\`${latestSha.slice(0, 12)}\`](https://github.com/${dep.owner}/${dep.repo}/commit/${latestSha})`,
                `- Latest commit date: ${latestDate}`,
                `- Latest commit: ${latestMessage}`,
                `- Commits ahead of reference: ${count}; comparison status: ${comparisonStatus}`,
                `- [Review upstream changes](${compareUrl})`,
                `- Maintainer note: ${dep.note}`
              ].join('\n');
            });

            const body = [
              marker,
              'The scheduled dependency monitor found upstream commits newer than the references recorded in `.github/dependency-baselines.json`.',
              '',
              '**This is a review reminder only. No source code or WGT artifacts were changed or built.** Review the comparisons, selectively integrate relevant changes, and update a baseline only after that review.',
              '',
              ...lines,
              '',
              '_This issue is updated on subsequent runs to avoid opening duplicate dependency alerts._'
            ].join('\n');

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
              core.info(`Updated dependency alert #${issue.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created dependency alert #${created.data.number}.`);
            }
