on:
  schedule:
    - cron: '30 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    name: Check vendored dependency sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare upstream references
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const manifest = JSON.parse(
              fs.readFileSync('.github/dependency-baselines.json', 'utf8')
            );
            const updates = [];


                );
                const stableTags = refs
                  .map(item => {
                    const match = item.ref.match(stableTagPattern);
                    return match ? {
                      ref: item.ref,
                      name: item.ref.replace('refs/tags/', ''),
                      version: match.slice(1).map(Number)
                    } : null;
                  })
                  .filter(Boolean)
                  .sort((a, b) =>
                    b.version[0] - a.version[0] ||
                    b.version[1] - a.version[1] ||
                    b.version[2] - a.version[2]
                  );

                if (stableTags.length === 0) {
                  core.warning(`No stable version tags found for ${dep.owner}/${dep.repo}`);
                  continue;
                }

                upstreamRef = stableTags[0].name;
                const { data: commit } = await github.rest.repos.getCommit({
                  owner: dep.owner,
                  repo: dep.repo,
                  ref: upstreamRef
                });
                latestCommit = commit;
              } else if (dep.path) {
                // Monitor only the vendored subdirectory when a dependency is part of
                // a larger upstream repository, avoiding unrelated repository changes.
                const { data: commits } = await github.rest.repos.listCommits({
                  owner: dep.owner,
                  repo: dep.repo,
                  path: dep.path,
                  per_page: 1
                });
                if (commits.length === 0) {
                  core.warning(`No upstream commits found for ${dep.owner}/${dep.repo}/${dep.path}`);
                  continue;
                }
                latestCommit = commits[0];
                upstreamRef = dep.branch;
              } else {
                const { data: branch } = await github.rest.repos.getBranch({
                  owner: dep.owner,
                  repo: dep.repo,
                  branch: dep.branch
                });
                latestCommit = branch.commit;
                upstreamRef = dep.branch;
              }

              const latestSha = latestCommit.sha;

              if (latestSha === dep.baseline_sha) {
                continue;
              }

              const compareUrl =
                `https://github.com/${dep.owner}/${dep.repo}/compare/${dep.baseline_sha}...${latestSha}`;

              let aheadBy = null;
              let comparisonStatus = 'comparison unavailable';
              try {
                const { data: comparison } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner: dep.owner,
                    repo: dep.repo,
                    basehead: `${dep.baseline_sha}...${latestSha}`
                  });
                aheadBy = comparison.ahead_by;
                comparisonStatus = comparison.status;

                if (comparison.status === 'identical') {
                  continue;
                }
              } catch (error) {
                core.warning(
                  `Could not compare ${dep.owner}/${dep.repo}: ${error.message}`
                );
              }

              updates.push({
                dep,
                upstreamRef,
                latestSha,
                latestMessage: latestCommit.commit.message.split('\n')[0],
                latestDate: latestCommit.commit.committer.date,
                compareUrl,
                aheadBy,
                comparisonStatus
              });
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Upstream dependency updates available';
            const marker = '<!-- upstream-dependency-check -->';

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const issue = openIssues.find(
              item => !item.pull_request &&
                item.title === title &&
                (item.body || '').includes(marker)
            );

            if (updates.length === 0) {
              core.info('No upstream commits newer than the recorded dependency baselines.');
              if (issue) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                  body: `${marker}\nAll monitored upstream references match the recorded baselines. No pending upstream changes were detected by this run.`
                });
                core.info(`Closed resolved dependency alert #${issue.number}.`);
              }
              return;
            }

            const lines = updates.map(({ dep, upstreamRef, latestSha, latestMessage, latestDate, compareUrl, aheadBy, comparisonStatus }) => {
              const count = Number.isInteger(aheadBy) ? String(aheadBy) : 'could not determine';
              return [
                `### ${dep.name}`,
                `- Upstream: [${dep.owner}/${dep.repo}](https://github.com/${dep.owner}/${dep.repo}) (${upstreamRef})`,
                `- Recorded reference: \`${dep.baseline_sha}\` (${dep.baseline_label})`,
                `- Current upstream HEAD: [\`${latestSha.slice(0, 12)}\`](https://github.com/${dep.owner}/${dep.repo}/commit/${latestSha})`,
                `- Latest commit date: ${latestDate}`,
                `- Latest commit: ${latestMessage}`,
                `- Commits ahead of reference: ${count}; comparison status: ${comparisonStatus}`,
                `- [Review upstream changes](${compareUrl})`,
                `- Maintainer note: ${dep.note}`
              ].join('\n');
            });

            const body = [
              marker,
              'The scheduled dependency monitor found upstream commits newer than the references recorded in \`.github/dependency-baselines.json\`.',
              '',
              '**This is a review reminder only. No source code or WGT artifacts were changed or built. Do not merge or replace vendored directories wholesale.**',
              '',
              '## Required review procedure',
              '1. Inspect the upstream comparison and identify which changed files are actually present in the vendored subset used by this app.',
              '2. Review commits and file diffs individually. Port relevant fixes selectively; do not assume upstream changes can be applied unchanged to the Tizen fork.',
              '3. Preserve local Tizen, audio, networking, and build adaptations. Check the resulting diff for accidental deletion or overwrite of local changes.',
              '4. Run the relevant build and tests, including TV/audio checks where applicable, before updating the recorded baseline.',
              '5. Update \`.github/dependency-baselines.json\` only after review and integration decisions are complete. The alert itself does not mean the dependency should be synchronized automatically.',
              '',
              '## Dependency-specific handling',
              'The maintainer note under each dependency below is intentional guidance. Follow it before making changes; dependencies have different risk levels and must not all be handled with the same merge strategy.',
              '',
              ...lines,
              '',
              '_This issue is updated on subsequent runs to avoid opening duplicate dependency alerts._'
            ].join('\n');

            if (issue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body
              });
              core.info(`Updated dependency alert #${issue.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
              core.info(`Created dependency alert #${created.data.number}.`);
            }
