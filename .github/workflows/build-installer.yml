name: Build Moonlight Tizen Installer

on:
  push:
    paths:
      - "Installer/**"
      - ".github/workflows/build-installer.yml"
      - "scripts/check-installer-localization.py"
  pull_request:
    paths:
      - "Installer/**"
      - ".github/workflows/build-installer.yml"
      - "scripts/check-installer-localization.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    name: Validate installer translations
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate localization keys and translations
        run: python3 scripts/check-installer-localization.py

  build:
    needs: localization
    name: Build installer (${{ matrix.rid }})
    runs-on: ${{ matrix.rid == 'win-x64' && 'windows-latest' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - linux-x64
          - osx-x64
          - osx-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Moonlight package for embedding
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"
          wgt_url="$(printf '%s' "$release_json" | jq -er '.assets[] | select(.name == "Moonlight.wgt") | .browser_download_url' | head -n 1)"
          test -n "$wgt_url"
          curl --fail --silent --show-error --location --retry 3 "$wgt_url" \
            --output Installer/src/MoonlightTizenInstaller/Moonlight.wgt
          test -s Installer/src/MoonlightTizenInstaller/Moonlight.wgt
          unzip -tq Installer/src/MoonlightTizenInstaller/Moonlight.wgt

      - name: Restore
        run: dotnet restore Installer/src/MoonlightTizenInstaller/MoonlightTizenInstaller.csproj --runtime ${{ matrix.rid }}

      - name: Publish self-contained single-file executable
        run: dotnet publish Installer/src/MoonlightTizenInstaller/MoonlightTizenInstaller.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore --output artifacts/publish

      - name: Smoke-test Windows application startup
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/publish/MoonlightTizenInstaller.exe"
          $process = Start-Process -FilePath $executable -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "MoonlightTizenInstaller.exe exited during the startup smoke test (exit code $($process.ExitCode))."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Prepare single-file distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dist
          executable="MoonlightTizenInstaller"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            executable="MoonlightTizenInstaller.exe"
          else
            chmod +x "artifacts/publish/$executable"
          fi
          test -s "artifacts/publish/$executable"
          cp "artifacts/publish/$executable" "artifacts/dist/$executable"
          test "$(find artifacts/dist -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload single executable
        uses: actions/upload-artifact@v6
        with:
          name: MoonlightTizenInstaller-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error
          retention-days: 30
