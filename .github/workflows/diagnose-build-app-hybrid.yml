name: Diagnose Tizen build-app hybrid support

on:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "ambilight-service/**"
      - ".github/workflows/diagnose-build-app-hybrid.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-app-hybrid-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/1.2.4-pre'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      image: ghcr.io/fidoboy/moonlight-tizen-build-env:6.1-v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Configure shared Tizen build environment
        shell: bash
        run: |
          set -euo pipefail
          sdk="${TIZEN_STUDIO:?TIZEN_STUDIO must be set by the shared build image}"
          test -x "$sdk/tools/ide/bin/tizen"
          test -x "$sdk/tools/tizen-core/tz"
          dotnet --list-sdks | grep -E '^8\.'
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          runuser -u tizen -- env HOME=/home/tizen TIZEN_STUDIO_DATA_PATH=/tmp/tizen-studio-data \
            "$pm" show-pkgs --tree 2>&1 | tee "$RUNNER_TEMP/tizen-installed-package-catalog.txt"
          required_packages=(
            NativeCLI
            TIZEN-9.0-WebAppDevelopment-CLI
            TIZEN-10.0
            TV-SAMSUNG-Public
            TV-SAMSUNG-Public-WebAppDevelopment
            TV-SAMSUNG-Extension-Tools
            TV-SAMSUNG-Extension-Resources
          )
          for package in "${required_packages[@]}"; do
            awk -v package="$package" '$1 == "i" && $2 == package { found=1 } END { exit !found }' \
              "$RUNNER_TEMP/tizen-installed-package-catalog.txt" || {
                echo "Required Tizen package missing from shared image: $package"
                exit 1
              }
          done
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$sdk/tools/tizen-core/tz" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=/home/tizen/tizen-studio-data" >> "$GITHUB_ENV"
          echo "Shared Tizen build environment verified."

      - name: Inspect Tizen Core CLI templates and profile support
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/build-app-diagnostics"
          mkdir -p "$out"
          {
            echo "=== Tizen Core CLI version ==="
            tz --version
            echo
            echo "=== Tizen Core CLI root help ==="
            tz --help
            echo
            echo "=== Template listing help ==="
            tz list templates --help
            echo
            echo "=== Available .NET templates ==="
            tz list templates -t dotnet
            echo
            echo "=== Available Web templates ==="
            tz list templates -t web
            echo
            echo "=== Available profiles (if supported) ==="
            tz list profiles
            echo
            echo "=== Installed Tizen Core templates ==="
            find "$TIZEN_STUDIO/tools/tizen-core" -maxdepth 5 -type f \( -name 'template.yaml' -o -name 'tizen_dotnet_project.yaml' \) -print 2>/dev/null | sort
          } 2>&1 | tee "$out/tizen-core-cli-discovery.txt"
          echo "${PIPESTATUS[0]}" > "$out/tizen-core-cli-discovery-exit-code.txt"

      - name: Capture Tizen Core command syntax and template definitions
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/build-app-diagnostics"
          mkdir -p "$out"
          {
            for command in new add-deps build pack; do
              echo "=== tz $command --help ==="
              tz "$command" --help
              echo
            done
            echo "=== tz security-profiles list --help ==="
            tz security-profiles list --help
            echo
            echo "=== tz list rootstraps ==="
            tz list rootstraps
            echo
            echo "=== Installed template descriptor paths ==="
            find "$TIZEN_STUDIO/tools/tizen-core/templates" -type f \( -name 'template.yaml' -o -name 'tizen_dotnet_project.yaml' \) -print 2>/dev/null | sort
            echo
            echo "=== TizenServiceApp template definitions ==="
            service_template="$(find "$TIZEN_STUDIO/tools/tizen-core/templates/dotnet" -path '*/TizenServiceApp/template.yaml' -print -quit 2>/dev/null)"
            if [[ -n "$service_template" ]]; then
              cat "$service_template"
              service_dir="$(dirname "$service_template")"
              echo "=== tizen_dotnet_project.yaml ==="
              cat "$service_dir/tizen_dotnet_project.yaml" 2>/dev/null
            else
              echo "TizenServiceApp template.yaml not found."
            fi
            echo
            echo "=== Basic_Empty Web template definition ==="
            find "$TIZEN_STUDIO/tools/tizen-core/templates" -path '*/Basic_Empty/template.yaml' -print -exec cat {} \; 2>/dev/null
          } 2>&1 | tee "$out/tizen-core-command-syntax-and-templates.txt"
          echo "${PIPESTATUS[0]}" > "$out/tizen-core-command-syntax-exit-code.txt"

      - name: Check build-app availability and save CLI help
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/build-app-diagnostics"
          {
            echo "=== Tizen CLI version ==="
            tizen version
            echo
            echo "=== build-app help ==="
            tizen build-app --help
            echo
            echo "=== detailed build-app help ==="
            tizen build-app -h
            echo
          } 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-help.txt"
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            echo "Tizen CLI does not expose a working build-app command (exit $status)." \
              | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-availability.txt"
            exit "$status"
          fi
          echo "build-app is available." \
            | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-availability.txt"

      - name: Create diagnostic signing profile
        shell: bash
        run: |
          set -euo pipefail
          # Tizen CLI stores certificates under the tizen user's home, regardless
          # of RUNNER_TEMP. Use the actual data directory reported by the CLI.
          data_dir="/home/tizen/tizen-studio-data"
          export TIZEN_STUDIO_DATA_PATH="$data_dir"
          mkdir -p "$data_dir/profile" "$RUNNER_TEMP/build-app-diagnostics"
          author_password="$(printf '\061\062\063\064\065\066')"
          tizen certificate -a Moonlight -f Moonlight -p "$author_password"
          author_key="$data_dir/keystore/author/Moonlight.p12"
          author_pwd="$data_dir/keystore/author/Moonlight.pwd"
          echo "=== Files created by tizen certificate ==="
          find "$data_dir/keystore/author" -maxdepth 1 -type f -printf '%f (%s bytes)\\n' | sort
          test -f "$author_key"

          # Tizen certificate creates the PKCS#12 container, but this CLI
          # does not necessarily persist its password as a .pwd sidecar.
          # Create the exact password-file input expected by Tizen Core.
          printf '%s' "$author_password" > "$author_pwd"
          test -f "$author_pwd"

          echo "=== Author password file: exact bytes and visible contents ==="
          printf 'Expected password: [%s]\n' "$author_password"
          printf 'Actual password:   ['
          cat "$author_pwd"
          printf ']\n'
          printf 'Byte count: '
          wc -c < "$author_pwd"
          printf 'Hex bytes: '
          od -An -v -tx1 "$author_pwd"
          printf '%s' "$author_password" > "$RUNNER_TEMP/expected-Moonlight.pwd"
          cmp "$RUNNER_TEMP/expected-Moonlight.pwd" "$author_pwd"
          echo "Moonlight.pwd matches the expected bytes exactly (no newline)."

          echo "=== OpenSSL verification using the password file itself ==="
          openssl pkcs12 -legacy -in "$author_key" -passin "file:$author_pwd" -info -noout

          tizen security-profiles add -n Moonlight -a "$author_key" -p "$author_password" \
            -- "$data_dir/profile"
          profiles="$data_dir/profile/profiles.xml"
          test -f "$profiles"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"

          author_encrypted='HeifNwdU+kk='
          distributor_encrypted='Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k='
          # security-profiles add writes inline password attributes, so replace
          # those attributes by profile-item distributor index (not .pwd paths).
          sed -i -E '/distributor="0"/ s|password="[^"]*"|password="'$author_encrypted'"|' "$profiles"
          sed -i -E '/distributor="1"/ s|password="[^"]*"|password="'$distributor_encrypted'"|' "$profiles"

          echo "=== Verify the exact profile attributes without printing credentials ==="
          grep -Fq "$author_key" "$profiles"
          grep -Fq "password=\"$author_encrypted\"" "$profiles"
          grep -Fq "password=\"$distributor_encrypted\"" "$profiles"
          if grep -Fq '.pwd' "$profiles"; then
            echo "Unexpected .pwd path remains in the diagnostic signing profile."
            exit 1
          fi
          echo "profiles.xml contains the expected certificate and both encrypted password attributes."

          echo "=== Tizen CLI profile listing using this exact profiles.xml ==="
          tizen cli-config "profiles.path=$profiles"
          echo "=== Signing profile registered ==="
          tizen security-profiles list -n Moonlight
          {
            printf 'profile_name=Moonlight\n'
            printf 'profiles_xml=%s\n' "$profiles"
            printf 'author_key=%s\n' "$author_key"
            printf 'author_password_file=%s\n' "$author_pwd"
            printf 'expected_password=%s\n' "$author_password"
          } | tee "$RUNNER_TEMP/build-app-diagnostics/signing-profile-preflight.txt"

      - name: Test minimal Web plus .NET service hybrid with Tizen Core
        id: tz-hybrid
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/build-app-diagnostics"
          workspace="$RUNNER_TEMP/tz-hybrid-workspace"
          mkdir -p "$workspace" "$out"
          web_project="$workspace/MoonlightWeb"
          service_project="$workspace/AmbilightService"
          internal_logs="$out/tizen-core-internal-logs"
          mkdir -p "$internal_logs"
          marker="$out/tizen-core-diagnostic-start.marker"
          touch "$marker"

          capture_tizen_core_logs() {
            local inventory="$out/tizen-core-internal-log-inventory.txt"
            local candidates="$out/tizen-core-internal-log-candidates.txt"
            : > "$inventory"
            : > "$candidates"
            local roots=()
            for root in "$HOME" /home/tizen "$TIZEN_STUDIO/tools/tizen-core" \
                        "$TIZEN_STUDIO_DATA_PATH" /tmp; do
              [[ -d "$root" ]] && roots+=("$root")
            done
            printf '%s\n' "${roots[@]}" | sort -u > "$out/tizen-core-log-search-roots.txt"

            for root in "${roots[@]}"; do
              find "$root" -type f -newer "$marker" -size -20M -print 2>/dev/null \
                >> "$inventory"
            done
            sort -u -o "$inventory" "$inventory"

            while IFS= read -r file; do
              [[ -f "$file" ]] || continue
              case "$file" in
                *[Ll][Oo][Gg]*|*[Tt][Rr][Aa][Cc][Ee]*|*.log|*.LOG|*.txt|*.json|*.out|*.err)
                  printf '%s\n' "$file" >> "$candidates"
                  ;;
              esac
            done < "$inventory"

            if [[ -s "$candidates" ]]; then
              while IFS= read -r file; do
                [[ -f "$file" ]] || continue
                cp --parents "$file" "$internal_logs/" 2>/dev/null || true
              done < "$candidates"
              tar -czf "$out/tizen-core-internal-logs.tar.gz" \
                --absolute-names --files-from="$candidates" 2>"$out/tizen-core-log-archive-stderr.txt" || true
            fi
            {
              echo "Search roots:"
              cat "$out/tizen-core-log-search-roots.txt"
              echo
              echo "Files modified since diagnostic start:"
              cat "$inventory"
              echo
              echo "Collected log-like files:"
              cat "$candidates"
            } > "$out/tizen-core-internal-log-report.txt"
          }

          run_tz_capture() {
            local label="$1"
            shift
            local stdout_file="$out/${label}-stdout.txt"
            local stderr_file="$out/${label}-stderr.txt"
            local status_file="$out/${label}-exit-code.txt"
            local status

            echo "=== Running Tizen Core command: $* ==="
            timeout --signal=TERM --kill-after=15s 180s "$TIZEN_CORE_CLI" "$@" \
              >"$stdout_file" 2>"$stderr_file"
            status=$?
            printf '%s\n' "$status" > "$status_file"
            echo "Exit code: $status"
            echo "--- stdout ($stdout_file) ---"
            cat "$stdout_file"
            echo "--- stderr ($stderr_file) ---"
            cat "$stderr_file"
            capture_tizen_core_logs
            return "$status"
          }

          echo "=== Create Basic_Empty Web project for tv-samsung-10.0 ==="
          if ! run_tz_capture "tz-new-web" new -t Basic_Empty -n MoonlightWeb -T web \
              -p tv-samsung-10.0 -w "$workspace"; then
            echo "Tizen Core Web project creation failed; see separated command output and internal logs."
            exit 1
          fi
          test -d "$web_project"

          echo "=== Create TizenServiceApp .NET project for tv-samsung-10.0 ==="
          if ! run_tz_capture "tz-new-dotnet-service" new -t TizenServiceApp \
              -n AmbilightService -T dotnet -p tv-samsung-10.0 -w "$workspace"; then
            echo "Tizen Core .NET service project creation failed; see separated stdout, stderr, exit code, and internal logs."
            exit 1
          fi
          # Preserve the complete workspace immediately after tz new. Do not
          # assume that -w creates a child named AmbilightService.
          {
            printf 'Workspace: %s\n' "$workspace"
            find "$workspace" -printf '%y %p\n' | sort
          } | tee "$out/tz-workspace-tree-after-dotnet-new.txt"

          echo "=== Locate the generated .NET service project ==="
          find "$workspace" -type f \
            \( -name '*.csproj' -o -name 'tizen-manifest.xml' -o -name 'template.yaml' -o -name 'tizen_dotnet_project.yaml' \) \
            -printf '%p\n' | sort \
            | tee "$out/tz-dotnet-service-project-descriptors.txt"
          find "$workspace" -type d -printf '%p\n' | sort \
            | tee "$out/tz-workspace-directories-after-dotnet-new.txt"

          echo "=== Capture generated Web and .NET project descriptors ==="
          while IFS= read -r descriptor; do
            [[ -f "$descriptor" ]] || continue
            {
              echo "===== $descriptor ====="
              sed -n '1,260p' "$descriptor"
              echo
            } >> "$out/tz-generated-project-descriptor-contents.txt"
          done < <(find "$workspace" -type f \
            \( -name 'tizen_web_project.yaml' -o -name 'tizen_dotnet_project.yaml' \
               -o -name 'tizen-manifest.xml' -o -name '.project' -o -name '.tproject' \
               -o -name '*.sln' -o -name '*.csproj' \) -print | sort)

          echo "=== Inspect Tizen Core executable and installed implementation files ==="
          {
            echo "CLI: $TIZEN_CORE_CLI"
            readlink -f "$TIZEN_CORE_CLI"
            file "$TIZEN_CORE_CLI"
            sha256sum "$TIZEN_CORE_CLI"
            echo
            echo "=== Tizen Core package files ==="
            find "$(dirname "$TIZEN_CORE_CLI")" -maxdepth 4 -type f -printf '%p\n' | sort
            echo
            echo "=== add-deps / descriptor / project-root strings in CLI ==="
            strings "$TIZEN_CORE_CLI" 2>/dev/null \
              | grep -iE -C 3 'add-deps|tizen_dotnet_project|tizen_web_project|project.?type|dotnet_app|\.csproj|\.sln|manifest|dependency|deps' \
              | head -n 1200 || true
          } > "$out/tizen-core-executable-inspection.txt" 2>&1

          mapfile -t service_csprojs < <(find "$workspace" -type f -name '*.csproj' -print | sort)
          mapfile -t service_manifests < <(find "$workspace" -type f -name 'tizen-manifest.xml' -print | sort)
          {
            echo "Workspace: $workspace"
            echo "C# project files: ${#service_csprojs[@]}"
            printf '%s\n' "${service_csprojs[@]}"
            echo "Tizen manifests: ${#service_manifests[@]}"
            printf '%s\n' "${service_manifests[@]}"
          } | tee "$out/tz-dotnet-service-project-location.txt"

          echo "=== Capture Tizen Core build and workspace rules ==="
          core_root="$(dirname "$TIZEN_CORE_CLI")"
          {
            for relative in \
              build/workspace.gni \
              build/hybrid_pack.gni \
              build/dotnet/project.gni \
              build/dotnet/dotnetbuild.gni \
              templates/build/dotnet_proj_build.gn \
              templates/build/args.gn \
              templates/config/tizen_dotnet_project.yaml \
              templates/dotnet/TizenServiceApp/template.yaml \
              templates/dotnet/TizenServiceApp/tizen_dotnet_project.yaml; do
              file="$core_root/$relative"
              if [[ -f "$file" ]]; then
                echo "===== $relative ====="
                sed -n '1,320p' "$file"
                echo
              fi
            done
          } > "$out/tizen-core-project-resolution-sources.txt"

          echo "=== Inspect installed dotnet-build argument handling and Samsung MSBuild targets ==="
          {
            echo "=== tz dotnet-build build --help ==="
            "$TIZEN_CORE_CLI" dotnet-build build --help 2>&1 || true
            echo
            echo "=== Installed Samsung Tizen SDK packaging target around signing ==="
            packaging_targets="/usr/share/dotnet/packs/Samsung.Tizen.Sdk/10.0.120/targets/Samsung.Tizen.Sdk.Packaging.targets"
            test -f "$packaging_targets"
            nl -ba "$packaging_targets" | sed -n '1,120p;500,575p'
            echo
            echo "=== Relevant properties and signing targets across installed SDK targets ==="
            grep -RniE 'TizenCreateTpkOnBuild|AuthorPass|AuthorPath|_TizenTpkSign|TizenPackageDependsOn|TizenPrepareCertificate' \
              /usr/share/dotnet/packs/Samsung.Tizen.Sdk/10.0.120/targets 2>/dev/null | head -n 500
          } > "$out/installed-dotnet-build-and-packaging-targets.txt" 2>&1

          echo "=== Compile .NET service without creating or signing a TPK ==="
          service_csproj="${service_csprojs[0]:-}"
          if [[ -z "$service_csproj" || ! -f "$service_csproj" ]]; then
            echo "Generated service csproj not found."
            exit 1
          fi
          if dotnet build "$service_csproj" --configuration Debug \
              -p:TizenCreateTpkOnBuild=false \
              >"$out/dotnet-service-compile-only-stdout.txt" \
              2>"$out/dotnet-service-compile-only-stderr.txt"; then
            printf '0\n' > "$out/dotnet-service-compile-only-exit-code.txt"
          else
            status=$?
            printf '%s\n' "$status" > "$out/dotnet-service-compile-only-exit-code.txt"
          fi
          cat "$out/dotnet-service-compile-only-stdout.txt"
          cat "$out/dotnet-service-compile-only-stderr.txt"
          service_dll="$(dirname "$service_csproj")/bin/Debug/net8.0-tizen10.0/$(basename "$service_csproj" .csproj).dll"
          if [[ -f "$service_dll" ]]; then
            echo "Compile-only assembly exists: $service_dll" | tee "$out/dotnet-service-compile-only-artifact.txt"
          else
            echo "Compile-only assembly missing: $service_dll" | tee "$out/dotnet-service-compile-only-artifact.txt"
          fi

          echo "=== Build the standalone Web project before adding the .NET dependency ==="
          if run_tz_capture "tz-build-web-standalone" build -w "$web_project" -s Moonlight; then
            printf '0\n' > "$out/tz-build-web-standalone-assessment.txt"
          else
            status=$?
            printf '%s\n' "$status" > "$out/tz-build-web-standalone-assessment.txt"
          fi

          echo "=== Declare the real .NET project as the Web dependency ==="
          if ! run_tz_capture "tz-add-deps" add-deps "$web_project" -d ../AmbilightService/AmbilightService; then
            exit 1
          fi

          echo "=== Verify the normalized Web dependency descriptor ==="
          sed -n '1,260p' "$web_project/tizen_web_project.yaml" \
            | tee "$out/tz-web-descriptor-after-add-deps.txt"
          grep -Fq '  - ../AmbilightService/AmbilightService' "$web_project/tizen_web_project.yaml"

          echo "=== Build the Web project and its .NET dependency (no packaging) ==="
          if run_tz_capture "tz-build-hybrid" build -w "$web_project" -s Moonlight; then
            build_status=0
          else
            build_status=$?
          fi

          echo "=== Verify the exact signing profile selected by tz build ==="
          author_key="/home/tizen/tizen-studio-data/keystore/author/Moonlight.p12"
          author_pwd="/home/tizen/tizen-studio-data/keystore/author/Moonlight.pwd"
          {
            echo "Requested Tizen Core signing profile: Moonlight"
            echo "Requested profiles.xml: /home/tizen/tizen-studio-data/profile/profiles.xml"
            echo "Expected author certificate: $author_key"
            echo "Expected encrypted author attribute: HeifNwdU+kk="
            echo "Expected encrypted distributor attribute: Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k="
            echo "=== Actual dotnet-build command emitted by tz build ==="
            grep -F -- "--author-key $author_key --author-attr HeifNwdU+kk=" "$out/tz-build-hybrid-stdout.txt"
            grep -F -- "--dist-key" "$out/tz-build-hybrid-stdout.txt" | grep -F -- "--dist-attr Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k="
            echo "=== Actual certificate selected by the Tizen .NET SDK ==="
            grep -F -- "Author cert : $author_key" "$out/tz-build-hybrid-stdout.txt"
          } 2>&1 | tee "$out/tz-build-signing-profile-verification.txt"
          profile_check_status=${PIPESTATUS[0]}
          printf '%s\n' "$profile_check_status" > "$out/tz-build-signing-profile-verification-exit-code.txt"
          if (( profile_check_status != 0 )); then
            echo "tz build did not demonstrably use the expected Moonlight certificate/password paths."
            if (( build_status == 0 )); then build_status=1; fi
          fi

          # Capture the workspace even when tz build fails. RUNNER_TEMP is
          # mounted into the job container at /__w/_temp and uploaded below.
          echo "=== Capture the complete workspace tree after tz build ==="
          {
            printf 'Workspace: %s\n' "$workspace"
            find "$workspace" -printf '%y %p %s bytes\n' | sort
          } | tee "$out/tz-workspace-tree-after-build.txt"

          echo "=== Inventory generated build outputs ==="
          find "$workspace" -type f \
            \( -name '*.dll' -o -name '*.pdb' -o -name '*.deps.json' \
               -o -name '*.runtimeconfig.json' -o -name '*.tpk' -o -name '*.wgt' \
               -o -name '*.ninja' -o -name 'build.ninja' \) \
            -printf '%p %s bytes\n' | sort \
            | tee "$out/tz-build-generated-artifacts.txt"
          find "$workspace" -type d \( -name bin -o -name obj -o -name Build \) \
            -printf '%p\n' | sort \
            | tee "$out/tz-build-output-directories.txt"

          echo "=== Record build-only outcome ==="
          {
            echo "Dependency: ../AmbilightService/AmbilightService"
            echo "tz add-deps exit code: $(cat "$out/tz-add-deps-exit-code.txt")"
            echo "tz build exit code: $build_status"
            echo "tz pack: NOT RUN"
          } | tee "$out/tz-build-only-assessment.txt"

          if (( build_status != 0 )); then
            echo "Tizen Core build failed; tz pack was not invoked."
            exit "$build_status"
          fi
          echo "Tizen Core build-only diagnostic completed. tz pack remains blocked."
          exit 0

      - name: Upload Tizen Core build-only diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tizen-core-build-only-${{ github.sha }}
          path: /__w/_temp/build-app-diagnostics/
          if-no-files-found: warn
          retention-days: 7
