name: Diagnose Tizen build-app hybrid support

on:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - ".github/workflows/diagnose-build-app-hybrid.yml"
      - "ambilight-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-hybrid-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/1.2.4-pre'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Tizen CLI and hybrid build components
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            software-properties-common expect unzip \
            libxcb-icccm4 libkf5itemmodels5 bridge-utils libxcb-shape0 openvpn \
            libkf5kiowidgets5 libxcb-render-util0 libxcb-image0 libsdl1.2debian libv4l-0
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          # The installer already registers Samsung's TV Extension repository.
          # Do not add another repository with the same display name.
          "$pm" extra --list 2>&1 | tee "$RUNNER_TEMP/tizen-extra-repositories.txt"
          grep -Fq "Samsung Tizen TV SDK" "$RUNNER_TEMP/tizen-extra-repositories.txt"

          # Preserve the complete Package Manager output, including failures.
          set +e
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,TV-SAMSUNG-Public,TV-SAMSUNG-Public-WebAppDevelopment,TV-SAMSUNG-Extension-Tools,TV-SAMSUNG-Extension-Resources" \
            2>&1 | tee "$RUNNER_TEMP/tizen-package-install.txt"
          install_status=${PIPESTATUS[0]}
          set -e
          echo "Package Manager install exit code: $install_status" \
            | tee "$RUNNER_TEMP/tizen-package-install-status.txt"

          "$pm" show-pkgs --tree 2>&1 | tee "$RUNNER_TEMP/tizen-installed-package-catalog.txt"
          if (( install_status != 0 )); then
            echo "Package Manager installation failed; see tizen-package-install.txt."
            exit "$install_status"
          fi
          required_tv_packages=(
            TV-SAMSUNG-Public
            TV-SAMSUNG-Public-WebAppDevelopment
            TV-SAMSUNG-Extension-Tools
            TV-SAMSUNG-Extension-Resources
          )
          for package in "${required_tv_packages[@]}"; do
            if ! awk -v package="$package" '$1 == "i" && $2 == package { found=1 } END { exit !found }' \
              "$RUNNER_TEMP/tizen-installed-package-catalog.txt"; then
              echo "Required Samsung TV package is not installed: $package"
              exit 1
            fi
          done

          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"

      - name: Check build-app availability and save CLI help
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/build-app-diagnostics"
          {
            echo "=== Tizen CLI version ==="
            tizen version
            echo
            echo "=== build-app help ==="
            tizen build-app --help
          } 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-help.txt"
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            echo "Tizen CLI does not expose a working build-app command (exit $status)." \
              | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-availability.txt"
            exit "$status"
          fi
          echo "build-app is available." \
            | tee "$RUNNER_TEMP/build-app-diagnostics/build-app-availability.txt"

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create diagnostic signing profile
        shell: bash
        run: |
          set -euo pipefail
          export TIZEN_STUDIO_DATA_PATH="$RUNNER_TEMP/tizen-studio-data"
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile"
          tizen certificate -a Moonlight -f Moonlight -p 123456
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.p12"
          openssl pkcs12 -legacy -in "$author_key" -passin pass:123456 -info -noout
          tizen security-profiles add -n Moonlight -a "$author_key" -p 123456 \
            -- "$TIZEN_STUDIO_DATA_PATH/profile"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/Moonlight.pwd||" "$profiles"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd|tizenpkcs12passfordsigner|" "$profiles"
          tizen cli-config "default.profiles.path=$profiles"
          echo "=== Signing profile registered ==="
          tizen security-profiles list

      - name: Compile the existing .NET service TPK
        shell: bash
        run: |
          set -euo pipefail
          find ambilight-service -type f -name '*.tpk' -delete
          dotnet msbuild ambilight-service/TizenAmbilight.csproj \
            -restore -t:Rebuild -p:Configuration=Release -v:m
          mapfile -t pkgs < <(find ambilight-service -type f -name '*.tpk' -not -path '*/obj/*' | sort)
          if (( ${#pkgs[@]} != 1 )); then
            echo "Expected one service TPK, found ${#pkgs[@]}."
            printf '%s\n' "${pkgs[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/build-app-diagnostics"
          cp "${pkgs[0]}" "$RUNNER_TEMP/build-app-diagnostics/MoonlightAmbilight-prebuilt.tpk"
          echo "SERVICE_TPK=${pkgs[0]}" >> "$GITHUB_ENV"
          unzip -tq "${pkgs[0]}"
          unzip -p "${pkgs[0]}" tizen-manifest.xml \
            > "$RUNNER_TEMP/build-app-diagnostics/service-tizen-manifest.xml"

      - name: Create a minimal Web project and inspect available rootstraps
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/build-app-workspace"
          mkdir -p "$workspace"
          tizen list web-project 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/web-project-templates.txt"
          tizen list rootstrap 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/rootstraps.txt"
          if ! grep -Eqi 'tizen-10\.0-(device|emulator)' "$RUNNER_TEMP/build-app-diagnostics/rootstraps.txt"; then
            echo "No Tizen 10.0 device/emulator rootstrap is installed; refusing to create the TV project."
            exit 1
          fi
          if ! grep -Eqi 'tv-10\.0|TV.*10\.0|10\.0.*TV' "$RUNNER_TEMP/build-app-diagnostics/web-project-templates.txt"; then
            echo "The TV 10.0 Web profile is not available; refusing to create the TV project."
            exit 1
          fi
          tizen create web-project -p tv-10.0 -t Basic -n MoonlightWeb -- "$workspace"
          test -d "$workspace/MoonlightWeb"
          echo "BUILD_APP_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "WEB_PROJECT=$workspace/MoonlightWeb" >> "$GITHUB_ENV"

      - name: Test whether build-app accepts the prebuilt service TPK
        id: prebuilt
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          workspace="$BUILD_APP_WORKSPACE"
          service_tpk="$RUNNER_TEMP/build-app-diagnostics/MoonlightAmbilight-prebuilt.tpk"
          {
            echo "=== build-app with Web project plus prebuilt .tpk as package targets ==="
            tizen build-app \
              -p "name:MoonlightHybridPrebuilt,type:.wgt,targets:[MoonlightWeb,$service_tpk]" \
              -s Moonlight -- "$workspace"
          } 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/prebuilt-tpk-attempt.txt"
          status=${PIPESTATUS[0]}
          echo "Prebuilt TPK target attempt exit code: $status"
          exit 0

      - name: Test whether build-app requires the .NET source project
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          workspace="$BUILD_APP_WORKSPACE"
          {
            echo "=== build-app with Web project plus .NET project directory ==="
            tizen build-app \
              -p "name:MoonlightHybridSource,type:.wgt,targets:[MoonlightWeb,ambilight-service]" \
              -s Moonlight -- "$GITHUB_WORKSPACE"
          } 2>&1 | tee "$RUNNER_TEMP/build-app-diagnostics/dotnet-source-attempt.txt"
          status=${PIPESTATUS[0]}
          echo "Source project target attempt exit code: $status"
          exit 0

      - name: Inspect any produced hybrid package
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/build-app-diagnostics/produced"
          find "$RUNNER_TEMP/build-app-workspace" "$GITHUB_WORKSPACE/ambilight-service" \
            -type f \( -name '*.wgt' -o -name '*.tpk' \) -print -exec cp -n {} \
            "$RUNNER_TEMP/build-app-diagnostics/produced/" \; 2>&1 \
            | tee "$RUNNER_TEMP/build-app-diagnostics/produced-packages.txt"
          for pkg in "$RUNNER_TEMP/build-app-diagnostics/produced/"*.wgt; do
            [ -f "$pkg" ] || continue
            echo "=== ZIP validation: $pkg ==="
            unzip -t "$pkg" 2>&1 | tee -a "$RUNNER_TEMP/build-app-diagnostics/package-validation.txt"
            echo "=== Entries: $pkg ==="
            unzip -l "$pkg" 2>&1 | tee -a "$RUNNER_TEMP/build-app-diagnostics/package-validation.txt"
          done

      - name: Upload build-app diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tizen-build-app-hybrid-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/build-app-diagnostics/
          if-no-files-found: warn
          retention-days: 7
