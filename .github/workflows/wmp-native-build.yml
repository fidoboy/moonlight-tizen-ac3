name: WMP native ARM build

on:
  workflow_call: {}
  workflow_dispatch:
    inputs:

permissions:
  contents: read

concurrency:
  group: wmp-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Cross-build Tizen ARM engine and ServiceApp
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out wmp_mode and submodules
        uses: actions/checkout@v4
        with:
          ref: wmp_mode
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git unzip libarchive-tools file binutils \
            autoconf automake libtool ca-certificates python3

      - name: Prepare workspace paths
        shell: bash
        run: |
          echo "MLT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "DEPS=$GITHUB_WORKSPACE/tizen-deps" >> "$GITHUB_ENV"
          echo "BPD=$GITHUB_WORKSPACE/backport-deps" >> "$GITHUB_ENV"
          echo "DEPSBUILD=$GITHUB_WORKSPACE/deps-build" >> "$GITHUB_ENV"
          echo "ENGINE_OUT=$GITHUB_WORKSPACE/engine-build" >> "$GITHUB_ENV"

      - name: Cache Tizen 5.5 ARM sysroot and toolchain
        uses: actions/cache@v4
        with:
          path: tizen-deps
          key: ${{ runner.os }}-tizen55-sysroot-${{ hashFiles('wmp/upstream/build/fetch-tizen-sources.sh') }}-v1

      - name: Cache OpenSSL and cURL source trees
        uses: actions/cache@v4
        with:
          path: |
            backport-deps/openssl111
            backport-deps/curl759
          key: ${{ runner.os }}-wmp-backport-sources-${{ hashFiles('wmp/upstream/build/fetch-backport-deps.sh') }}-v1

      - name: Fetch Tizen 5.5 ARM toolchain and sysroot
        shell: bash
        run: |
          bash wmp/upstream/build/fetch-tizen-sources.sh "$DEPS"

      - name: Upload Tizen DLog package diagnostics
        if: always() && hashFiles('tizen-deps/dlog-package-audit.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tizen-dlog-package-audit-${{ github.sha }}
          path: |
            tizen-deps/dlog-package-audit.txt
            tizen-deps/message-port-package-audit.txt
            tizen-deps/runtime-package-audit.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Normalize cross-toolchain executable paths
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$DEPS/toolchain"
          gcc="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-gcc' -perm -u+x -print -quit)"
          objdump="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-objdump' -perm -u+x -print -quit)"
          ar="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-ar' -perm -u+x -print -quit)"
          ranlib="$(find "$tool_root" -type f -name 'arm-linux-gnueabi-ranlib' -perm -u+x -print -quit)"
          if [[ -z "$gcc" || -z "$objdump" || -z "$ar" || -z "$ranlib" ]]; then
            echo "::error::The downloaded Tizen archive does not contain the expected ARM GCC/binutils executables."
            find "$tool_root" -maxdepth 7 -type f | head -200
            exit 1
          fi
          expected="$tool_root/data/tools/arm-linux-gnueabi-gcc-6.2/bin"
          mkdir -p "$expected"
          link_tool() {
            local source="$1" name="$2" target="$expected/$2"
            # The SDK archive may already place an executable at its canonical path.
            # Do not ask ln to replace a file with a link to itself.
            if [[ "$(realpath "$source")" != "$(realpath -m "$target")" ]]; then
              ln -sfn "$source" "$target"
            fi
          }
          link_tool "$gcc" arm-linux-gnueabi-gcc
          link_tool "$objdump" arm-linux-gnueabi-objdump
          link_tool "$ar" arm-linux-gnueabi-ar
          link_tool "$ranlib" arm-linux-gnueabi-ranlib
          "$expected/arm-linux-gnueabi-gcc" --version
          "$expected/arm-linux-gnueabi-objdump" --version | head -1

      - name: Fetch backport source dependencies
        run: bash wmp/upstream/build/fetch-backport-deps.sh

      - name: Build Moonlight core, GameStream and crypto dependencies
        run: bash wmp/upstream/build/build-deps-lib.sh

      - name: Build libmlengine.so
        env:
          BUILD_VARIANT: release
        run: bash wmp/upstream/mlclient/build-engine-so.sh

      - name: Link native WMP ServiceApp
        run: bash wmp/service/build-wmp-service.sh

      - name: Verify final ARM ELF files and runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-report
          readelf -h "$ENGINE_OUT/libmlengine.so" > build-report/libmlengine-elf-header.txt
          readelf -d "$ENGINE_OUT/libmlengine.so" > build-report/libmlengine-dynamic.txt
          readelf -h wmp/build/service/bin/wmp-service > build-report/wmp-service-elf-header.txt
          readelf -d wmp/build/service/bin/wmp-service > build-report/wmp-service-dynamic.txt
          file "$ENGINE_OUT/libmlengine.so" wmp/build/service/bin/wmp-service | tee build-report/file.txt
          grep -q 'Machine:.*ARM' build-report/libmlengine-elf-header.txt
          grep -q 'Machine:.*ARM' build-report/wmp-service-elf-header.txt
          grep -q 'Shared library: \[libmlengine.so\]' build-report/wmp-service-dynamic.txt
          grep -Eq 'Library (runpath|rpath): \[\$ORIGIN/../lib\]' build-report/wmp-service-dynamic.txt
          if grep -q 'NEEDED.*libesplusplayer' build-report/libmlengine-dynamic.txt; then
            echo "::error::libmlengine.so must load ESPlus from TV firmware, not DT_NEEDED."
            exit 1
          fi
          if grep -Eq 'NEEDED.*lib(ssl|crypto|curl)\.so' build-report/libmlengine-dynamic.txt; then
            echo "::error::libmlengine.so must use its private static OpenSSL/cURL stack, not firmware crypto/network SONAMEs."
            exit 1
          fi
          echo "Both outputs are ARM ELF files; WMP crypto/cURL are statically embedded, ServiceApp links libmlengine.so with the expected relative RUNPATH, and ESPlus is runtime-loaded."

      - name: Audit recursive target ELF dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Transitive dependencies of Tizen framework RPMs; supplied by firmware, not bundled.
          # These transitive framework dependencies are provided by Tizen firmware,
          # not bundled with the ServiceApp. Any other missing SONAME remains fatal.
          python3 wmp/upstream/build/audit-elf-dependencies.py \
            --readelf readelf \
            --output build-report/elf-dependencies.txt \
            --root "$ENGINE_OUT/libmlengine.so" \
            --root wmp/build/service/bin/wmp-service \
            --search-dir "$DEPS/sysroot/lib" \
            --search-dir "$DEPS/sysroot/usr/lib" \
            --search-dir "$DEPS/sysroot/usr/lib64" \
            --search-dir "$DEPS/tv-libs/lib" \
            --search-dir "$DEPS/tv-libs/usr/lib" \
            --search-dir wmp/build/service/lib \
            --system-soname libblkid.so.1 \
            --system-soname libbuxton2.so.1 \
            --system-soname libcrypto.so.1.1 \
            --system-soname libecore.so.1 \
            --system-soname liblzma.so.5 \
            --system-soname libsmack.so.1 \
            --system-soname libuuid.so.1

      - name: Upload ELF dependency audit report
        if: always() && hashFiles('build-report/elf-dependencies.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wmp-elf-dependency-audit-${{ github.sha }}
          path: build-report/elf-dependencies.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmp-native-arm-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            engine-build/libmlengine.so
            wmp/build/service/bin/wmp-service
            wmp/build/service/lib/libmlengine.so
            build-report/
