name: WMP engine and .NET host build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Moonlight branch or tag containing the WMP engine and .NET host sources"
        required: true
        default: 1.2.4-pre
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: "Moonlight branch or tag containing the WMP engine and .NET host sources"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wmp-native-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ARM engine and managed WMP host
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out WMP engine and .NET host sources
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Pull Tizen build image from GHCR
        shell: bash
        run: docker pull "ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5"

      - name: Test and build WMP entirely inside the shared image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -e RUNNER_TEMP=/runner-temp \
            -w /workspace \
            ghcr.io/${GITHUB_REPOSITORY_OWNER}/moonlight-tizen-build-env:6.1-v5 \
            bash scripts/build-wmp-native.sh

      - name: Upload Tizen SDK library diagnostics
        if: always() && hashFiles('wmp-sdk-diagnostic.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wmp-sdk-diagnostic
          path: wmp-sdk-diagnostic.txt
          retention-days: 14

      - name: Upload native build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wmp-native-arm
          if-no-files-found: error
          retention-days: 14
          path: |
            engine-build/libmlengine.so
            build-report/
            wmp-tv-libs/
