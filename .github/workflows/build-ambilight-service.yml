name: Build Moonlight Samsung TV hybrid WGT

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "ambilight-service/**"
      - "wasm/platform/ambilight.js"
      - "wasm/index.html"
      - "wasm/platform/index.js"
      - "wasm/platform/messages.js"
      - "res/config.xml"
      - "Dockerfile"
      - ".github/workflows/build-ambilight-service.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: moonlight-ambilight-hybrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-hybrid:
    name: Build Samsung TV Web + native ServiceApp package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip

      - name: Install Tizen Studio CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"

          # Use the baseline Tizen 9 ARM rootstrap. Do not install or target IoT Headed.
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,NativeToolchain-Gcc-9.2,TIZEN-9.0-NativeAppDevelopment-CLI"

          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"

      - name: Verify Samsung-compatible ARM build target
        shell: bash
        run: |
          set -euo pipefail
          tizen list rootstrap | tee "$RUNNER_TEMP/rootstraps.txt"
          grep -Fq 'tizen-9.0-device.core' "$RUNNER_TEMP/rootstraps.txt"
          tizen list native-project | tee "$RUNNER_TEMP/native-templates.txt"
          grep -Eq 'tizen-9.0[[:space:]]+ServiceApp' "$RUNNER_TEMP/native-templates.txt"

      - name: Create CI signing profile
        shell: bash
        env:
          CERT_PASSWORD: moonlight-hybrid-ci
        run: |
          set -euo pipefail
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile"
          tizen certificate -a MoonlightHybrid -f MoonlightHybrid -p "$CERT_PASSWORD"

          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          if [[ ! -s "$profiles" ]]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' \
              '<profiles active="" version="3.1"></profiles>' > "$profiles"
          fi

          tizen security-profiles add \
            -n MoonlightHybrid \
            -a "$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.p12" \
            -p "$CERT_PASSWORD" \
            -- "$TIZEN_STUDIO_DATA_PATH/profile"
          test -s "$profiles"
          tizen cli-config "default.profiles.path=$profiles"
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.pwd||" "$profiles"

          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd|tizenpkcs12passfordsigner|" "$profiles"

      - name: Ensure versioned MP4 splash assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Build Moonlight Web application
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILD_TYPE=release \
            --build-arg REPO_OWNER="${GITHUB_REPOSITORY%%/*}" \
            --build-arg REPO_NAME="${GITHUB_REPOSITORY#*/}" \
            --build-arg FORCE_GAME_MODE=false \
            --tag "moonlight-ambilight-web:$GITHUB_SHA" \
            .

          container_id="$(docker create "moonlight-ambilight-web:$GITHUB_SHA")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          test -s "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          unzip -tq "$RUNNER_TEMP/Moonlight-Web-Base.wgt"

      - name: Prepare the hybrid Web and native projects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/MoonlightHybrid"
          web="$root/MoonlightWeb"
          service="$root/MoonlightAmbilightService"
          mkdir -p "$root"

          tizen list web-project > "$RUNNER_TEMP/web-templates.txt"
          web_profile="$(awk '$1 ~ /^tizen-[0-9]+\.[0-9]+$/ && $2 == "WebBasicApplication" { print $1 }' \
            "$RUNNER_TEMP/web-templates.txt" | sort -Vr | head -n 1)"
          test -n "$web_profile"

          tizen create web-project -p "$web_profile" -t WebBasicApplication -n MoonlightWeb -- "$root"
          tizen create native-project -p tizen-9.0 -t ServiceApp -n MoonlightAmbilightService -- "$root"
          test -d "$web" && test -d "$service"

          python3 - "$RUNNER_TEMP/Moonlight-Web-Base.wgt" "$web" <<'PY'
          import sys, zipfile
          from pathlib import Path, PurePosixPath
          source, destination = Path(sys.argv[1]), Path(sys.argv[2]).resolve()
          excluded_signatures = {"author-signature.xml", "signature1.xml", "signature2.xml"}
          with zipfile.ZipFile(source) as archive:
              for member in archive.infolist():
                  name = PurePosixPath(member.filename)
                  if name.is_absolute() or ".." in name.parts:
                      raise SystemExit(f"Unsafe path in base WGT: {member.filename}")
                  if not name.parts or name.name in excluded_signatures:
                      continue
                  target = (destination / Path(*name.parts)).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"Base WGT path escapes Web project: {member.filename}")
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(member))
          PY

          test -s "$web/config.xml"
          test -s "$web/index.html"
          test -s "$web/platform/ambilight.js"

          python3 - "$web/.project" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              tree = ET.parse(path)
              root = tree.getroot()
          else:
              root = ET.Element("projectDescription")
              ET.SubElement(root, "name").text = "MoonlightWeb"
              ET.SubElement(root, "comment")
              ET.SubElement(root, "projects")
              ET.SubElement(root, "buildSpec")
              ET.SubElement(root, "natures")
              tree = ET.ElementTree(root)
          projects = root.find("projects")
          if projects is None:
              projects = ET.SubElement(root, "projects")
          if not any((item.text or "").strip() == "MoonlightAmbilightService"
                     for item in projects.findall("project")):
              ET.SubElement(projects, "project").text = "MoonlightAmbilightService"
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          PY

          mkdir -p "$service/src"
          cp ambilight-service/native/main.c "$service/src/main.c"
          cp ambilight-service/native/tizen-manifest.xml "$service/tizen-manifest.xml"

          python3 - "$web/config.xml" "$service/tizen-manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          web = ET.parse(sys.argv[1]).getroot()
          tree = ET.parse(sys.argv[2])
          native = tree.getroot()
          web_app = next((node for node in web.iter() if node.tag.endswith("application")), None)
          service_app = next((node for node in native.iter()
                              if node.tag.endswith("service-application")), None)
          if web_app is None or web_app.attrib.get("id") != "MoonLightS.MoonlightWasm":
              raise SystemExit("Moonlight Web application ID changed unexpectedly")
          if web_app.attrib.get("package") != "MoonLightS":
              raise SystemExit("Moonlight Web package ID is not MoonLightS")
          if native.attrib.get("package") != web_app.attrib.get("package"):
              raise SystemExit("Native and Web projects must share one package ID")
          if service_app is None or service_app.attrib.get("appid") != "MoonLightS.MoonlightAmbilight":
              raise SystemExit("Native Ambilight service application ID mismatch")
          if service_app.attrib.get("exec") != "moonlight-ambilight":
              raise SystemExit("Native service executable name mismatch")
          native.set("version", web.attrib.get("version", "1.2.4"))
          tree.write(sys.argv[2], encoding="UTF-8", xml_declaration=True)
          PY

          cat > "$service/project_def.prop" <<'PROP'
          APPNAME = moonlight-ambilight

          type = app
          profile = tizen-9.0

          USER_SRCS = src/main.c
          USER_DEFS =
          USER_INC_DIRS = src
          USER_OBJS =
          USER_LIBS = capi-appfw-service-application capi-appfw-app-control dlog dl pthread m
          USER_LFLAGS = -Wl,--no-undefined
          USER_EDCS =
          PROP

          echo "HYBRID_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build and sign the hybrid Samsung TV WGT
        shell: bash
        env:
          AUTHOR_CERT_PASSWORD: moonlight-hybrid-ci
          DISTRIBUTOR_CERT_PASSWORD: tizenpkcs12passfordsigner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-hybrid-build.exp" <<'EXPECT'
          set timeout 600
          log_user 1
          set author_password $env(AUTHOR_CERT_PASSWORD)
          set distributor_password $env(DISTRIBUTOR_CERT_PASSWORD)
          spawn {*}$argv
          expect {
            -re {(?i)save\s+(author|distributor1?)\s+password} {
              send -- "n\r"
              exp_continue -continue_timer
            }
            -re {(?i)(author|authoring)[^\r\n]{0,100}password|password[^\r\n]{0,100}(author|authoring)} {
              send -- "$author_password\r"
              exp_continue -continue_timer
            }
            -re {(?i)(distributor|distributor1)[^\r\n]{0,100}password|password[^\r\n]{0,100}(distributor|distributor1)} {
              send -- "$distributor_password\r"
              exp_continue -continue_timer
            }
            timeout {
              puts stderr "Timed out waiting for Tizen hybrid build/signing."
              puts stderr $expect_out(buffer)
              exit 124
            }
            eof {}
          }
          set result [wait]
          if {[lindex $result 2] != 0} { exit 125 }
          set exit_status [lindex $result 3]
          if {$exit_status != 0} { exit $exit_status }
          if {[llength $result] > 4 && [lindex $result 4] != 0} { exit 126 }
          EXPECT
          chmod +x "$RUNNER_TEMP/run-hybrid-build.exp"

          expect "$RUNNER_TEMP/run-hybrid-build.exp" \
            tizen build-app \
            -m 'name:m1,compiler:gcc,rootstraps:[{"name":"tizen-9.0-device.core","platform":"tizen-9.0","arch":"arm"}],configs:[Release]' \
            -b 'name:b1,targets:[MoonlightWeb,MoonlightAmbilightService],methods:[m1]' \
            -p 'name:p1,targets:[b1]' \
            -s MoonlightHybrid \
            -- "$HYBRID_ROOT"

      - name: Validate the single hybrid WGT
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' packages < <(find "$HYBRID_ROOT" -type f -name '*.wgt' -size +0c -print0)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected one hybrid WGT, found ${#packages[@]}."
            find "$HYBRID_ROOT" -maxdepth 7 -type f -printf '%p\n' | sort
            exit 1
          fi

          package="${packages[0]}"
          unzip -t "$package"
          python3 - "$package" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          from pathlib import PurePosixPath
          package = sys.argv[1]
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {
                  "config.xml",
                  "tizen-manifest.xml",
                  "bin/moonlight-ambilight",
                  "res/wgt/config.xml",
                  "res/wgt/index.html",
                  "res/wgt/platform/ambilight.js",
                  "author-signature.xml",
                  "signature1.xml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Hybrid WGT is missing: " + ", ".join(missing))
              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in hybrid WGT: {name}")

              web = ET.fromstring(archive.read("res/wgt/config.xml"))
              web_app = next((node for node in web.iter() if node.tag.endswith("application")), None)
              native = ET.fromstring(archive.read("tizen-manifest.xml"))
              service_app = next((node for node in native.iter()
                                  if node.tag.endswith("service-application")), None)

              if web_app is None or web_app.attrib.get("id") != "MoonLightS.MoonlightWasm":
                  raise SystemExit("Packaged Web application identity is invalid")
              if web_app.attrib.get("package") != "MoonLightS":
                  raise SystemExit("Packaged Web package ID is invalid")
              if native.attrib.get("package") != "MoonLightS":
                  raise SystemExit("Packaged native package ID differs from Web package")
              if service_app is None or service_app.attrib.get("appid") != "MoonLightS.MoonlightAmbilight":
                  raise SystemExit("Packaged Ambilight service application ID is invalid")
              if service_app.attrib.get("exec") != "moonlight-ambilight":
                  raise SystemExit("Packaged Ambilight executable identity is invalid")
              print("Validated one signed hybrid WGT: Moonlight Web UI + native Ambilight ServiceApp.")
          PY

          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$package" "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt"
          sha256sum "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt" \
            > "$RUNNER_TEMP/hybrid-output/SHA256SUMS"

      - name: Upload hybrid WGT
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Ambilight-Samsung-TV-Hybrid
          path: ${{ runner.temp }}/hybrid-output/
          if-no-files-found: error
          retention-days: 14
