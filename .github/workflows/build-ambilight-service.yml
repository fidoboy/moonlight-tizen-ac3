name: Build Moonlight Samsung TV hybrid WGT

on:
  workflow_dispatch:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - "ambilight-service/Program.cs"
      - "ambilight-service/TizenAmbilight.csproj"
      - "ambilight-service/VideoPlaneCapture.cs"
      - "ambilight-service/WledOutput.cs"
      - "ambilight-service/tizen-manifest.xml"
      - "wasm/platform/ambilight.js"
      - "wasm/index.html"
      - "wasm/platform/index.js"
      - "wasm/platform/messages.js"
      - "res/config.xml"
      - "Dockerfile"
      - ".github/workflows/build-ambilight-service.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: moonlight-ambilight-hybrid-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-hybrid:
    name: Build Samsung TV Web + .NET Tizen ServiceApplication
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip

      - name: Install Tizen SDK packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8

          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"

          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"

          # Keep the legacy CLI only for certificate creation. The final hybrid
          # package is assembled by Tizen Core CLI (tz), not the old build-app flow.
          "$pm" install --accept-license --no-java-check \
            "NativeCLI,TIZEN-9.0-WebAppDevelopment-CLI"

          core_cli="$sdk/tools/tizen-core/tz"
          test -x "$core_cli"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$core_cli" >> "$GITHUB_ENV"

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Verify Tizen Core and .NET build tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$TIZEN_CORE_CLI"
          "$TIZEN_CORE_CLI" --version
          "$TIZEN_CORE_CLI" pack --help | tee "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--ref-pkgs' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          grep -Fq -- '--base-pkg' "$RUNNER_TEMP/tizen-core-pack-help.txt"
          dotnet --info
          dotnet --list-sdks | grep -E '^8\.'

      - name: Create CI signing profile
        shell: bash
        env:
          CERT_PASSWORD: moonlight-hybrid-ci
        run: |
          set -euo pipefail
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/profile"
          tizen certificate -a MoonlightHybrid -f MoonlightHybrid -p "$CERT_PASSWORD"

          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          if [[ ! -s "$profiles" ]]; then
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8" standalone="no"?>' \
              '<profiles active="" version="3.1"></profiles>' > "$profiles"
          fi

          tizen security-profiles add \
            -n MoonlightHybrid \
            -a "$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.p12" \
            -p "$CERT_PASSWORD"
          test -s "$profiles"

          # Credentials are supplied interactively to tz pack below. Do not leave
          # password-file paths or plaintext passwords in the temporary profile.
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/MoonlightHybrid.pwd||" "$profiles"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd||" "$profiles"

          "$TIZEN_CORE_CLI" set --profiles-path "$profiles"
          echo "TIZEN_PROFILES=$profiles" >> "$GITHUB_ENV"

      - name: Ensure versioned MP4 splash assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/build-assets/$asset_file"
          asset_path="$RUNNER_TEMP/$asset_file"
          api_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos

          status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
          if [[ "$status" == "404" ]]; then
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch Generate video assets (HTTP $dispatch_status)." >&2
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url")"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for generated video assets." >&2
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)." >&2
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          test -s generated-videos/launch-screen.mp4
          test -s generated-videos/launch-screen-portrait.mp4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Moonlight Web application
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-ambilight-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract base Web WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create "moonlight-ambilight-web:$GITHUB_SHA")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          test -s "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          unzip -tq "$RUNNER_TEMP/Moonlight-Web-Base.wgt"

      - name: Build the original .NET Tizen service
        shell: bash
        run: |
          set -euo pipefail

          # Keep the .NET service identity and version aligned with Moonlight's
          # Web package. The Web app and service remain separate applications
          # inside one package, with the same Tizen package ID.
          python3 - "$RUNNER_TEMP/Moonlight-Web-Base.wgt" ambilight-service/tizen-manifest.xml <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          with zipfile.ZipFile(sys.argv[1]) as package:
              web = ET.fromstring(package.read("config.xml"))

          service_path = sys.argv[2]
          tree = ET.parse(service_path)
          manifest = tree.getroot()
          web_app = next((node for node in web.iter()
                          if node.tag.endswith("application")), None)
          service_app = next((node for node in manifest.iter()
                              if node.tag.endswith("service-application")), None)

          if web_app is None or web_app.get("id") != "MoonLightS.MoonlightWasm":
              raise SystemExit("Moonlight Web application ID changed unexpectedly")
          if web_app.get("package") != "MoonLightS":
              raise SystemExit("Moonlight Web package ID changed unexpectedly")
          if manifest.get("package") != web_app.get("package"):
              raise SystemExit("Web and .NET service package IDs must match")
          if service_app is None:
              raise SystemExit("The .NET ServiceApplication manifest is missing")
          if service_app.get("appid") != "MoonLightS.MoonlightAmbilight":
              raise SystemExit("Ambilight service application ID mismatch")
          if service_app.get("type") != "dotnet":
              raise SystemExit("Ambilight must remain a .NET Tizen ServiceApplication")
          if service_app.get("exec") != "MoonlightAmbilight.dll":
              raise SystemExit("Ambilight .NET entry assembly mismatch")

          manifest.set("version", web.get("version", "1.2.3"))
          tree.write(service_path, encoding="UTF-8", xml_declaration=True)
          print("Validated matching package ID and .NET service app ID; aligned package version.")
          PY

          dotnet msbuild ambilight-service/TizenAmbilight.csproj \
            -restore -t:Rebuild -p:Configuration=Release -v:m

          mapfile -d '' service_packages < <(find ambilight-service/bin/Release -type f -name '*.tpk' -size +0c -print0)
          if [[ ${#service_packages[@]} -ne 1 ]]; then
            echo "::error::Expected one .NET Tizen TPK, found ${#service_packages[@]}."
            find ambilight-service/bin -maxdepth 8 -type f -printf '%p\n' | sort || true
            exit 1
          fi

          service_tpk="${service_packages[0]}"
          unzip -tq "$service_tpk"
          python3 - "$service_tpk" <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import PurePosixPath

          path = sys.argv[1]
          with zipfile.ZipFile(path) as package:
              names = package.namelist()
              manifests = [name for name in names
                           if PurePosixPath(name).name == "tizen-manifest.xml"]
              if len(manifests) != 1:
                  raise SystemExit("The .NET TPK must contain exactly one tizen-manifest.xml")
              manifest = ET.fromstring(package.read(manifests[0]))
              app = next((node for node in manifest.iter()
                          if node.tag.endswith("service-application")), None)
              if manifest.get("package") != "MoonLightS":
                  raise SystemExit("The .NET TPK package ID is not MoonLightS")
              if app is None or app.get("appid") != "MoonLightS.MoonlightAmbilight":
                  raise SystemExit("The .NET TPK service application ID is incorrect")
              if app.get("type") != "dotnet" or app.get("exec") != "MoonlightAmbilight.dll":
                  raise SystemExit("The TPK does not contain the expected .NET service declaration")
              if not any(PurePosixPath(name).name == "MoonlightAmbilight.dll" for name in names):
                  raise SystemExit("MoonlightAmbilight.dll is missing from the .NET TPK")
              print("Validated the compiled .NET Tizen ServiceApplication TPK.")
          PY

          echo "AMBILIGHT_SERVICE_TPK=$service_tpk" >> "$GITHUB_ENV"

      - name: Package Web UI and .NET service as one hybrid WGT
        shell: bash
        env:
          AUTHOR_CERT_PASSWORD: moonlight-hybrid-ci
          DISTRIBUTOR_CERT_PASSWORD: tizenpkcs12passfordsigner
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt"

          cat > "$RUNNER_TEMP/run-tizen-pack.exp" <<'EXPECT'
          set timeout 600
          log_user 1
          set author_password $env(AUTHOR_CERT_PASSWORD)
          set distributor_password $env(DISTRIBUTOR_CERT_PASSWORD)
          spawn {*}$argv
          expect {
            -re {(?i)save\s+(author|distributor1?)\s+password} {
              send -- "n\r"
              exp_continue -continue_timer
            }
            -re {(?i)(author|authoring)[^\r\n]{0,100}password|password[^\r\n]{0,100}(author|authoring)} {
              send -- "$author_password\r"
              exp_continue -continue_timer
            }
            -re {(?i)(distributor|distributor1)[^\r\n]{0,100}password|password[^\r\n]{0,100}(distributor|distributor1)} {
              send -- "$distributor_password\r"
              exp_continue -continue_timer
            }
            timeout {
              puts stderr "Timed out waiting for Tizen hybrid packaging/signing."
              puts stderr $expect_out(buffer)
              exit 124
            }
            eof {}
          }
          set result [wait]
          if {[lindex $result 2] != 0} { exit 125 }
          set exit_status [lindex $result 3]
          if {$exit_status != 0} { exit $exit_status }
          if {[llength $result] > 4 && [lindex $result 4] != 0} { exit 126 }
          EXPECT
          chmod +x "$RUNNER_TEMP/run-tizen-pack.exp"

          expect "$RUNNER_TEMP/run-tizen-pack.exp" \
            "$TIZEN_CORE_CLI" pack \
            --type wgt \
            --sign-profile MoonlightHybrid \
            --profiles-path "$TIZEN_PROFILES" \
            --ref-pkgs "$AMBILIGHT_SERVICE_TPK" \
            --base-pkg "$RUNNER_TEMP/Moonlight-Web-Base.wgt" \
            --out-path "$output"

          test -s "$output"
          echo "HYBRID_WGT=$output" >> "$GITHUB_ENV"

      - name: Validate the single hybrid WGT and AppControl contract
        shell: bash
        run: |
          set -euo pipefail
          package="$HYBRID_WGT"
          unzip -t "$package"

          python3 - "$package" wasm/platform/ambilight.js ambilight-service/Program.cs <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import PurePosixPath

          package_path, js_path, cs_path = sys.argv[1:]
          with zipfile.ZipFile(package_path) as package:
              names = set(package.namelist())
              required = {
                  "tizen-manifest.xml",
                  "res/wgt/config.xml",
                  "res/wgt/index.html",
                  "res/wgt/platform/ambilight.js",
                  "author-signature.xml",
                  "signature1.xml",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Hybrid WGT is missing: " + ", ".join(missing))

              for name in names:
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe path in hybrid WGT: {name}")

              web = ET.fromstring(package.read("res/wgt/config.xml"))
              web_app = next((node for node in web.iter()
                              if node.tag.endswith("application")), None)
              service = ET.fromstring(package.read("tizen-manifest.xml"))
              service_app = next((node for node in service.iter()
                                  if node.tag.endswith("service-application")), None)

              if web_app is None or web_app.get("id") != "MoonLightS.MoonlightWasm":
                  raise SystemExit("Packaged Moonlight Web application identity is invalid")
              if web_app.get("package") != "MoonLightS":
                  raise SystemExit("Packaged Web package ID is invalid")
              if service.get("package") != "MoonLightS":
                  raise SystemExit("Packaged .NET service package ID differs from Web package")
              if service_app is None or service_app.get("appid") != "MoonLightS.MoonlightAmbilight":
                  raise SystemExit("Packaged Ambilight service application ID is invalid")
              if service_app.get("type") != "dotnet" or service_app.get("exec") != "MoonlightAmbilight.dll":
                  raise SystemExit("Packaged service is not the expected .NET Tizen application")

              assemblies = [name for name in names
                            if PurePosixPath(name).name == "MoonlightAmbilight.dll"]
              if not assemblies:
                  raise SystemExit("Packaged .NET service assembly is missing")

          with open(js_path, encoding="utf-8") as file:
              js = file.read()
          with open(cs_path, encoding="utf-8") as file:
              cs = file.read()

          contract = [
              "MoonLightS.MoonlightAmbilight",
              "new tizen.ApplicationControlData('command'",
              "new tizen.ApplicationControlData('wledIp'",
              "new tizen.ApplicationControlData('wledPort'",
              "new tizen.ApplicationControlData('ledCount'",
          ]
          for token in contract:
              if token not in js:
                  raise SystemExit("Web AppControl contract is missing: " + token)
          for token in ['"command"', '"wledIp"', '"wledPort"', '"ledCount"', '"start"', '"stop"']:
              if token not in cs:
                  raise SystemExit("The .NET service does not handle AppControl field: " + token)

          print("Validated one signed hybrid WGT: Moonlight Web/WASM + .NET Tizen service.")
          print("Validated matching Web-to-.NET AppControl application ID and start/stop fields.")
          PY

          mkdir -p "$RUNNER_TEMP/hybrid-output"
          cp "$package" "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt"
          sha256sum "$RUNNER_TEMP/hybrid-output/Moonlight-Ambilight-Samsung-TV-Hybrid.wgt" \
            > "$RUNNER_TEMP/hybrid-output/SHA256SUMS"

      - name: Show Tizen CLI diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== Tizen Core / Studio logs ==="
          find "$RUNNER_TEMP" "$HOME" -type f \
            \( -path '*/cli/logs/cli.log' -o -name 'tizen-core.log' -o -name 'tz.log' \) \
            -print 2>/dev/null | while IFS= read -r log; do
              echo "--- $log (last 300 lines) ---"
              tail -n 300 "$log"
            done
          echo "=== .NET build outputs ==="
          find ambilight-service/bin -maxdepth 8 -type f -printf '%p\n' 2>/dev/null | sort

      - name: Upload hybrid WGT
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Ambilight-Samsung-TV-Hybrid
          path: ${{ runner.temp }}/hybrid-output/
          if-no-files-found: error
          retention-days: 14
