name: Diagnose Tizen dotnet-build author-attr semantics

on:
  push:
    branches: ["1.2.4-pre"]
    paths:
      - ".github/workflows/diagnose-author-attr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: diagnose-author-attr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref == 'refs/heads/1.2.4-pre'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: ghcr.io/fidoboy/moonlight-tizen-build-env:6.1-v2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out Moonlight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Prepare isolated Tizen .NET signing probe
        shell: bash
        run: |
          set -euo pipefail
          sdk="${TIZEN_STUDIO:?TIZEN_STUDIO must be set by the shared build image}"
          test -x "$sdk/tools/tizen-core/tz"
          test -x "$sdk/tools/ide/bin/tizen"
          export TIZEN_STUDIO_DATA_PATH=/home/tizen/tizen-studio-data
          mkdir -p "$TIZEN_STUDIO_DATA_PATH/keystore/author"
          out="$RUNNER_TEMP/author-attr-probe"
          workspace="$RUNNER_TEMP/author-attr-workspace"
          mkdir -p "$out" "$workspace"
          echo "$sdk/tools/tizen-core" >> "$GITHUB_PATH"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_CORE_CLI=$sdk/tools/tizen-core/tz" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$TIZEN_STUDIO_DATA_PATH" >> "$GITHUB_ENV"
          echo "PROBE_OUT=$out" >> "$GITHUB_ENV"
          echo "PROBE_WORKSPACE=$workspace" >> "$GITHUB_ENV"

          echo "=== Verify CLI version and dotnet-build syntax ==="
          tz --version
          tz dotnet-build build --help 2>&1 | tee "$out/dotnet-build-help.txt"

          echo "=== Generate a disposable author certificate ==="
          author_password=123456
          tizen certificate -a AuthorAttrProbe -f AuthorAttrProbe -p "$author_password"
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/AuthorAttrProbe.p12"
          author_pwd="$TIZEN_STUDIO_DATA_PATH/keystore/author/AuthorAttrProbe.pwd"
          test -s "$author_key"
          printf '%s' "$author_password" > "$author_pwd"
          openssl pkcs12 -legacy -in "$author_key" -passin "file:$author_pwd" -info -noout \
            > "$out/author-pkcs12-validation.txt" 2>&1
          printf 'author_password=%s\n' "$author_password" | tee "$out/probe-inputs.txt"
          printf 'author_key=%s\n' "$author_key" | tee -a "$out/probe-inputs.txt"
          printf 'author_pwd=%s\n' "$author_pwd" | tee -a "$out/probe-inputs.txt"
          printf 'password_file_bytes=' | tee -a "$out/probe-inputs.txt"
          wc -c < "$author_pwd" | tee -a "$out/probe-inputs.txt"
          printf 'password_file_hex=' | tee -a "$out/probe-inputs.txt"
          od -An -v -tx1 "$author_pwd" | tee -a "$out/probe-inputs.txt"

          echo "=== Select and validate the SDK public distributor certificate ==="
          distributor_key="$sdk/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12"
          test -s "$distributor_key"
          openssl pkcs12 -legacy -in "$distributor_key" \
            -passin pass:tizenpkcs12passfordsigner -info -noout \
            > "$out/distributor-pkcs12-validation.txt" 2>&1
          printf 'distributor_key=%s\n' "$distributor_key" | tee -a "$out/probe-inputs.txt"
          printf 'distributor_password=tizenpkcs12passfordsigner\n' | tee -a "$out/probe-inputs.txt"

          echo "=== Generate a minimal TizenServiceApp project ==="
          tz new -t TizenServiceApp -n AttrProbeService -T dotnet \
            -p tv-samsung-10.0 -w "$workspace" \
            > "$out/tz-new-stdout.txt" 2> "$out/tz-new-stderr.txt"
          find "$workspace" -type f -name '*.csproj' -print | tee "$out/generated-csproj-paths.txt"
          mapfile -t projects < <(find "$workspace" -type f -name '*.csproj' -print)
          if (( ${#projects[@]} != 1 )); then
            echo "Expected exactly one generated .csproj."
            exit 1
          fi
          printf '%s\n' "${projects[0]}" > "$out/probe-project-path.txt"
          echo "Probe setup completed."

      - name: Create a real Tizen signing-profile password attribute
        id: profile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/AuthorAttrProbe.p12"
          distributor_key="$(sed -n 's/^distributor_key=//p' "$PROBE_OUT/probe-inputs.txt")"
          author_password=123456
          distributor_password=tizenpkcs12passfordsigner
          profiles_xml="$PROBE_OUT/probe-profiles.xml"

          echo "=== Tizen Core security-profiles add help ==="
          "$TIZEN_CORE_CLI" security-profiles add --help > "$PROBE_OUT/security-profiles-add-help.txt" 2>&1
          help_status=$?
          printf '%s\n' "$help_status" > "$PROBE_OUT/security-profiles-add-help-exit-code.txt"
          cat "$PROBE_OUT/security-profiles-add-help.txt"

          echo "=== Create an isolated profile so tz generates its native password attributes ==="
          "$TIZEN_CORE_CLI" security-profiles add \
            -n AttrProbeProfile \
            -x "$profiles_xml" \
            -a "$author_key" -p "$author_password" \
            -d "$distributor_key" -P "$distributor_password" \
            > "$PROBE_OUT/security-profiles-add.log" 2>&1
          profile_status=$?
          printf '%s\n' "$profile_status" > "$PROBE_OUT/security-profiles-add-exit-code.txt"
          cat "$PROBE_OUT/security-profiles-add.log"
          if [[ -s "$profiles_xml" ]]; then
            echo "=== Generated profile XML (disposable credentials only) ==="
            cat "$profiles_xml"
            python3 - "$profiles_xml" "$PROBE_OUT/profile-password-attributes.txt" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          xml_path, output_path = sys.argv[1:3]
          root = ET.parse(xml_path).getroot()
          rows = []
          for element in root.iter():
              attrs = element.attrib
              slot = attrs.get("distributor")
              if slot in ("0", "1", "2"):
                  rows.append((slot, attrs.get("key", ""), attrs.get("password", "")))
          with open(output_path, "w", encoding="utf-8") as out:
              for slot, key, password in rows:
                  out.write(f"slot={slot}\nkey={key}\npassword_attr={password}\n")
          if not rows:
              raise SystemExit("No profileitem entries with distributor slots 0/1/2 found")
          PY
            attr_status=$?
            printf '%s\n' "$attr_status" > "$PROBE_OUT/profile-password-attributes-exit-code.txt"
            if [[ -s "$PROBE_OUT/profile-password-attributes.txt" ]]; then
              echo "=== Profile password attribute metadata ==="
              while IFS= read -r line; do
                case "$line" in
                  password_attr=*)
                    value="${line#password_attr=}"
                    if [[ "$value" == *.pwd ]]; then
                      printf 'password_attr_kind=credential-store-path\n'
                    else
                      printf 'password_attr_kind=inline-encrypted-value\n'
                      printf 'password_attr_length=%s\n' "${#value}"
                    fi
                    ;;
                  slot=*) echo "$line" ;;
                  key=*) echo "$line" ;;
                esac
              done < "$PROBE_OUT/profile-password-attributes.txt"
            fi
          else
            echo "Tizen Core did not create the isolated profiles.xml."
            printf '1\n' > "$PROBE_OUT/profile-password-attributes-exit-code.txt"
          fi

          echo "=== Inspect SDK distributor password sidecars and CLI password-related strings ==="
          find "$(dirname "$distributor_key")" -maxdepth 2 -type f \
            \( -name '*.pwd' -o -name '*distributor*' \) -printf '%p %s bytes\n' \
            > "$PROBE_OUT/distributor-sdk-files.txt" 2>&1
          cat "$PROBE_OUT/distributor-sdk-files.txt"
          strings "$TIZEN_CORE_CLI" | grep -iE 'password|decrypt|crypt|dist-attr|author-attr' \
            > "$PROBE_OUT/tz-password-strings.txt" || true
          cat "$PROBE_OUT/tz-password-strings.txt"
          echo "tz pack: NOT RUN"

      - name: Compare encrypted author-attr with the .pwd path
        id: compare
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source_project="$(cat "$PROBE_OUT/probe-project-path.txt")"
          author_key="$TIZEN_STUDIO_DATA_PATH/keystore/author/AuthorAttrProbe.p12"
          author_pwd="$TIZEN_STUDIO_DATA_PATH/keystore/author/AuthorAttrProbe.pwd"
          distributor_key="$(sed -n 's/^distributor_key=//p' "$PROBE_OUT/probe-inputs.txt")"

          # Tizen's inline password attribute is Base64(3DES-ECB-PKCS5Padding).
          # These values were cross-checked against the Tizen CipherUtil format:
          # author password 123456 -> HeifNwdU+kk=
          # bundled distributor password -> Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k=
          author_encrypted='HeifNwdU+kk='
          distributor_encrypted='Vy63flx5JBMc5GA4iEf8oFy+8aKE7FX/+arrDcO4I5k='

          {
            echo "author_pwd_path_exists=$([[ -s "$author_pwd" ]] && echo yes || echo no)"
            echo "distributor_key_exists=$([[ -s "$distributor_key" ]] && echo yes || echo no)"
            echo "author_encrypted_attribute=$author_encrypted"
            echo "distributor_encrypted_attribute=$distributor_encrypted"
          } > "$PROBE_OUT/attribute-validation.txt"

          run_probe() {
            local mode="$1"
            local author_attr="$2"
            local project_dir="$PROBE_WORKSPACE/$mode"
            local log="$PROBE_OUT/$mode.log"
            local status_file="$PROBE_OUT/$mode-exit-code.txt"
            local project_file

            mkdir -p "$project_dir"
            if ! cp -a "$(dirname "$source_project")/." "$project_dir/"; then
              echo "Could not prepare isolated project for $mode" > "$log"
              printf '125\n' > "$status_file"
              return 0
            fi
            project_file="$project_dir/$(basename "$source_project")"

            echo "=== Probe: $mode ==="
            {
              echo "author_attr_argument=$author_attr"
              echo "distributor_attr_argument=$distributor_encrypted"
              echo "author_key=$author_key"
              echo "distributor_key=$distributor_key"
              echo "project_file=$project_file"
            } > "$PROBE_OUT/$mode-input.txt"

            if timeout --signal=TERM --kill-after=10s 180s "$TIZEN_CORE_CLI" dotnet-build build \
              --author-key "$author_key" \
              --author-attr "$author_attr" \
              --dist-key "$distributor_key" \
              --dist-attr "$distributor_encrypted" \
              --target-path "$project_file" > "$log" 2>&1; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" > "$status_file"
            cat "$log"
            echo "$mode exit code: $status"
            return 0
          }

          # Candidate: encrypted inline attribute. Control: .pwd path.
          run_probe encrypted-inline "$author_encrypted"
          encrypted_function_status=$?
          run_probe pwd-path-control "$author_pwd"
          pwd_function_status=$?

          encrypted_status="$(cat "$PROBE_OUT/encrypted-inline-exit-code.txt" 2>/dev/null || echo NOT_RUN)"
          pwd_status="$(cat "$PROBE_OUT/pwd-path-control-exit-code.txt" 2>/dev/null || echo NOT_RUN)"
          {
            echo "encrypted-inline exit code: $encrypted_status"
            echo "pwd-path-control exit code: $pwd_status"
            echo "encrypted-inline function status: $encrypted_function_status"
            echo "pwd-path-control function status: $pwd_function_status"
            if [[ "$encrypted_status" == 0 ]]; then
              echo "Assessment: encrypted inline author-attr and distributor-attr were accepted; dotnet-build completed."
            elif grep -qiE 'failed while fetching author password|wrong crypted size' "$PROBE_OUT/encrypted-inline.log"; then
              echo "Assessment: encrypted inline author-attr was rejected by tz while fetching the author password."
            else
              echo "Assessment: encrypted inline attributes passed the CLI password parser; inspect the log for any downstream signing failure."
            fi
            if grep -qiE 'failed while fetching author password|wrong crypted size' "$PROBE_OUT/pwd-path-control.log"; then
              echo "Control: .pwd path was rejected as an inline encrypted attribute."
            fi
            echo "tz pack: NOT RUN"
          } | tee "$PROBE_OUT/assessment.txt"
          exit 0

      - name: Upload isolated signing probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tizen-author-attr-probe-${{ github.sha }}
          path: ${{ runner.temp }}/author-attr-probe/
          if-no-files-found: warn
          retention-days: 7
