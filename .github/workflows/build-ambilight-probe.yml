name: Build Ambilight capture probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambilight-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Tizen 6.0 hybrid diagnostic WGT
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect python3 binutils file unzip zip

      - name: Restore Python 3.8 Debian package cache
        id: python38-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/python38-debs
          key: python38-debs-ubuntu-22.04-3.8.20-v1

      - name: Install Python 3.8 for Tizen Package Manager
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/python38-debs"
          staging_dir="$RUNNER_TEMP/python38-debs-staging"
          package_version="3.8.20-1+jammy1"
          python_packages=(
            "python3.8=$package_version"
            "libpython3.8=$package_version"
            "python3.8-minimal=$package_version"
            "libpython3.8-minimal=$package_version"
            "libpython3.8-stdlib=$package_version"
          )

          cached_packages=()
          cache_complete=true
          for package in python3.8 libpython3.8 python3.8-minimal libpython3.8-minimal libpython3.8-stdlib; do
            matches=("$cache_dir/${package}_${package_version}_"*.deb)
            if [[ ! -f "${matches[0]}" ]]; then
              cache_complete=false
              break
            fi
            cached_packages+=("${matches[0]}")
          done

          if [[ "$cache_complete" == "true" && ${#cached_packages[@]} -eq 5 ]]; then
            echo "Installing Python 3.8.20 from the restored Debian package cache."
            sudo apt-get install -y --no-install-recommends "${cached_packages[@]}"
          else
            echo "Python 3.8.20 cache miss; installing the pinned packages from deadsnakes."
            sudo apt-get install -y --no-install-recommends software-properties-common
            sudo add-apt-repository -y ppa:deadsnakes/ppa
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${python_packages[@]}"

            rm -rf "$staging_dir"
            mkdir -p "$staging_dir"
            (
              cd "$staging_dir"
              apt-get download "${python_packages[@]}"
            )
            for package in python3.8 libpython3.8 python3.8-minimal libpython3.8-minimal libpython3.8-stdlib; do
              matches=("$staging_dir/${package}_${package_version}_"*.deb)
              test -f "${matches[0]}"
            done
            mkdir -p "$cache_dir"
            cp "$staging_dir"/*.deb "$cache_dir/"
            test "$(find "$cache_dir" -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 5
          fi

          python3.8 --version
          python3.8 -c 'import sys; assert sys.version_info[:2] == (3, 8), sys.version'

      - name: Restore Tizen Studio SDK cache
        id: tizen-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tizen-studio
          key: tizen-studio-${{ runner.os }}-6.1-iot-headed-6.0-tizen-10.0-gcc92-gcc142-v1

      - name: Install Tizen Web and Native SDKs
        if: steps.tizen-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"
          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          required="NativeCLI,NativeToolchain-Gcc-9.2,NativeToolchain-Gcc-14.2,IOT-Headed-6.0-NativeAppDevelopment-CLI,TIZEN-10.0-NativeAppDevelopment-CLI"
          "$pm" install --accept-license --no-java-check "$required"

      - name: Configure Tizen SDK environment
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/tizen-studio"
          test -x "$sdk/tools/ide/bin/tizen"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          echo "TIZEN_STUDIO=$sdk" >> "$GITHUB_ENV"
          echo "TIZEN_STUDIO_DATA_PATH=$RUNNER_TEMP/tizen-studio-data" >> "$GITHUB_ENV"

      - name: Create CI signing profile
        shell: bash
        env:
          CERT_PASSWORD: ambilight-probe-ci
        run: |
          set -euo pipefail
          mkdir -p "$TIZEN_STUDIO_DATA_PATH"
          tizen certificate -a AmbilightProbe -f AmbilightProbe -p "$CERT_PASSWORD"
          tizen security-profiles add \
            -n AmbilightProbe \
            -a "$TIZEN_STUDIO_DATA_PATH/keystore/author/AmbilightProbe.p12" \
            -p "$CERT_PASSWORD"
          profiles="$TIZEN_STUDIO_DATA_PATH/profile/profiles.xml"
          test -s "$profiles"
          sed -i "s|$TIZEN_STUDIO_DATA_PATH/keystore/author/AmbilightProbe.pwd||" "$profiles"
          distributor_pwd="$TIZEN_STUDIO/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.pwd"
          sed -i "s|$distributor_pwd|tizenpkcs12passfordsigner|" "$profiles"

      - name: Prepare web and native service projects
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/AmbilightProbePackage"
          web="$root/AmbilightProbeWeb"
          service="$root/AmbilightProbeService"
          mkdir -p "$root"

          tizen list web-project > "$RUNNER_TEMP/web-project-templates.txt"
          web_profile="$(awk '$1 ~ /^tizen-[0-9]+\.[0-9]+$/ && $2 == "WebBasicApplication" { print $1 }' \
            "$RUNNER_TEMP/web-project-templates.txt" | sort -Vr | head -n 1)"
          test -n "$web_profile"
          tizen create web-project -p "$web_profile" -t WebBasicApplication -n AmbilightProbeWeb -- "$root"
          tizen create native-project -p tizen-10.0 -t ServiceApp -n AmbilightProbeService -- "$root"
          test -d "$web" && test -d "$service"

          cp "$GITHUB_WORKSPACE/ambilight-probe/web/config.xml" "$web/config.xml"
          cp "$GITHUB_WORKSPACE/ambilight-probe/web/index.html" "$web/index.html"
          cp "$GITHUB_WORKSPACE/ambilight-probe/service/tizen-manifest.xml" "$service/tizen-manifest.xml"
          cp "$GITHUB_WORKSPACE/ambilight-probe/service/main.c" "$service/src/main.c"

          python3 - "$web/.project" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path(sys.argv[1])
          if path.exists():
              tree = ET.parse(path); root = tree.getroot()
          else:
              root = ET.Element("projectDescription")
              ET.SubElement(root, "name").text = "AmbilightProbeWeb"
              ET.SubElement(root, "comment")
              ET.SubElement(root, "projects")
              ET.SubElement(root, "buildSpec")
              ET.SubElement(root, "natures")
              tree = ET.ElementTree(root)
          projects = root.find("projects")
          if projects is None: projects = ET.SubElement(root, "projects")
          if not any((x.text or "").strip() == "AmbilightProbeService" for x in projects.findall("project")):
              ET.SubElement(projects, "project").text = "AmbilightProbeService"
          tree.write(path, encoding="UTF-8", xml_declaration=True)
          PY

          python3 - "$web/config.xml" "$service/tizen-manifest.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          web = ET.parse(sys.argv[1]).getroot()
          tree = ET.parse(sys.argv[2]); native = tree.getroot()
          version = web.attrib.get("version")
          web_app = next((n for n in web.iter() if n.tag.endswith("application")), None)
          app = next((n for n in native.iter() if n.tag.endswith("service-application")), None)
          package_id = web_app.attrib.get("package") if web_app is not None else None
          if (not version or web_app is None
                  or web_app.attrib.get("id") != "AmbiProbeX.AmbilightProbeWeb"
                  or package_id != "AmbiProbeX"
                  or native.attrib.get("package") != package_id):
              raise SystemExit("Web application identity or hybrid package ID is invalid")
          if app is None or app.attrib.get("appid") != "AmbiProbeX.ambilight-probe-service" or app.attrib.get("exec") != "ambilight-probe-service":
              raise SystemExit("Native probe service identity is invalid")
          native.set("version", version)
          ET.register_namespace("", "http://tizen.org/ns/packages")
          tree.write(sys.argv[2], encoding="UTF-8", xml_declaration=True)
          PY

          cat > "$service/project_def.prop" <<'PROP'
          APPNAME = ambilight-probe-service

          type = app
          profile = iot-headed-6.0

          USER_SRCS = src/main.c
          USER_DEFS =
          USER_INC_DIRS = src
          USER_OBJS =
          USER_LIBS = appcore-agent dlog message-port bundle dl pthread
          USER_LFLAGS = -Wl,--no-undefined
          USER_EDCS =
          PROP

          if [[ -f "$service/.tproject" ]]; then
            sed -i 's/tizen-10.0/iot-headed-6.0/g' "$service/.tproject"
          fi

          python3 - "$service/.cproject" <<'PY'
          import re, sys
          from pathlib import Path
          path = Path(sys.argv[1]); content = path.read_text(encoding="utf-8")
          options = re.compile(
              r'(<option[^>]*superClass="sbi[.]gnu[.]cpp[.]linker[.]option[.]frameworks_lflags[.]core"[^>]*>).*?(</option>)',
              re.DOTALL)
          sysroot = "$" + "{SBI_SYSROOT}"
          flags = "\n".join([
              '                                    <listOptionValue builtIn="false" value="-Wl,-z,relro,--as-needed"/>',
              '                                    <listOptionValue builtIn="false" value="--sysroot=&quot;' + sysroot + '&quot;"/>'])
          content, n = options.subn(lambda m: m.group(1) + "\n" + flags + "\n                                " + m.group(2), content)
          if n != 2: raise SystemExit(f"Expected 2 linker configurations, found {n}")
          selectors = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option"[^>]*>.*?</option>',
              re.DOTALL)
          content, n = selectors.subn("", content)
          if n != 4: raise SystemExit(f"Expected 4 Tizen 10 SBI selectors, found {n}")
          catalogues = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option[.]frameworks[.]core"[^>]*>.*?</option>',
              re.DOTALL)
          content, n = catalogues.subn("", content)
          if n != 4: raise SystemExit(f"Expected 4 Tizen 10 Native_API catalogues, found {n}")
          if "tizen-10.0-emulator64.core_gcc92.x86.64" in content or re.search(r'value="Native_API"', content):
              raise SystemExit("Tizen 10 platform selectors remain")
          path.write_text(content, encoding="utf-8")
          PY

          echo "AMBILIGHT_PROBE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build and sign hybrid diagnostic WGT
        shell: bash
        env:
          AUTHOR_CERT_PASSWORD: ambilight-probe-ci
          DISTRIBUTOR_CERT_PASSWORD: tizenpkcs12passfordsigner
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/run-probe-build.exp" <<'EXPECT'
          set timeout 600
          log_user 1
          set author_password $env(AUTHOR_CERT_PASSWORD)
          set distributor_password $env(DISTRIBUTOR_CERT_PASSWORD)

          spawn {*}$argv
          expect {
            -re {(?i)save\s+(author|distributor1?)\s+password} {
              send -- "n\r"
              exp_continue -continue_timer
            }
            -re {(?i)(author|authoring)[^\r\n]{0,100}password|password[^\r\n]{0,100}(author|authoring)} {
              send -- "$author_password\r"
              exp_continue -continue_timer
            }
            -re {(?i)(distributor|distributor1)[^\r\n]{0,100}password|password[^\r\n]{0,100}(distributor|distributor1)} {
              send -- "$distributor_password\r"
              exp_continue -continue_timer
            }
            timeout {
              puts stderr "\nERROR: Timed out after 600 seconds waiting for the Tizen build/signing process."
              puts stderr "Last process output:"
              puts stderr $expect_out(buffer)
              exit 124
            }
            eof {}
          }

          set result [wait]
          if {[lindex $result 2] != 0} {
            puts stderr "ERROR: Could not collect the Tizen build process exit status: $result"
            exit 125
          }
          set exit_status [lindex $result 3]
          if {$exit_status != 0} {
            puts stderr "ERROR: Tizen build/signing process exited with status $exit_status."
            exit $exit_status
          }
          if {[llength $result] > 4 && [lindex $result 4] != 0} {
            puts stderr "ERROR: Tizen build/signing process terminated by signal [lindex $result 4]."
            exit 126
          }
          EXPECT
          chmod +x "$RUNNER_TEMP/run-probe-build.exp"
          expect "$RUNNER_TEMP/run-probe-build.exp" \
            tizen build-app \
            -m 'name:m1,compiler:gcc,rootstraps:[{"name":"iot-headed-6.0-device.core","platform":"iot-headed-6.0","arch":"arm"}],configs:[Release]' \
            -b 'name:b1,targets:[AmbilightProbeWeb,AmbilightProbeService],methods:[m1]' \
            -p 'name:p1,targets:[b1]' \
            -s AmbilightProbe \
            -- "$AMBILIGHT_PROBE_ROOT"

      - name: Collect and validate diagnostic WGT
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/probe-output"
          mkdir -p "$output"

          mapfile -d '' packages < <(find "$AMBILIGHT_PROBE_ROOT" -type f -name '*.wgt' -print0)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one WGT under $AMBILIGHT_PROBE_ROOT; found ${#packages[@]}."
            find "$AMBILIGHT_PROBE_ROOT" -maxdepth 6 -type f -printf '%p\n' | sort
            exit 1
          fi

          package="${packages[0]}"
          test -s "$package"
          file "$package"
          unzip -t "$package"
          python3 - "$package" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          package = sys.argv[1]
          expected_web_id = "AmbiProbeX.AmbilightProbeWeb"
          expected_service_id = "AmbiProbeX.ambilight-probe-service"
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              required = {"config.xml", "tizen-manifest.xml", "bin/ambilight-probe-service"}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("WGT is missing required entries: " + ", ".join(missing))
              web = ET.fromstring(archive.read("config.xml"))
              web_app = next((n for n in web.iter() if n.tag.endswith("application")), None)
              native = ET.fromstring(archive.read("tizen-manifest.xml"))
              service = next((n for n in native.iter() if n.tag.endswith("service-application")), None)
              if web_app is None or web_app.attrib.get("id") != expected_web_id:
                  raise SystemExit("Packaged web application ID does not match the probe frontend")
              if service is None or service.attrib.get("appid") != expected_service_id:
                  actual = service.attrib.get("appid") if service is not None else "missing"
                  raise SystemExit(f"Packaged native service ID mismatch: {actual}")
              if service.attrib.get("exec") != "ambilight-probe-service":
                  raise SystemExit("Packaged native service executable does not match the binary")
              print(f"Validated hybrid WGT: web={expected_web_id}; native service={expected_service_id}")
          PY
          cp "$package" "$output/"
          test -s "$output/$(basename "$package")"
          echo "Diagnostic package ready: $output/$(basename "$package")"

      - name: Upload diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: AmbilightProbe-Tizen6
          path: ${{ runner.temp }}/probe-output/
          if-no-files-found: error
          retention-days: 14
