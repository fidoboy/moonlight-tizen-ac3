name: Refresh USB installation package

on:
  # Refresh the time-limited Samsung USB demo package monthly.
  schedule:
    - cron: '0 12 15 * *'
  workflow_dispatch:
  # Retry the initial USB package when this workflow changes.
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release-usb.yml'
  # Add the USB package after a stable release has been published successfully.
  workflow_run:
    workflows:
      - Release WGTs
    types:
      - completed

permissions:
  contents: write

jobs:
  refresh-usb-package:
    if: (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (startsWith(github.event.workflow_run.head_branch, 'v') || contains(github.event.workflow_run.head_commit.message, '[release]') || github.event.workflow_run.event == 'workflow_dispatch')))
    name: Build and refresh MoonlightUSB.zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Find latest stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --exclude-pre-releases --json tagName,publishedAt --jq 'sort_by(.publishedAt) | last | .tagName')"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not identify the latest stable release tag: '$RELEASE_TAG'." >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "USB package will be rebuilt from stable release $RELEASE_TAG."

      - name: Checkout stable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(grep -oP 'version="\K[0-9]+\.[0-9]+\.[0-9]+' res/config.xml | head -n1)"
          if [[ "v$VERSION" != "$RELEASE_TAG" ]]; then
            echo "Checked-out source version $VERSION does not match stable tag $RELEASE_TAG." >&2
            exit 1
          fi
          echo "Verified stable source version $VERSION."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standard WGT from stable source
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-tizen-usb:standard
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            OFFICIAL_RELEASE=true
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract standard WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create moonlight-tizen-usb:standard)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mkdir -p dist
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" dist/Moonlight.wgt
          test -s dist/Moonlight.wgt
          sha256sum dist/Moonlight.wgt

      - name: Set up Node.js for USB package creation
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Samsung USB installation package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes zip
          npx --yes wgt-to-usb@1.0.2 ./dist/Moonlight.wgt -o ./dist/usb
          test -s dist/usb/userwidget/app.tmg
          test -s dist/usb/userwidget/widget.license
          (cd dist/usb && zip -r ../MoonlightUSB.zip userwidget)
          test -s dist/MoonlightUSB.zip
          unzip -t dist/MoonlightUSB.zip
          unzip -Z1 dist/MoonlightUSB.zip | grep -Fxq 'userwidget/app.tmg'
          unzip -Z1 dist/MoonlightUSB.zip | grep -Fxq 'userwidget/widget.license'
          sha256sum dist/MoonlightUSB.zip

      - name: Refresh USB package asset on the stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/MoonlightUSB.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "Refreshed MoonlightUSB.zip on stable release $RELEASE_TAG."
