name: Fetch Samsung ESPlus CAPI header

on:
  workflow_dispatch:
  push:
    branches:
      - 1.2.0-pre-wpm_test
    paths:
      - ".github/workflows/fetch-esplus-header.yml"

permissions:
  contents: read

jobs:
  fetch-header:
    runs-on: ubuntu-latest
    steps:
      - name: Install RPM extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm2cpio cpio

      - name: Download and inspect official Tizen source package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esplus-source"
          cd "$RUNNER_TEMP/esplus-source"
          curl --fail --location --retry 3 --output esplusplayer-1.4.6-0.src.rpm \
            https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/source/esplusplayer-1.4.6-0.src.rpm
          rpm2cpio esplusplayer-1.4.6-0.src.rpm | cpio -idm --quiet
          echo "=== Extracted package files ==="
          find . -type f -printf '%p (%s bytes)\\n' | sort
          echo "=== ESPlus CAPI headers ==="
          find . -type f \\( -name 'esplusplayer_capi.h' -o -name 'esplusplayer_internal.h' \\) -print
          test -n "$(find . -type f -name 'esplusplayer_capi.h' -print -quit)"

      - name: Upload source package and extracted headers
        uses: actions/upload-artifact@v4
        with:
          name: samsung-esplus-capi-source
          path: |
            ${{ runner.temp }}/esplus-source/esplusplayer-1.4.6-0.src.rpm
            ${{ runner.temp }}/esplus-source/**/esplusplayer_capi.h
            ${{ runner.temp }}/esplus-source/**/esplusplayer_internal.h
            ${{ runner.temp }}/esplus-source/**/*.spec
          if-no-files-found: error
          retention-days: 14
