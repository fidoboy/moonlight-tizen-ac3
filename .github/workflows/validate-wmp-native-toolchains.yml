          capture_cli_logs final
          tar -czf "$RUNNER_TEMP/wmp-native-build-report.tar.gz" -C "$report" .
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more ServiceApp reference builds failed."
            exit 1
          fi

      - name: Upload native build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wmp-native-toolchain-validation
          path: |
            ${{ runner.temp }}/wmp-native-build-report.tar.gz
            ${{ runner.temp }}/sdk-install-environment.txt
          if-no-files-found: warn
          retention-days: 7
