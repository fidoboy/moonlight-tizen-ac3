            echo
            echo "### Available rootstraps"
            tizen list rootstrap 2>&1 || true
            echo
            echo "### Relevant SDK directories"
            find "$HOME" "$sdk" -maxdepth 5 -type d \( -iname '*log*' -o -iname '*cli*' \) -print 2>/dev/null | sort || true
          } > "$report/environment.txt"
          cp "$RUNNER_TEMP/sdk-install-environment.txt" "$report/" 2>/dev/null || true
          capture_cli_logs final
          tar -czf "$RUNNER_TEMP/wmp-native-build-report.tar.gz" -C "$report" .
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more ServiceApp reference builds failed."
            exit 1
          fi

      - name: Upload experimental hybrid WGT
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-WMP-Hybrid-Experimental-${{ github.sha }}
          path: ${{ runner.temp }}/Moonlight-WMP-Hybrid-Experimental.wgt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native build report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wmp-native-toolchain-validation
          path: |
            ${{ runner.temp }}/wmp-native-build-report.tar.gz
            ${{ runner.temp }}/sdk-install-environment.txt
          if-no-files-found: warn
          retention-days: 7