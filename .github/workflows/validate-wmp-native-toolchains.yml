name: Validate native ServiceApp toolchains for WMP

on:
  push:
    branches:
      - wpm_experimental
    paths:
      - '.github/workflows/validate-wmp-native-toolchains.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'h264bitstream/**'
      - 'libgamestream/**'
      - 'moonlight-common-c/**'
      - 'opus/**'
      - 'ports/**'
      - 'res/**'
      - 'wasm/**'
      - 'native/wmp-service/**'
      - 'scripts/generate-build-videos.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout the WMP test branch only
        uses: actions/checkout@v5
        with:
          ref: wpm_experimental
          submodules: recursive

      - name: Ensure required versioned MP4 assets are available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset_file="moonlight-generated-videos-v1.zip"
          asset_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/build-assets/${asset_file}"
          asset_path="$RUNNER_TEMP/${asset_file}"
          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/generate-video-assets.yml/dispatches"
          mkdir -p generated-videos
          download_asset() {
            curl --silent --show-error --location --output "$asset_path" --write-out '%{http_code}' "$asset_url"
          }
          status="$(download_asset)"
          if [[ "$status" == "404" ]]; then
            echo "Video asset ZIP is missing; dispatching its generator."
            dispatch_status="$(curl --silent --show-error --output "$RUNNER_TEMP/video-assets-dispatch.json" --write-out '%{http_code}' \
              --request POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data '{"ref":"master"}' \
              "$api_url")"
            if [[ "$dispatch_status" != "204" ]]; then
              cat "$RUNNER_TEMP/video-assets-dispatch.json" >&2 || true
              echo "::error::Could not dispatch the video-asset generator (HTTP $dispatch_status)."
              exit 1
            fi
            status="404"
            for attempt in $(seq 1 120); do
              sleep 10
              status="$(download_asset)"
              [[ "$status" == "200" ]] && break
              if [[ "$status" != "404" && "$status" != "502" && "$status" != "503" && "$status" != "504" ]]; then
                echo "::error::Unexpected HTTP $status while waiting for video assets."
                exit 1
              fi
            done
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Could not retrieve generated video assets (HTTP $status)."
            exit 1
          fi
          unzip -tq "$asset_path"
          unzip -oq "$asset_path" -d generated-videos
          for video in launch-screen.mp4 launch-screen-portrait.mp4; do
            test -s "generated-videos/$video" || {
              echo "::error::Missing generated-videos/$video"
              exit 1
            }
          done
          echo "MOONLIGHT_VIDEO_ASSETS=ready"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the real Moonlight web WGT
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: moonlight-wmp-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=release
            REPO_OWNER=${{ github.repository_owner }}
            REPO_NAME=${{ github.event.repository.name }}
            FORCE_GAME_MODE=false

      - name: Extract the real Moonlight web WGT
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker create "moonlight-wmp-web:${GITHUB_SHA}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/home/moonlight/Moonlight.wgt" "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          test -s "$RUNNER_TEMP/Moonlight-Web-Base.wgt"
          sha256sum "$RUNNER_TEMP/Moonlight-Web-Base.wgt"

      - name: Install Tizen Native SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends expect software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3.8 libpython3.8
          installer="$RUNNER_TEMP/tizen-web-cli.bin"
          curl --fail --location --retry 3 --output "$installer" \
            https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin
          chmod +x "$installer"
          "$installer" --accept-license "$RUNNER_TEMP/tizen-studio"
          sdk="$RUNNER_TEMP/tizen-studio"
          pm="$(find "$sdk" -type f -name 'package-manager-cli*' -perm -u+x -print -quit)"
          test -n "$pm"
          required=(NativeCLI NativeToolchain-Gcc-9.2 NativeToolchain-Gcc-14.2 IOT-Headed-6.0-NativeAppDevelopment-CLI TIZEN-10.0-NativeAppDevelopment-CLI)
          "$pm" install --accept-license --no-java-check "$(IFS=,; echo "${required[*]}")"
          echo "$sdk/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$sdk/tools" >> "$GITHUB_PATH"
          {
            echo "HOME=$HOME"
            echo "RUNNER_TEMP=$RUNNER_TEMP"
            echo "SDK=$sdk"
            echo "PACKAGE_MANAGER=$pm"
            echo "### Tizen version"
            tizen version 2>&1 || true
            echo "### Rootstraps"
            tizen list rootstrap 2>&1 || true
            echo "### SDK log files"
            find "$HOME" "$sdk" -type f \( -iname '*.log' -o -iname '*.log.*' \) -print 2>/dev/null | sort || true
          } > "$RUNNER_TEMP/sdk-install-environment.txt"

      - name: Generate and compile reference ServiceApp projects
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/native-build-report"
          sdk="$RUNNER_TEMP/tizen-studio"
          mkdir -p "$report/cli-logs"
          failed=0

          capture_cli_logs() {
            label="$1"
            index=0
            while IFS= read -r source; do
              [ -f "$source" ] || continue
              index=$((index + 1))
              safe="$(printf '%s' "$source" | sed 's#^/##; s#[^A-Za-z0-9._-]#_#g')"
              destination="$report/cli-logs/$label-$index-$safe"
              mkdir -p "$(dirname "$destination")"
              cp -p "$source" "$destination"
            done < <(
              find "$HOME" "$sdk" "$RUNNER_TEMP" -type f \( -iname '*.log' -o -iname '*.log.*' \) \
                ! -path "$report/*" -print 2>/dev/null | sort -u
            )
            find "$report/cli-logs" -type f -printf '%P\n' | sort > "$report/cli-log-index.txt"
          }

          run_profile_command() {
            label="$1"
            log="$2"
            shift 2
            echo "COMMAND ($label): $*" | tee -a "$log"
            "$@" >>"$log" 2>&1
            status=$?
            echo "EXIT_CODE ($label): $status" | tee -a "$log"
            capture_cli_logs "$label"
            return "$status"
          }

          {
            echo "### build-native command manual"
            tizen manual build-native 2>&1 || true
            echo
            echo "### CLI configuration"
            tizen cli-config -l 2>&1 || true
          } > "$report/build-native-cli-reference.txt"

          build_profile() {
            profile="$1"
            rootstrap="$2"
            project_root="$RUNNER_TEMP/ServiceApp-$profile"
            project="$project_root/WmpServiceProbe"
            log="$report/$profile-build.log"
            echo "=== PROFILE=$profile ROOTSTRAP=$rootstrap ===" | tee "$log"

            if run_profile_command "$profile-create" "$log" tizen create native-project -p "$profile" -t ServiceApp -n WmpServiceProbe -- "$project_root"; then
              echo "CREATE_RESULT=success" | tee -a "$log"
            else
              status=$?
              if [ "$profile" = "iot-headed-6.0" ]; then
                # The Tizen 6.1 CLI cannot generate this ServiceApp template
                # (its project generator fails before creating the project).
                # The independent rootstrap probe below validates the IoT ARM
                # compiler/linker using the Tizen 10 skeleton instead.
                echo "CREATE_RESULT=unsupported_by_installed_sdk exit_code=$status" | tee -a "$log"
                echo "CREATE_FALLBACK=independent_iot_rootstrap_probe" | tee -a "$log"
                return
              fi
              echo "CREATE_RESULT=failed exit_code=$status" | tee -a "$log"
              failed=1
              return
            fi

            if [ ! -f "$project/project_def.prop" ]; then
              echo "PROJECT_VALIDATION=failed missing=$project/project_def.prop" | tee -a "$log"
              failed=1
              return
            fi
            echo "PROJECT_DIR=$project" | tee -a "$log"
            echo "PROJECT_VALIDATION=success project_def.prop found" | tee -a "$log"

            find "$project" -maxdepth 5 -type f -printf '%P\n' | sort > "$report/$profile-files.txt"
            tar -czf "$report/$profile-template.tar.gz" -C "$project_root" WmpServiceProbe

            if run_profile_command "$profile-build" "$log" tizen build-native -a arm -c gcc -C Release -r "$rootstrap" -- "$project"; then
              echo "BUILD_RESULT=success" | tee -a "$log"
              find "$project/Release" -maxdepth 4 -type f -printf '%P\n' 2>/dev/null | sort > "$report/$profile-output-files.txt" || true
              find "$project/Release" -type f -exec file {} \; > "$report/$profile-output-file-types.txt" 2>/dev/null || true
            else
              status=$?
              echo "BUILD_RESULT=failed exit_code=$status" | tee -a "$log"
              failed=1
            fi
          }

          build_profile iot-headed-6.0 iot-headed-6.0-device.core
          build_profile tizen-10.0 tizen-10.0-device.core

          # Independent rootstrap probe: reuse the successfully generated Tizen 10
          # ServiceApp skeleton, retarget its project metadata to IoT Headed 6.0,
          # then compile it against the actual IoT Headed ARMEL rootstrap.
          # This deliberately does NOT claim that the IoT Headed template generator works.
          source_project="$RUNNER_TEMP/ServiceApp-tizen-10.0/WmpServiceProbe"
          probe_root="$RUNNER_TEMP/ServiceApp-iot-headed-6.0-rootstrap-probe"
          probe="$probe_root/WmpServiceProbe"
          probe_log="$report/iot-headed-6.0-rootstrap-probe.log"
          echo "=== INDEPENDENT IOT-HEADED 6.0 ROOTSTRAP PROBE ===" | tee "$probe_log"
          if [ -f "$source_project/project_def.prop" ]; then
            mkdir -p "$probe_root"
            cp -a "$source_project" "$probe"
            sed -i 's/profile = tizen-10.0/profile = iot-headed-6.0/' "$probe/project_def.prop"
            sed -i 's/api-version="10.0"/api-version="6.0"/; s/<profile name="tizen" \/>/<profile name="iot-headed" \/>/' "$probe/tizen-manifest.xml"
            if [ -f "$probe/.tproject" ]; then
              sed -i 's/tizen-10.0/iot-headed-6.0/g' "$probe/.tproject"
            fi

            # Remove the Tizen 10 library catalogue from both linker configurations.
            # This probe has no Tizen API dependencies: it tests only ARM compile/link
            # against the IoT Headed 6.0 rootstrap.
            python3 - "$probe/.cproject" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(<option[^>]*superClass="sbi[.]gnu[.]cpp[.]linker[.]option[.]frameworks_lflags[.]core"[^>]*>)'
              r'.*?'
              r'(</option>)',
              re.DOTALL,
          )
          sysroot = "${" + "SBI_SYSROOT}"
          minimal = "\n".join([
              '                                    <listOptionValue builtIn="false" value="-Wl,-z,relro,--as-needed"/>',
              '                                    <listOptionValue builtIn="false" value="--sysroot=&quot;' + sysroot + '&quot;"/>',
              '                                    <listOptionValue builtIn="false" value="-L&quot;' + sysroot + '/usr/lib64&quot;"/>',
          ])
          content, count = pattern.subn(
              lambda match: match.group(1) + "\n" + minimal + "\n                                " + match.group(2),
              content,
          )
          if count != 2:
              raise SystemExit(f"Expected 2 linker library lists, found {count}")
          if re.search(r'<listOptionValue[^>]+value="-l', content):
              raise SystemExit("Unexpected explicit -l library remains in .cproject")

          # The Tizen 10 template also carries SBI platform-catalogue selectors.
          # They generate Release/platform_libs.file and reintroduce Tizen 10
          # libraries even after frameworks_lflags has been cleaned.
          stale_selectors = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option"[^>]*>'
              r'.*?</option>',
              re.DOTALL,
          )
          content, selector_count = stale_selectors.subn("", content)
          if selector_count != 4:
              raise SystemExit(
                  f"Expected 4 stale SBI platform selectors, found {selector_count}"
              )

          native_api_catalogues = re.compile(
              r'<option[^>]*superClass="sbi[.]gnu[.](?:c|cpp)[.]compiler[.]option[.]frameworks[.]core"[^>]*>'
              r'.*?</option>',
              re.DOTALL,
          )
          content, catalogue_count = native_api_catalogues.subn("", content)
          if catalogue_count != 4:
              raise SystemExit(
                  f"Expected 4 Native_API catalogues, found {catalogue_count}"
              )

          if "tizen-10.0-emulator64.core_gcc92.x86.64" in content:
              raise SystemExit("Tizen 10 SBI platform selector remains")
          if re.search(r'value="Native_API"', content):
              raise SystemExit("Native_API platform catalogue remains")
          path.write_text(content, encoding="utf-8")
          print(f"LINKER_CONFIGURATIONS_CLEANED={count}")
          print(f"SBI_PLATFORM_SELECTORS_REMOVED={selector_count}")
          print(f"NATIVE_API_CATALOGUES_REMOVED={catalogue_count}")
          PY

            # The IoT rootstrap's generated library catalogue contains linker names
            # that are not shipped in its ARMEL sysroot. This source has no Tizen API
            # dependencies, so bypass that catalogue for this isolated compiler/linker probe.
            python3 - "$probe/Build/platform.mk" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          content, count = re.subn(
              r"^RS_LIBRARIES := .*?$",
              "# Dependency-free rootstrap probe: no platform libraries are required." + chr(10) + "RS_LIBRARIES :=",
              content,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"Expected one RS_LIBRARIES assignment in {path}, found {count}")
          path.write_text(content, encoding="utf-8")
          print("ROOTSTRAP_PLATFORM_LIBRARY_CATALOGUE=disabled_for_dependency_free_probe")
          PY

            # The generated makefile references @$(RS_LIBRARIES_FILE) unconditionally.
            # Keep an empty response file so the linker receives @path, not a bare @.
            python3 - "$probe/Build/makefile.mk" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8")
          old = """ifneq ($(strip $(RS_LIBRARIES)),)
          RS_LIBRARIES_FILE := $(OBJ_OUTPUT)/platform_libs.file
          endif"""
          new = """RS_LIBRARIES_FILE := $(OBJ_OUTPUT)/platform_libs.file"""
          if content.count(old) != 1:
              raise SystemExit("Expected exactly one conditional RS_LIBRARIES_FILE assignment")
          path.write_text(content.replace(old, new), encoding="utf-8")
          print("ROOTSTRAP_EMPTY_LIBRARY_RESPONSE_FILE=enabled")
          PY

            # The copied Tizen 10 template contains generated Release outputs.
            # In particular, platform_libs.file is a stale Tizen 10 linker catalogue;
            # remove it so make regenerates an empty response file from platform.mk.
            rm -f "$probe/Release/platform_libs.file"
            echo "ROOTSTRAP_STALE_LIBRARY_RESPONSE_FILE=removed" | tee -a "$probe_log"

            # Dependency-free C entry point: test the ARM compiler and linker,
            # not the availability of ServiceApp or other Tizen framework APIs.
            cat > "$probe/src/wmpserviceprobe.c" <<'C'
          int main(void)
          {
              return 0;
          }
          C

            {
              echo "SOURCE_PROJECT=$source_project"
              echo "PROBE_PROJECT=$probe"
              echo "ROOTSTRAP=iot-headed-6.0-device.core"
              echo "### project_def.prop"
              cat "$probe/project_def.prop"
              echo "### tizen-manifest.xml"
              cat "$probe/tizen-manifest.xml"
              echo "### .tproject"
              cat "$probe/.tproject" 2>/dev/null || true
            } | tee -a "$probe_log"
            tar -czf "$report/iot-headed-6.0-rootstrap-probe-source.tar.gz" -C "$probe_root" WmpServiceProbe
            if run_profile_command "iot-headed-6.0-rootstrap-probe" "$probe_log" tizen build-native -a arm -c gcc -C Release -r iot-headed-6.0-device.core -- "$probe"; then
              probe_binary="$probe/Release/wmpserviceprobe"
              if [ ! -f "$probe_binary" ]; then
                echo "ROOTSTRAP_PROBE_RESULT=failed missing_output=$probe_binary" | tee -a "$probe_log"
                failed=1
              else
                if [ -f "$probe/Release/platform_libs.file" ]; then
                  response_size="$(wc -c < "$probe/Release/platform_libs.file" | tr -d ' ')"
                  echo "ROOTSTRAP_PLATFORM_LIBRARIES_FILE_SIZE=$response_size" | tee -a "$probe_log"
                  sed -n '1,80p' "$probe/Release/platform_libs.file" | while IFS= read -r entry; do
                    echo "ROOTSTRAP_PLATFORM_LIBRARIES_ENTRY=$entry"
                  done | tee -a "$probe_log"
                else
                  echo "ROOTSTRAP_PLATFORM_LIBRARIES_FILE=missing" | tee -a "$probe_log"
                fi
                machine="$(readelf -h "$probe_binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
                echo "ROOTSTRAP_PROBE_ELF_MACHINE=$machine" | tee -a "$probe_log"
                case "$machine" in
                  ARM*) echo "ROOTSTRAP_PROBE_RESULT=success" | tee -a "$probe_log" ;;
                  *) echo "ROOTSTRAP_PROBE_RESULT=failed unexpected_elf_machine=$machine" | tee -a "$probe_log"; failed=1 ;;
                esac
              fi
              find "$probe/Release" -maxdepth 4 -type f -printf '%P\n' 2>/dev/null | sort > "$report/iot-headed-6.0-rootstrap-probe-output-files.txt" || true
              find "$probe/Release" -type f -exec file {} \; > "$report/iot-headed-6.0-rootstrap-probe-output-file-types.txt" 2>/dev/null || true
            else
              status=$?
              echo "ROOTSTRAP_PROBE_RESULT=failed exit_code=$status" | tee -a "$probe_log"
              failed=1
            fi
          else
            echo "ROOTSTRAP_PROBE_RESULT=skipped; Tizen 10.0 reference template was not generated" | tee -a "$probe_log"
            failed=1
          fi

          # Compile the actual WMP service sources against the IoT Headed 6.0
          # rootstrap headers. Build a static archive first so this stage isolates
          # source/header compatibility from the separate executable link step.
          if [ -f "$probe/project_def.prop" ] && grep -q '^ROOTSTRAP_PROBE_RESULT=success$' "$probe_log"; then
            service_probe_log="$report/iot-headed-6.0-wmp-service-source-build.log"
            echo "=== ACTUAL WMP SERVICE SOURCE BUILD (COMPILE-ONLY ARCHIVE) ===" | tee "$service_probe_log"
            cp "$GITHUB_WORKSPACE/native/wmp-service/src/main.c" "$probe/src/main.c"
            cp "$GITHUB_WORKSPACE/native/wmp-service/src/wmp_esplus_abi.c" "$probe/src/wmp_esplus_abi.c"
            cp "$GITHUB_WORKSPACE/native/wmp-service/src/wmp_esplus_abi.h" "$probe/src/wmp_esplus_abi.h"
            cat > "$probe/project_def.prop" <<'PROP'
          APPNAME = wmpservice

          type = staticLib
          profile = iot-headed-6.0

          USER_SRCS = src/main.c src/wmp_esplus_abi.c
          USER_DEFS =
          USER_INC_DIRS = src
          USER_OBJS =
          USER_LIBS =
          USER_EDCS =
          PROP
            rm -rf "$probe/Release"
            tar -czf "$report/iot-headed-6.0-wmp-service-source.tar.gz" -C "$probe_root" WmpServiceProbe
            if run_profile_command "iot-headed-6.0-wmp-service-source" "$service_probe_log" tizen build-native -a arm -c gcc -C Release -r iot-headed-6.0-device.core -- "$probe"; then
              archive="$probe/Release/libwmpservice.a"
              if [ ! -f "$archive" ]; then
                echo "SERVICE_SOURCE_COMPILE_RESULT=failed missing_archive=$archive" | tee -a "$service_probe_log"
                failed=1
              else
                echo "SERVICE_SOURCE_ARCHIVE=$archive" | tee -a "$service_probe_log"
                for object in "$probe/Release/src/main.o" "$probe/Release/src/wmp_esplus_abi.o"; do
                  if [ ! -f "$object" ]; then
                    echo "SERVICE_SOURCE_OBJECT=missing path=$object" | tee -a "$service_probe_log"
                    failed=1
                    continue
                  fi
                  machine="$(readelf -h "$object" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
                  echo "SERVICE_SOURCE_OBJECT=$(basename "$object") ELF_MACHINE=$machine" | tee -a "$service_probe_log"
                  case "$machine" in
                    ARM*) ;;
                    *) echo "SERVICE_SOURCE_OBJECT_RESULT=failed unexpected_elf_machine=$machine" | tee -a "$service_probe_log"; failed=1 ;;
                  esac
                done
                if [ "$failed" -eq 0 ]; then
                  echo "SERVICE_SOURCE_COMPILE_RESULT=success" | tee -a "$service_probe_log"
                else
                  echo "SERVICE_SOURCE_COMPILE_RESULT=failed" | tee -a "$service_probe_log"
                fi
              fi
              find "$probe/Release" -maxdepth 4 -type f -printf '%P\n' 2>/dev/null | sort > "$report/iot-headed-6.0-wmp-service-source-output-files.txt" || true
              find "$probe/Release" -type f -exec file {} \; > "$report/iot-headed-6.0-wmp-service-source-output-file-types.txt" 2>/dev/null || true
            else
              status=$?
              echo "SERVICE_SOURCE_COMPILE_RESULT=failed exit_code=$status" | tee -a "$service_probe_log"
              failed=1
            fi
          else
            echo "SERVICE_SOURCE_COMPILE_RESULT=skipped; IoT rootstrap probe did not succeed" | tee "$report/iot-headed-6.0-wmp-service-source-build.log"
            failed=1
          fi

          # Link in a fresh copy of the untouched reference ServiceApp template.
          # The rootstrap probe above intentionally strips Native_API catalogues;
          # never reuse that project for a framework-dependent ServiceApp link.
          if [ -f "$probe/Release/libwmpservice.a" ] && grep -q '^SERVICE_SOURCE_COMPILE_RESULT=success$' "$service_probe_log"; then
            link_probe_root="$RUNNER_TEMP/ServiceApp-iot-headed-6.0-wmp-link"
            link_probe="$link_probe_root/WmpServiceProbe"
            link_probe_log="$report/iot-headed-6.0-wmp-service-link.log"
            echo "=== ACTUAL WMP SERVICE EXECUTABLE LINK (FRESH SERVICEAPP TEMPLATE) ===" | tee "$link_probe_log"

            if [ ! -f "$source_project/.cproject" ] || [ ! -f "$source_project/Build/platform.mk" ]; then
              echo "SERVICE_LINK_RESULT=failed missing_reference_native_build_configuration" | tee -a "$link_probe_log"
              failed=1
            else
              mkdir -p "$link_probe_root"
              cp -a "$source_project" "$link_probe"
              cp "$GITHUB_WORKSPACE/native/wmp-service/src/main.c" "$link_probe/src/main.c"
              cp "$GITHUB_WORKSPACE/native/wmp-service/src/wmp_esplus_abi.c" "$link_probe/src/wmp_esplus_abi.c"
              cp "$GITHUB_WORKSPACE/native/wmp-service/src/wmp_esplus_abi.h" "$link_probe/src/wmp_esplus_abi.h"
              cp "$GITHUB_WORKSPACE/native/wmp-service/tizen-manifest.xml" "$link_probe/tizen-manifest.xml"

              # Retarget the project metadata to IoT Headed 6.0.
              sed -i 's/profile = tizen-10.0/profile = iot-headed-6.0/' "$link_probe/project_def.prop"
              sed -i 's/api-version="10.0"/api-version="6.0"/; s/<profile name="tizen" \/>/<profile name="iot-headed" \/>/' "$link_probe/tizen-manifest.xml"
              if [ -f "$link_probe/.tproject" ]; then
                sed -i 's/tizen-10.0/iot-headed-6.0/g' "$link_probe/.tproject"
              fi

              # The reference template is generated for Tizen 10. Its SBI
              # platform selector and explicit Native_API linker list belong
              # to that profile and must not leak into an IoT Headed 6.0 link.
