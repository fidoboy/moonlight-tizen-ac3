              find "$project/Release" -type f -exec file {} \; > "$report/$profile-output-file-types.txt" 2>/dev/null || true
            else
              status=$?
              echo "BUILD_RESULT=failed exit_code=$status" | tee -a "$log"
              failed=1
            fi
          }

          build_profile iot-headed-6.0 iot-headed-6.0-device.core
          build_profile tizen-10.0 tizen-10.0-device.core

          # Independent rootstrap probe: reuse the successfully generated Tizen 10
          # ServiceApp skeleton, retarget its project metadata to IoT Headed 6.0,
          # then compile it against the actual IoT Headed ARMEL rootstrap.
          # This deliberately does NOT claim that the IoT Headed template generator works.
          source_project="$RUNNER_TEMP/ServiceApp-tizen-10.0/WmpServiceProbe"
          probe_root="$RUNNER_TEMP/ServiceApp-iot-headed-6.0-rootstrap-probe"
          probe="$probe_root/WmpServiceProbe"
          probe_log="$report/iot-headed-6.0-rootstrap-probe.log"
          echo "=== INDEPENDENT IOT-HEADED 6.0 ROOTSTRAP PROBE ===" | tee "$probe_log"
          if [ -f "$source_project/project_def.prop" ]; then
            mkdir -p "$probe_root"
            cp -a "$source_project" "$probe"
            sed -i 's/profile = tizen-10.0/profile = iot-headed-6.0/' "$probe/project_def.prop"
            sed -i 's/api-version="10.0"/api-version="6.0"/; s/<profile name="tizen" \/>/<profile name="iot-headed" \/>/' "$probe/tizen-manifest.xml"
