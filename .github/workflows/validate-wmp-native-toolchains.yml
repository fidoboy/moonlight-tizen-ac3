              status=$?
              echo "ROOTSTRAP_PROBE_RESULT=failed exit_code=$status" | tee -a "$probe_log"
              failed=1
            fi
          else
            echo "ROOTSTRAP_PROBE_RESULT=skipped; Tizen 10.0 reference template was not generated" | tee -a "$probe_log"
