name: Validate GitHub Actions workflows

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflow configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # The two release workflows are excluded because they contain pre-existing actionlint findings.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2
        with:
          version: 1.7.7
          files: .github/workflows/*.yml,!.github/workflows/release-development.yml,!.github/workflows/release-stable.yml
          shellcheck: false
          pyflakes: false
