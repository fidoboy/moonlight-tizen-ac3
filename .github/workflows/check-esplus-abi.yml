name: Check ESPlus ARM32 ABI

on:
  workflow_dispatch:
  push:
    branches:
      - 1.2.0-pre-wpm_test
    paths:
      - "tools/esplus-abi-checker/**"
      - ".github/workflows/check-esplus-abi.yml"

permissions:
  contents: read

jobs:
  arm32-layout:
    name: Compile and verify ARM32 ABI layouts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM32 cross-compiler and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-linux-gnueabi qemu-user rpm2cpio cpio

      - name: Download official Samsung ESPlus source header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esplus-source"
          cd "$RUNNER_TEMP/esplus-source"
          curl --fail --location --retry 3 --output esplusplayer-1.4.6-0.src.rpm \
            https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/source/esplusplayer-1.4.6-0.src.rpm
          rpm2cpio esplusplayer-1.4.6-0.src.rpm | cpio -idm --quiet
          tar -xzf esplusplayer-1.4.6.tar.gz
          test -f esplusplayer-1.4.6/include/esplusplayer_capi/esplusplayer_capi.h

      - name: Download historical Tizen 6.5 ESPlus 0.0.3 headers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esplus-065"
          cd "$RUNNER_TEMP/esplus-065"
          curl --fail --location --retry 3 --output esplusplayer-0.0.3-0.src.rpm \
            https://download.tizen.org/snapshots/TIZEN/Tizen-6.5/Tizen-6.5-Unified/latest/repos/standard/source/esplusplayer-0.0.3-0.src.rpm
          rpm2cpio esplusplayer-0.0.3-0.src.rpm | cpio -idm --quiet
          tar -xzf esplusplayer-0.0.3.tar.gz
          test -f esplusplayer-0.0.3/include/esplusplayer_capi/stream.h
          test -f esplusplayer-0.0.3/include/esplusplayer_capi/espacket.h

      - name: Compile and run ABI checker
        shell: bash
        env:
          CC: arm-linux-gnueabi-gcc
          RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
          OUT: ${{ runner.temp }}/esplus-abi-report
          LOG_FILE: ${{ runner.temp }}/esplus-abi-check.log
          ESPLUS_INCLUDE_DIR: ${{ runner.temp }}/esplus-source/esplusplayer-1.4.6/include
        run: |
          set -o pipefail
          chmod +x tools/esplus-abi-checker/build-abi-check.sh
          tools/esplus-abi-checker/build-abi-check.sh 2>&1 | tee "$LOG_FILE"

      - name: Compare historical Tizen 6.5 CAPI header
        shell: bash
        env:
          CC: arm-linux-gnueabi-gcc
          RUNNER: qemu-arm -L /usr/arm-linux-gnueabi
          CFLAGS: -std=c11 -O0 -Wall -Wextra -Werror -marm -march=armv7-a -mabi=aapcs-linux -mfloat-abi=softfp
          OLD_ESPLUS_INCLUDE_DIR: ${{ runner.temp }}/esplus-065/esplusplayer-0.0.3/include
          OUT: ${{ runner.temp }}/esplus-old-abi
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          "$CC" $CFLAGS -I"$OLD_ESPLUS_INCLUDE_DIR" -DESPLUS_NATIVE_ADAPTER='"esplus_native_adapter.h"' tools/esplus-abi-checker/native_layout.c -o "$OUT/native-layout-065"
          $RUNNER "$OUT/native-layout-065" | tee "$OUT/report.txt"

      - name: Upload ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esplus-arm32-abi-report
          path: |
            ${{ runner.temp }}/esplus-abi-check.log
            ${{ runner.temp }}/esplus-abi-report/
          if-no-files-found: warn
          retention-days: 14
